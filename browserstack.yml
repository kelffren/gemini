# Kelo World real-device release-gate profile.
# Credentials are intentionally not committed. Set BROWSERSTACK_USERNAME and
# BROWSERSTACK_ACCESS_KEY in the environment or GitHub Actions secrets.
userName: YOUR_USERNAME
accessKey: YOUR_ACCESS_KEY

projectName: KeloWorld
buildName: WorldReleaseGateRealIOS
buildIdentifier: '#${BUILD_NUMBER}'

platforms:
  - browserName: safari
    osVersion: 26
    deviceName: iPhone 14 Pro
    playwrightConfigOptions:
      name: ios-real-iphone-14-pro
      use:
        # Real iOS owns the device media preferences. Playwright >=1.50 defaults
        # reducedMotion to "no-preference", but BrowserStack real iOS requires
        # the system/default value (reported as "none") when creating context.
        # Explicit null prevents the SDK-generated config from sending desktop
        # media emulation to the physical iPhone session.
        reducedMotion: null

parallelsPerPlatform: 1

# PR candidates are served from the GitHub Actions runner and reached through
# BrowserStack Local. The same tunnel remains enabled for post-deploy LIVE checks.
browserstackLocal: true

framework: playwright
source: kelo-world-release-gate

debug: true
networkLogs: true
consoleLogs: errors
testObservability: true
