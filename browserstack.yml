# Kelo World real-device test profile.
# Credentials are intentionally not committed. Set BROWSERSTACK_USERNAME and
# BROWSERSTACK_ACCESS_KEY in the environment or GitHub Actions secrets.
userName: YOUR_USERNAME
accessKey: YOUR_ACCESS_KEY

projectName: KeloWorld
buildName: MapForgeRealIOS
buildIdentifier: '#${BUILD_NUMBER}'

platforms:
  - browserName: safari
    osVersion: 26
    deviceName: iPhone 14 Pro
    playwrightConfigOptions:
      name: ios-real-iphone-14-pro

parallelsPerPlatform: 1

# Kelo World is tested against the public GitHub Pages deployment, so no tunnel is needed.
browserstackLocal: false

framework: playwright
source: kelo-world-map-forge

debug: true
networkLogs: true
consoleLogs: errors
testObservability: true
