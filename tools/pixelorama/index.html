<!doctype html>
<!-- KELO-INDEX
 area: CREATORS / PIXELORAMA WEB RUNTIME
 owner: Kelo Creators
 keys: PIXELORAMA GODOT WASM LAZY SAME-ORIGIN BRIDGE ARRAYBUFFER QUIT UNLOAD MEMORY
 purpose: shell Kelo same-origin que arranca el build Web completo de Pixelorama solo bajo demanda y lo destruye al salir
 online: authoring local; no gameplay/economy authority
 do-not: NO service worker propio, NO boot eager, NO duplicar binarios en gemini
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090b0d">
  <title>Kelo Pixelorama Pro</title>
  <style>
    html,body,#canvas{margin:0;padding:0;border:0;width:100%;height:100%;overflow:hidden;background:#090b0d}
    body{touch-action:none;color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif}
    #canvas{display:block;outline:none}
    #status{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:#090b0d;padding:24px;text-align:center}
    #status[hidden]{display:none}
    .card{max-width:320px}.mark{font-size:11px;font-weight:950;letter-spacing:.16em;color:#e6ca7f}.copy{margin-top:10px;font-size:10px;line-height:1.5;color:#91a19b}.bar{height:3px;margin-top:14px;background:#192124;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;width:28%;background:#d8b45f;animation:load 1.1s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(250%)}}
    #bridge-note{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:8;padding:6px 8px;border:1px solid rgba(232,199,116,.24);border-radius:9px;background:rgba(3,5,6,.82);font-size:9px;line-height:1.35;color:#d9e0dc;pointer-events:none;opacity:0;transition:opacity .2s}#bridge-note.show{opacity:1}
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0">Your browser does not support canvas.</canvas>
  <div id="status"><div class="card"><div class="mark">KELO · PIXELORAMA PRO</div><div id="status-copy" class="copy">Loading professional pixel editor only for this creator session…</div><div class="bar"><i></i></div></div></div>
  <div id="bridge-note"></div>
<script>
(() => {
  'use strict';
  const PROTOCOL='kelo.pixelorama.v1';
  // Pinned immutable upstream Web deployment. Heavy binaries stay out of gemini Git history.
  const UPSTREAM_COMMIT='2af0e590b6f1dd8a9255686373c5831623bb03bd';
  const BASE=`https://cdn.jsdelivr.net/gh/Orama-Interactive/Pixelorama@${UPSTREAM_COMMIT}`;
  const status=document.getElementById('status'),statusCopy=document.getElementById('status-copy'),note=document.getElementById('bridge-note'),canvas=document.getElementById('canvas');
  let engine=null,pendingAsset=null,openHookInstalled=false,shuttingDown=false,nativeAnchorClick=null;

  const tell=(type,payload={},transfer=[])=>{
    try{parent.postMessage({protocol:PROTOCOL,type,payload},location.origin,transfer);}catch(error){console.warn('[Kelo Pixelorama] postMessage failed',error);}
  };
  function showNote(text,ms=4200){note.textContent=text;note.classList.add('show');if(ms>0)setTimeout(()=>note.classList.remove('show'),ms);}
  function setStatus(text){statusCopy.textContent=text;}
  function loadScript(src){return new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=src;script.onload=resolve;script.onerror=()=>reject(new Error(`PIXELORAMA_ENGINE_SCRIPT_FAILED:${src}`));document.head.append(script);});}

  // Capture Godot browser downloads and route them back to Kelo instead of leaving the game.
  function installDownloadBridge(){
    if(nativeAnchorClick)return;
    nativeAnchorClick=HTMLAnchorElement.prototype.click;
    HTMLAnchorElement.prototype.click=function(){
      const anchor=this,href=String(anchor.href||''),filename=String(anchor.download||'');
      if(filename&&href.startsWith('blob:')){
        void (async()=>{
          try{
            const blob=await fetch(href).then(r=>r.blob()),buffer=await blob.arrayBuffer();
            tell('export',{name:filename,mime:blob.type||'application/octet-stream',buffer},[buffer]);
            showNote(`${filename} sent directly to Kelo.`);
          }catch(error){tell('error',{code:'EXPORT_CAPTURE_FAILED',message:String(error?.message||error)});nativeAnchorClick.call(anchor);}
        })();
        return;
      }
      return nativeAnchorClick.call(anchor);
    };
  }

  function feedPendingAsset(){
    if(!pendingAsset)return false;
    try{
      // Pixelorama's current Web file exchange defines these globals through JavaScriptBridge.eval.
      window.fileData=pendingAsset.buffer;
      window.fileType=pendingAsset.mime||'image/png';
      window.fileName=pendingAsset.name||'kelo-asset.png';
      window.canceled=false;
      pendingAsset=null;
      setTimeout(()=>window.dispatchEvent(new Event('focus')),20);
      showNote('Kelo asset injected into Pixelorama.');
      return true;
    }catch(error){tell('error',{code:'ASSET_INJECT_FAILED',message:String(error?.message||error)});return false;}
  }

  function installOpenBridge(){
    if(openHookInstalled||typeof window.upload_image!=='function')return false;
    const original=window.upload_image;
    window.upload_image=function(){if(pendingAsset&&feedPendingAsset())return;return original.apply(this,arguments);};
    openHookInstalled=true;return true;
  }

  function tryOpenShortcut(){
    if(!pendingAsset)return;
    // Best effort for stock Pixelorama. The pinned Kelo fork blueprint exposes a direct GDScript bridge.
    for(const target of [canvas,document]){
      try{target.dispatchEvent(new KeyboardEvent('keydown',{key:'o',code:'KeyO',ctrlKey:true,bubbles:true,cancelable:true}));target.dispatchEvent(new KeyboardEvent('keyup',{key:'o',code:'KeyO',ctrlKey:true,bubbles:true,cancelable:true}));}catch{}
    }
    setTimeout(()=>{if(pendingAsset)showNote('Asset ready · if it did not auto-open, tap File → Open once; Kelo supplies it without a file picker.',0);},500);
  }

  async function shutdown(reason='parent-request'){
    if(shuttingDown)return;shuttingDown=true;
    setStatus('Releasing Pixelorama memory…');status.hidden=false;
    try{if(engine?.requestQuit)await Promise.resolve(engine.requestQuit());}catch(error){console.warn('[Kelo Pixelorama] requestQuit',error);}
    try{if(window.Engine?.unload)window.Engine.unload();}catch(error){console.warn('[Kelo Pixelorama] Engine.unload',error);}
    try{if(nativeAnchorClick)HTMLAnchorElement.prototype.click=nativeAnchorClick;}catch{}
    pendingAsset=null;engine=null;
    tell('quit-ack',{reason});
  }

  addEventListener('message',event=>{
    if(event.origin!==location.origin||event.source!==parent)return;
    const message=event.data||{};if(message.protocol!==PROTOCOL)return;
    if(message.type==='asset'){
      const p=message.payload||{};pendingAsset={name:String(p.name||'kelo-asset.png'),mime:String(p.mime||'image/png'),buffer:p.buffer};
      if(openHookInstalled)tryOpenShortcut();
    }else if(message.type==='quit')void shutdown('parent-request');
    else if(message.type==='ping')tell('pong',{at:Date.now(),ready:!!engine});
  });

  addEventListener('pagehide',()=>{pendingAsset=null;},{once:true});
  installDownloadBridge();

  (async()=>{
    try{
      await loadScript(`${BASE}/index.js`);
      if(typeof window.Engine!=='function')throw new Error('PIXELORAMA_ENGINE_API_MISSING');
      const config={
        args:[],canvasResizePolicy:2,ensureCrossOriginIsolationHeaders:false,executable:`${BASE}/index`,experimentalVK:false,
        focusCanvas:true,gdextensionLibs:[],serviceWorker:null
      };
      engine=new window.Engine(config);
      const missing=window.Engine.getMissingFeatures?.({threads:false})||[];
      if(missing.length)throw new Error(`Pixelorama Web missing browser features: ${missing.join(', ')}`);
      await engine.startGame({onProgress:(current,total)=>{if(current>0&&total>0)setStatus(`Loading Pixelorama ${Math.round(current/total*100)}%…`);}});
      installOpenBridge();
      status.hidden=true;canvas.focus();
      tell('ready',{upstreamCommit:UPSTREAM_COMMIT,mode:'stock-full-web',threads:false});
      if(pendingAsset)tryOpenShortcut();
    }catch(error){
      console.error('[Kelo Pixelorama]',error);setStatus(`Pixelorama could not start: ${String(error?.message||error)}`);tell('error',{code:'BOOT_FAILED',message:String(error?.message||error)});
    }
  })();
})();
</script>
</body>
</html>
