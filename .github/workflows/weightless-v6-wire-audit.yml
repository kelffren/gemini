name: Weightless V6 wire demand audit

on:
  push:
    branches:
      - feature/weightless-v6-property-demand-load

permissions:
  contents: write

concurrency:
  group: weightless-v6-wire-audit
  cancel-in-progress: true

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/weightless-v6-property-demand-load
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify property demand-load behavior
        run: node scripts/property-demand-load-audit.mjs
      - name: Wire audit into existing Weightless deterministic gate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='.github/workflows/asset-bit-ratchet.yml';
          let text=fs.readFileSync(file,'utf8');
          const command='          node scripts/property-demand-load-audit.mjs';
          if(!text.includes(command)){
            const anchor='          node scripts/instant-delivery-usage-audit.mjs';
            if(!text.includes(anchor))throw new Error('WEIGHTLESS_SELF_TEST_ANCHOR_MISSING');
            text=text.replace(anchor,`${anchor}\n${command}`);
          }
          const pathLine="      - 'scripts/property-demand-load-audit.mjs'";
          if(!text.includes(pathLine)){
            const anchor="      - 'scripts/instant-delivery*.mjs'";
            if(!text.includes(anchor))throw new Error('WEIGHTLESS_PATH_ANCHOR_MISSING');
            text=text.replace(anchor,`${anchor}\n${pathLine}`);
          }
          fs.writeFileSync(file,text);
          NODE
          rm -f .github/workflows/weightless-v6-wire-audit.yml
          git config user.name "kelo-weightless-bot"
          git config user.email "68343904+kelffren@users.noreply.github.com"
          git add .github/workflows/asset-bit-ratchet.yml .github/workflows/weightless-v6-wire-audit.yml
          git diff --cached --check
          git commit -m "test(weightless): gate property render-demand loading"
          git push origin HEAD:feature/weightless-v6-property-demand-load
