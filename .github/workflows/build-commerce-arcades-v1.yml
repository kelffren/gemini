name: Build Commerce arcade PNG family
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-commerce-arcades-v1.yml'
      - 'scripts/build-commerce-arcades-v1.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --disable-pip-version-check cairosvg pillow
      - run: python3 scripts/build-commerce-arcades-v1.py
      - run: node --check src/environment/tile-registry.js
      - run: node scripts/validate-atlas-contract.mjs
      - run: node scripts/validate-png-pipeline.mjs
      - run: node scripts/test-png-validation.mjs
      - name: Commit generated art
        run: |
          git config user.name kelo-art-bot
          git config user.email 68343904+kelffren@users.noreply.github.com
          git add assets/commerce-arcade-west-v1.png assets/commerce-arcade-east-v1.png src/environment/tile-registry.js src/environment/art-asset-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build authored Commerce arcade family'
          git push
