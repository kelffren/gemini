name: World Surgery Contract

on:
  push:
    branches: [world-surgery]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check surgery surface
        run: |
          node --check src/studio/diagnostics/world-surgery-control.mjs
          node --check src/studio/diagnostics/world-surgery-runtime.mjs
          node --check src/studio/studio-entry.mjs
          node --check src/studio/tools/register-build-tools.mjs
          node --check src/studio/tools/paint-copies-tool.mjs
          node --check src/creators/ui/creator-hub.mjs
          node --check scripts/recovery-bisect.mjs
          node --check scripts/recovery-profile-runner.mjs
          node --check scripts/world-forensic-autopsy.mjs
      - name: Unified control-plane contract
        run: node scripts/world-surgery-contract.mjs
      - name: Forensic ownership contract
        run: |
          grep -q "scripts','recovery-bisect.mjs" scripts/world-forensic-autopsy.mjs
          if grep -q 'FORENSIC_PROBE_COMMAND\|while(lo<hi)' scripts/world-forensic-autopsy.mjs; then
            echo 'World forensic autopsy must delegate binary search to recovery:bisect; duplicate bisect/probe logic detected.'
            exit 1
          fi
          echo WORLD_FORENSIC_OWNER_CONTRACT_PASS
