name: Append validated Asset Contract memory
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/append-asset-contract-memory.yml'
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append validated visual memory safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          marker='## Validated PNG Asset Contract v1 — 2026-09-04'
          if grep -Fq "$marker" docs/VISUAL_DIRECTION_MEMORY.md; then
            echo 'Memory entry already present.'
            exit 0
          fi
          cat >> docs/VISUAL_DIRECTION_MEMORY.md <<'EOF'

## Validated PNG Asset Contract v1 — 2026-09-04
- Added `src/environment/art-asset-manifest.json` as the structural ingress contract for authored final PNGs. The contract fixes the current logical world tile at 32x32, nearest-neighbour sampling, stable asset ids/kinds, exact declared dimensions and optional exact atlas grids without adding renderer-specific asset branches.
- Added `scripts/validate-art-assets.mjs` plus dedicated Asset Contract CI. The v1 gate validates PNG signature/existence, actual dimensions, exact 32x32 grid coverage for tiled atlases, required alpha and duplicate ids before authored assets are accepted.
- `docs/ASSET_CONTRACT.md` records the durable integration target: final art should flow through manifest -> validation -> TileRegistry/family metadata -> district profile -> existing render layers -> LIVE mobile, and a new asset should not require `if (district === ...)` or asset-name logic in the renderer.
- Focused LIVE Asset Contract audit validated the published manifest `kelo-art-asset-contract-v1` with 8 existing authored assets, `worldTileSize=32`, `sampling=nearest`, mobile 390x844 CSS / 780x1688 backing canvas, and `consoleErrors=[]`, `failedRequests=[]`, `httpErrors=[]`. Manual screenshot inspection found no visual regression; this pass intentionally changed no art.
- Research decision: keep transition connectivity metadata compatible in spirit with Tiled terrain/Wang edge/corner topology; do not commit to WebGL-style atlas extrusion while the current Canvas 2D renderer uses nearest-neighbour exact source rectangles. Padding/extrusion becomes mandatory contract metadata if a mipmapped/WebGL renderer is introduced later.
- QA finding: the legacy broad LIVE audit currently contains an obsolete `gardens-commerce-roads` expectation while LIVE/TileRegistry already expose `gardens-commerce-arena-roads`; that inherited gate failure is not evidence against Asset Contract v1 and must be repaired separately without reverting Arena.
- Next Asset Contract gap: formalize semantic terrain-transition topology/completeness so a future grass/marble/dirt transition PNG family can be swapped through metadata rather than renderer branches.
EOF
          git add docs/VISUAL_DIRECTION_MEMORY.md
          git commit -m "Append validated PNG Asset Contract memory"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "push attempt $attempt failed; retrying"
            sleep 2
          done
          exit 1
