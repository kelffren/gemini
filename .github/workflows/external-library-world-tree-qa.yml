name: External Library World Tree QA
on:
  push:
    branches: [main]
    paths:
      - 'tests/external-library-world-tree.spec.js'
      - 'src/studio/integration/library-build-bridge.mjs'
      - 'src/studio/integration/live-studio-controller.mjs'
      - 'src/studio/ui/studio-asset-palette.mjs'
      - '.github/workflows/external-library-world-tree-qa.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-audit --no-fund
      - run: npx playwright install chromium --with-deps
      - run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/kelo-http.log 2>&1 &
      - run: KELO_PAGES=http://127.0.0.1:4173/ npx playwright test tests/external-library-world-tree.spec.js --project=chromium
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-library-world-tree-evidence
          path: test-results/
          retention-days: 14
