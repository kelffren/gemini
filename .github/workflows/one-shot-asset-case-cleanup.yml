name: One-shot asset integrity baseline
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-asset-case-cleanup.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Current PNG pipeline result
        continue-on-error: true
        run: node scripts/validate-png-pipeline.mjs
      - name: Enumerate missing runtime asset references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          disk={p.as_posix() for p in (root/'assets').rglob('*') if p.is_file()}
          refs={}
          files=[root/'index.html']+[p for p in (root/'src').rglob('*') if p.is_file() and p.suffix.lower() in {'.js','.mjs','.html','.css','.json'}]
          pat=re.compile(r'assets/[A-Za-z0-9_./-]+\.(?:PNG|png|svg)')
          for p in files:
            text=p.read_text(encoding='utf-8',errors='ignore')
            for ref in pat.findall(text): refs.setdefault(ref,set()).add(p.as_posix())
          print('ASSET_FILES',len(disk))
          for p in sorted(disk): print('DISK',p)
          missing=[]
          for ref,owners in sorted(refs.items()):
            state='OK' if ref in disk else 'MISSING'
            print(state,ref,'owners='+','.join(sorted(owners)))
            if state=='MISSING': missing.append(ref)
          print('MISSING_COUNT',len(missing))
          PY
