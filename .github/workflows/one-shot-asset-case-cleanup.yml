name: One-shot performance governor cache bump
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-asset-case-cleanup.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump performance governor cache key
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='src/systems/performance-governor.js?v=1'
          new='src/systems/performance-governor.js?v=2'
          if old not in s:
              if new in s:
                  print('cache key already current')
              else:
                  raise SystemExit('performance governor script tag not found')
          else:
              p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          git diff --check
      - name: Commit cache bump
        run: |
          set -euo pipefail
          if git diff --quiet; then echo 'No change'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'perf: load frame telemetry v2 on LIVE'
          git pull --rebase origin main
          git push origin HEAD:main
