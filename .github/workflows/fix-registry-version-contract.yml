name: Update Registry version preservation gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-registry-version-contract.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -c "from pathlib import Path; p=Path('.github/workflows/ci.yml'); s=p.read_text(); old=\"grep -q \\\"registryVersion:'1.11.1'\\\" src/environment/district-decals-registry.js\"; new=\"grep -q \\\"registryVersion:R.version\\\" src/environment/district-decals-registry.js\"; assert old in s; p.write_text(s.replace(old,new,1))"
      - run: grep -q "version:R.version" src/environment/district-decals-registry.js
      - run: grep -q "registryVersion:R.version" src/environment/district-decals-registry.js
      - name: Commit gate
        run: |
          git config user.name kelo-art-bot
          git config user.email 68343904+kelffren@users.noreply.github.com
          git add .github/workflows/ci.yml
          git commit -m 'Require Registry version preservation'
          git push
