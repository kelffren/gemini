name: BrowserStack Map Forge Real iPhone

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/creators/workspaces/world-workspace.mjs'
      - 'tests/world-editor-ios-reopen.spec.js'
      - '.github/workflows/browserstack-map-forge.yml'

jobs:
  real-ios-map-forge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KELO_PAGES: https://kelffren.github.io/gemini/
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify BrowserStack credentials exist
        shell: bash
        run: |
          test -n "$BROWSERSTACK_USERNAME" || (echo "Missing BROWSERSTACK_USERNAME secret" && exit 1)
          test -n "$BROWSERSTACK_ACCESS_KEY" || (echo "Missing BROWSERSTACK_ACCESS_KEY secret" && exit 1)

      - name: Wait for matching Pages deployment
        shell: bash
        run: |
          for i in {1..36}; do
            if curl -fsSL "${KELO_PAGES}src/creators/workspaces/world-workspace.mjs?sha=${GITHUB_SHA}&attempt=${i}" | grep -q 'CREATOR_WORLD_STUDIO_MOUNT_FAILED'; then
              echo "Matching World launch recovery is live on Pages"
              exit 0
            fi
            echo "Waiting for Pages deployment (${i}/36)"
            sleep 10
          done
          echo "Timed out waiting for the fixed World workspace on Pages"
          exit 1

      - name: Install dependencies
        run: npm install

      - name: Run Map Forge and World reopen on real iPhone
        run: npm run test:browserstack:map-forge -- tests/world-editor-ios-reopen.spec.js

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browserstack-map-forge-evidence
          if-no-files-found: ignore
          path: |
            playwright-report.json
            test-results/
            playwright-report/
