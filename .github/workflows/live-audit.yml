name: Live mobile screenshot audit

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'engine-c.js'
      - 'engine-i.js'
      - 'engine-l.js'
      - 'engine-u.js'
      - 'src/environment/**'
      - 'assets/tileset.png'
      - 'assets/tileset-vclean.png'
      - 'assets/plaza-transitions-v1.png'
      - 'assets/rural-soil-v1.png'
      - 'assets/rural-props-v1.png'
      - 'assets/rural-landmarks-v1.png'
      - 'scripts/live-audit.mjs'
      - '.github/workflows/live-audit.yml'

jobs:
  audit-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright package
        run: npm install --no-save playwright@1.55.0
      - name: Audit deployed mobile page
        env:
          AUDIT_URL: https://kelffren.github.io/gemini/
          EXPECTED_BUILD: V5.52
          EXPECTED_REGISTRY: 1.9.0
          EXPECTED_LANDMARKS: rural-landmarks-v1.2
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/live-audit.mjs
      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-mobile-audit
          path: artifacts/
          if-no-files-found: error
