# KELO-INDEX
# area: CI / TEMPORARY VALIDATION
# owner: one-shot PvP browser validator
# keys: PVP DODGE MOBILE DESKTOP CUBIC RECOVERY
# purpose: valida en Chromium real el ganador de trayectoria/recovery y no modifica gameplay
name: Validate Dodge Parity Live
on:
  push:
    paths:
      - '.github/workflows/validate-dodge-parity-live.yml'
jobs:
  live-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Mobile and desktop runtime judge
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/kelo-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true; rm -f scripts/.tmp-dodge-live.mjs' EXIT
          sleep 2
          cat > scripts/.tmp-dodge-live.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          const cases=[
            {name:'mobile',viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true},
            {name:'desktop',viewport:{width:1440,height:900},deviceScaleFactor:1,isMobile:false,hasTouch:false}
          ];
          const results=[];
          for(const c of cases){
            const context=await browser.newContext(c);
            const page=await context.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(String(e.message||e)));
            await page.goto('http://127.0.0.1:4173/?offline=1&dodge-parity-live=1',{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(()=>!!window.KeloRuntimeBootstrap?.ensure,null,{timeout:30000});
            await page.evaluate(async()=>{await window.KeloRuntimeBootstrap.ensure();});
            await page.waitForFunction(()=>!!window.KeloPvPWorld,null,{timeout:30000});
            await page.evaluate(()=>window.enterPvPWorld());
            await page.waitForFunction(()=>window.KeloPvPWorld?.state?.combatEnabled===true,null,{timeout:10000});
            await page.evaluate(()=>{
              localPlayer.x=2790;localPlayer.y=720;localPlayer.vx=0;localPlayer.vy=0;
              window.__dodgeHook=window.KeloInput.after('dodge-live:right',ctx=>{
                if(ctx?.input){ctx.input.normX=1;ctx.input.normY=0;}
                window.KeloInput.combat.setAxes({source:'dodge-live',move:{x:1,y:0,magnitude:1}});
              },9999);
            });
            await page.waitForTimeout(80);
            await page.evaluate(()=>{localPlayer.x=2790;localPlayer.y=720;localPlayer.vx=0;localPlayer.vy=0;window.__dodgeRequestedAt=performance.now();window.KeloInput.combat.push('DODGE_PRESS',{source:'dodge-live'});});
            await page.waitForFunction(()=>window.KeloPvPWorld?.state?.dodgeActive===true,null,{timeout:300,polling:'raf'});
            const started=await page.evaluate(()=>performance.now()-window.__dodgeRequestedAt);
            const samples=[];const start=Date.now();let endedAt=null,endX=null;
            while(Date.now()-start<300){
              const s=await page.evaluate(()=>({t:performance.now()-window.__dodgeRequestedAt,x:localPlayer.x,y:localPlayer.y,active:window.KeloPvPWorld.state.dodgeActive,dash:!!localPlayer._dash}));
              samples.push(s);
              if(endedAt==null&&!s.active){endedAt=s.t;endX=s.x;}
              await page.waitForTimeout(4);
            }
            const nearest=t=>samples.reduce((a,b)=>Math.abs(b.t-t)<Math.abs(a.t-t)?b:a,samples[0]);
            const s50=nearest(50),s80=nearest(80),s160=nearest(160);
            const endDistance=(endX??s160.x)-2790;
            const post=await page.evaluate(()=>localPlayer.x)-(endX??s160.x);
            const result={name:c.name,startLatencyMs:started,at50Ms:s50.x-2790,at80Ms:s80.x-2790,endAtMs:endedAt,endDistancePx:endDistance,postEndMovePx:post,pageErrors:errors,sampleCount:samples.length};
            results.push(result);
            if(errors.length)throw new Error(c.name+':PAGE_ERRORS:'+errors.join('|'));
            if(started>80)throw new Error(c.name+':DODGE_START_LATENCY:'+started);
            if(result.at50Ms<45)throw new Error(c.name+':DODGE_NOT_FRONT_LOADED:'+result.at50Ms);
            if(endDistance<110||endDistance>116)throw new Error(c.name+':DODGE_ENDPOINT:'+endDistance);
            if(endedAt==null||endedAt>220)throw new Error(c.name+':DODGE_END_LATE:'+endedAt);
            if(post<8)throw new Error(c.name+':POST_DODGE_CONTROL_NOT_RESTORED:'+post);
            await context.close();
          }
          await browser.close();
          console.log('DODGE_LIVE_PARITY_OK '+JSON.stringify(results,null,2));
          NODE
          node scripts/.tmp-dodge-live.mjs
