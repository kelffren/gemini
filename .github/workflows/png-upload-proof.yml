name: PNG upload proof

on:
  push:
    branches:
      - chatgpt/png-upload-proof
    paths:
      - .github/workflows/png-upload-proof.yml

permissions:
  contents: write

jobs:
  import-png:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Firestorage share and verify exact PNG
        env:
          SHARE_URL: https://firestorage.ai/ja/f/1P1I0_CrIwP8
          EXPECTED_SHA256: 579ad3028b510c60532cb72471ebec9e27e8ed185488b9cb864daf294047aa30
          EXPECTED_SIZE: '2030009'
        run: |
          python - <<'PY'
          import hashlib
          import html
          import os
          import re
          import sys
          from urllib.parse import urljoin
          import requests

          share = os.environ['SHARE_URL']
          expected_sha = os.environ['EXPECTED_SHA256']
          expected_size = int(os.environ['EXPECTED_SIZE'])
          out = 'assets/bot-crimson-v1.png'
          session = requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 Chrome/128 Safari/537.36'})

          def exact_png(data):
              return len(data)==expected_size and data.startswith(b'\x89PNG\r\n\x1a\n') and hashlib.sha256(data).hexdigest()==expected_sha

          def save_if_exact(data, source):
              sha=hashlib.sha256(data).hexdigest()
              if len(data)>100000 or data.startswith(b'\x89PNG'):
                  print(f'CANDIDATE bytes={len(data)} sha256={sha} source={source[:260]}')
              if exact_png(data):
                  os.makedirs(os.path.dirname(out),exist_ok=True)
                  open(out,'wb').write(data)
                  print('EXACT_PNG_FOUND',source)
                  return True
              return False

          page=session.get(share,timeout=30,allow_redirects=True)
          page.raise_for_status()
          print('SHARE_PAGE',page.status_code,page.url,page.headers.get('content-type'),len(page.content))
          if save_if_exact(page.content,page.url): sys.exit(0)
          normalized=html.unescape(page.text).replace('\\/','/')
          candidates=[]
          for pattern in [r'(?:href|src|action|data-[\w-]*url)=[\"\']([^\"\']+)[\"\']',r'[\"\'](https?://[^\"\'<>\\s]+)[\"\']']:
              for raw in re.findall(pattern,normalized,flags=re.I):
                  raw=raw.strip()
                  if not raw or raw.startswith(('javascript:','data:','#')): continue
                  u=urljoin(page.url,raw)
                  if u not in candidates: candidates.append(u)
          print('URLS_BEGIN')
          for u in candidates: print(u)
          print('URLS_END')

          fetched={}
          priority=sorted(candidates,key=lambda u:(0 if any(k in u.lower() for k in ('download','file','asset','media','api','storage')) else 1,len(u)))
          for u in priority[:180]:
              try:
                  r=session.get(u,timeout=30,allow_redirects=True)
                  fetched[u]=r
              except Exception as exc:
                  print('REQUEST_ERROR',u[:180],repr(exc)); continue
              if save_if_exact(r.content,r.url): sys.exit(0)

          print('STATIC_LINKS_DID_NOT_RETURN_EXACT_PNG')
          probes=('download','file_id','fileid','public_id','publicid','presigned','signed_url','signedurl','share_url','shareurl','/api/','api/','sAXq3Ns1F9CD32FT','1P1I0_CrIwP8')
          print('HTML_TAIL_BEGIN')
          print(normalized[-6500:].replace('\n',' ')[:6500])
          print('HTML_TAIL_END')
          for u,r in fetched.items():
              ctype=(r.headers.get('content-type') or '').lower()
              if 'javascript' not in ctype and not u.endswith('.js'): continue
              js=r.text.replace('\\/','/')
              low=js.lower()
              hits=[]
              for token in probes:
                  start=0
                  while True:
                      idx=low.find(token.lower(),start)
                      if idx<0: break
                      hits.append((idx,token)); start=idx+len(token)
                      if len(hits)>=20: break
                  if len(hits)>=20: break
              if hits:
                  print('JS_FILE',u,'bytes',len(r.content),'hits',len(hits))
                  for idx,token in hits[:20]:
                      snippet=js[max(0,idx-350):idx+850].replace('\n',' ')
                      print('JS_HINT',token,snippet[:1200])
          raise SystemExit(17)
          PY

      - name: Confirm dimensions
        run: |
          python - <<'PY'
          from PIL import Image
          p='assets/bot-crimson-v1.png'
          with Image.open(p) as im:
              print('PNG_DIMENSIONS',im.size,im.mode)
              assert im.size==(1024,1536)
          PY

      - name: Commit proof asset to test branch
        run: |
          git config user.name 'kelo-asset-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/bot-crimson-v1.png
          git commit -m 'test: import exact crimson bot PNG via bridge'
          git push origin HEAD:chatgpt/png-upload-proof
