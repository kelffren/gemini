name: PNG upload proof

on:
  push:
    branches:
      - chatgpt/png-upload-proof
    paths:
      - .github/workflows/png-upload-proof.yml

permissions:
  contents: write

jobs:
  import-png:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install headless browser
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Download exact PNG through Firestorage share page
        env:
          SHARE_URL: https://firestorage.ai/ja/f/1P1I0_CrIwP8
          EXPECTED_SHA256: 579ad3028b510c60532cb72471ebec9e27e8ed185488b9cb864daf294047aa30
          EXPECTED_SIZE: '2030009'
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const { chromium } = require('playwright');

          const share = process.env.SHARE_URL;
          const expectedSha = process.env.EXPECTED_SHA256;
          const expectedSize = Number(process.env.EXPECTED_SIZE);
          const out = 'assets/bot-crimson-v1.png';
          let found = false;

          function verifyAndSave(buf, source) {
            const sha = crypto.createHash('sha256').update(buf).digest('hex');
            console.log(`VERIFY source=${source} bytes=${buf.length} sha256=${sha}`);
            if (buf.length === expectedSize && sha === expectedSha && buf.subarray(0,8).equals(Buffer.from([137,80,78,71,13,10,26,10]))) {
              fs.mkdirSync('assets', { recursive: true });
              fs.writeFileSync(out, buf);
              found = true;
              console.log('EXACT_PNG_FOUND');
              return true;
            }
            return false;
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ acceptDownloads: true });
            const page = await context.newPage();

            page.on('response', async (response) => {
              if (found) return;
              try {
                const headers = response.headers();
                const type = (headers['content-type'] || '').toLowerCase();
                const len = Number(headers['content-length'] || 0);
                if (type.includes('image/png') && (len > 500000 || !len)) {
                  const body = await response.body();
                  verifyAndSave(body, response.url());
                }
              } catch (_) {}
            });

            await page.goto(share, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(12000);
            console.log('PAGE_URL', page.url());
            console.log('PAGE_TITLE', await page.title());
            console.log('PAGE_TEXT', (await page.locator('body').innerText()).slice(0,5000));

            const clickable = page.locator('a,button');
            const count = await clickable.count();
            console.log('CLICKABLE_COUNT', count);
            for (let i=0; i<count; i++) {
              const el = clickable.nth(i);
              const text = ((await el.innerText().catch(()=>'')) || '').trim();
              const href = await el.getAttribute('href').catch(()=>null);
              const disabled = await el.isDisabled().catch(()=>false);
              console.log('CLICKABLE', i, JSON.stringify(text.slice(0,180)), href || '', 'disabled='+disabled);
            }

            const selectors = [
              'a[download]',
              'button:has-text("ダウンロード")',
              'a:has-text("ダウンロード")',
              'button:has-text("Download")',
              'a:has-text("Download")',
              'button:has-text("download")',
              'a:has-text("download")'
            ];

            for (const selector of selectors) {
              if (found) break;
              const loc = page.locator(selector).first();
              if (!(await loc.count())) continue;
              console.log('TRY_SELECTOR', selector);
              await loc.waitFor({ state: 'visible', timeout: 15000 }).catch(()=>{});
              const downloadPromise = page.waitForEvent('download', { timeout: 20000 }).catch(()=>null);
              await loc.click({ timeout: 15000 }).catch(e => console.log('CLICK_ERROR', selector, e.message));
              const download = await downloadPromise;
              if (download) {
                const path = await download.path();
                if (path) verifyAndSave(fs.readFileSync(path), 'browser-download:'+download.suggestedFilename());
              }
              await page.waitForTimeout(3000);
            }

            await browser.close();
            if (!found) process.exit(17);
          })().catch(err => { console.error(err); process.exit(18); });
          NODE

      - name: Confirm exact binary and dimensions
        run: |
          sha256sum assets/bot-crimson-v1.png
          test "$(stat -c%s assets/bot-crimson-v1.png)" = "2030009"
          python - <<'PY'
          from PIL import Image
          with Image.open('assets/bot-crimson-v1.png') as im:
              print('PNG_DIMENSIONS', im.size, im.mode)
              assert im.size == (1024, 1536)
          PY

      - name: Commit proof asset to test branch
        run: |
          git config user.name 'kelo-asset-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/bot-crimson-v1.png
          git commit -m 'test: import exact crimson bot PNG via bridge'
          git push origin HEAD:chatgpt/png-upload-proof
