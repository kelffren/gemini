name: Locate Sword Swap Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/locate-sword-swap-runtime.yml'

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate Sword Swap runtime
        run: |
          echo '=== exact UI strings ==='
          grep -RInE "Toca el suelo donde quieres clavar la espada|Espada lanzada|vuelve a tocar la habilidad|clavar la espada" --include='*.js' --include='*.html' . || true
          echo '=== swap_sword references ==='
          grep -RInE "swap_sword|Sword Swap|sword[_ -]?swap|swapSword|swordSwap" --include='*.js' --include='*.html' . || true
