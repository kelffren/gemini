name: Dependency Lock Guard

on:
  push:
    branches:
      - evergreen-migration-2026-09-15
    paths:
      - package.json
      - package-lock.json
      - server/package.json
      - server/package-lock.json
      - .nvmrc
      - .github/workflows/dependency-lock.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup client Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Generate client lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Setup server Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Generate server lockfile
        working-directory: server
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfiles when changed
        shell: bash
        run: |
          set -euo pipefail
          root_tracked=0
          server_tracked=0
          git ls-files --error-unmatch package-lock.json >/dev/null 2>&1 && root_tracked=1 || true
          git ls-files --error-unmatch server/package-lock.json >/dev/null 2>&1 && server_tracked=1 || true
          if git diff --quiet -- package-lock.json server/package-lock.json && [ "$root_tracked" -eq 1 ] && [ "$server_tracked" -eq 1 ]; then
            echo "lockfiles already current"
            exit 0
          fi
          git config user.name "kelo-evergreen-bot"
          git config user.email "68343904+kelffren@users.noreply.github.com"
          git add package-lock.json server/package-lock.json
          git commit -m "build: refresh dependency lockfiles"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
