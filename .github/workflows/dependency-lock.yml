name: Dependency Lock Guard

on:
  push:
    branches:
      - evergreen-migration-2026-09-15
    paths:
      - package.json
      - package-lock.json
      - .nvmrc
      - .github/workflows/dependency-lock.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
        continue-on-error: true

      - name: Generate exact lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "kelo-evergreen-bot"
          git config user.email "68343904+kelffren@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: refresh dependency lockfile"
          git push
