name: Pixelorama Real iOS Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/pixelorama-pro-real-ios.spec.js'
      - 'browserstack.pixelorama.yml'
      - 'tools/pixelorama/index.html'
      - 'src/creators/ui/pixelorama-pro-bridge.mjs'
      - 'src/creators/core/creator-exclusive-runtime.mjs'
      - 'scripts/prepare-pixelorama-kelo.mjs'
      - '.github/workflows/pixelorama-real-ios-gate.yml'

permissions:
  contents: read

concurrency:
  group: pixelorama-real-ios
  cancel-in-progress: true

jobs:
  real-iphone-safari:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BROWSERSTACK_CONFIG_FILE: browserstack.pixelorama.yml
      BUILD_NUMBER: ${{ github.run_number }}
      KELO_PAGES: https://kelffren.github.io/gemini/
      CI: 'true'
    steps:
      - name: Checkout Kelo World
        uses: actions/checkout@v7

      - name: Detect BrowserStack credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "$BROWSERSTACK_USERNAME" && -n "$BROWSERSTACK_ACCESS_KEY" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '### Pixelorama real-iOS gate not executed' >> "$GITHUB_STEP_SUMMARY"
            echo 'BROWSERSTACK_USERNAME / BROWSERSTACK_ACCESS_KEY are not configured as Actions secrets.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Node
        if: steps.credentials.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install real-device test dependencies
        if: steps.credentials.outputs.available == 'true'
        run: npm install --no-save

      - name: Run Pixelorama on physical iPhone Safari
        if: steps.credentials.outputs.available == 'true'
        run: npx browserstack-node-sdk playwright test tests/pixelorama-pro-real-ios.spec.js

      - name: Record verified device gate
        if: steps.credentials.outputs.available == 'true' && success()
        run: |
          echo '### Pixelorama real-iOS gate PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Device: iPhone 14 Pro' >> "$GITHUB_STEP_SUMMARY"
          echo '- OS: iOS 26' >> "$GITHUB_STEP_SUMMARY"
          echo '- Browser: Safari' >> "$GITHUB_STEP_SUMMARY"
          echo '- Required runtime: kelo-custom-pck + native KeloWebBridge' >> "$GITHUB_STEP_SUMMARY"
          echo '- Lifecycle: creator hibernate + heartbeat + full release verified' >> "$GITHUB_STEP_SUMMARY"
