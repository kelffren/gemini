name: Pixelorama Mobile Gates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/pixelorama-pro-real-ios.spec.js'
      - 'browserstack.pixelorama.yml'
      - 'playwright.pixelorama-webkit.config.js'
      - 'tools/pixelorama/index.html'
      - 'src/creators/ui/pixelorama-pro-bridge.mjs'
      - 'src/creators/core/creator-exclusive-runtime.mjs'
      - 'scripts/prepare-pixelorama-kelo.mjs'
      - '.github/workflows/pixelorama-real-ios-gate.yml'

permissions:
  contents: read

concurrency:
  group: pixelorama-mobile-gates
  cancel-in-progress: true

jobs:
  webkit-mobile-preflight:
    name: WebKit mobile preflight
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: 'true'
      KELO_LOCAL: http://127.0.0.1:4173/
    steps:
      - name: Checkout Kelo World
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install test dependencies
        run: npm install --no-save

      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit

      - name: Start current-commit static host
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/kelo-pixelorama-http.log 2>&1 &
          echo $! > /tmp/kelo-pixelorama-http.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kelo-pixelorama-http.log
          exit 1

      - name: Run hard Pixelorama bridge and lifecycle test on WebKit mobile
        run: npx playwright test tests/pixelorama-pro-real-ios.spec.js --config=playwright.pixelorama-webkit.config.js

      - name: Record WebKit preflight
        if: success()
        run: |
          echo '### Pixelorama WebKit mobile preflight PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Custom PCK + native KeloWebBridge required' >> "$GITHUB_STEP_SUMMARY"
          echo '- Asset handoff + heartbeat + creator hibernate/release verified' >> "$GITHUB_STEP_SUMMARY"
          echo '- This is Playwright WebKit mobile emulation, not physical-iPhone certification.' >> "$GITHUB_STEP_SUMMARY"

  real-iphone-safari:
    name: Physical iPhone Safari certification
    needs: webkit-mobile-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BROWSERSTACK_CONFIG_FILE: browserstack.pixelorama.yml
      BUILD_NUMBER: ${{ github.run_number }}
      KELO_PAGES: https://kelffren.github.io/gemini/
      CI: 'true'
    steps:
      - name: Checkout Kelo World
        uses: actions/checkout@v7

      - name: Detect BrowserStack credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "$BROWSERSTACK_USERNAME" && -n "$BROWSERSTACK_ACCESS_KEY" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '### Pixelorama real-iOS gate NOT_EXECUTED' >> "$GITHUB_STEP_SUMMARY"
            echo 'BrowserStack credentials are not configured. WebKit preflight remains separate evidence only.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Node
        if: steps.credentials.outputs.available == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install real-device test dependencies
        if: steps.credentials.outputs.available == 'true'
        run: npm install --no-save

      - name: Run Pixelorama on physical iPhone Safari
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set +e
          npx browserstack-node-sdk playwright test tests/pixelorama-pro-real-ios.spec.js 2>&1 | tee browserstack-pixelorama.log
          code=${PIPESTATUS[0]}
          if [[ "$code" -ne 0 ]] && grep -q 'Automate testing time expired' browserstack-pixelorama.log; then
            echo '### Pixelorama real-iOS gate BLOCKED_BY_BROWSERSTACK_QUOTA' >> "$GITHUB_STEP_SUMMARY"
            echo 'BrowserStack authenticated, but Automate testing time is exhausted. No physical Safari session started, so this is not a Pixelorama product failure and not a certification PASS.' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"

      - name: Record verified device gate
        if: steps.credentials.outputs.available == 'true' && success()
        run: |
          echo '### Pixelorama real-iOS gate PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Device: iPhone 14 Pro' >> "$GITHUB_STEP_SUMMARY"
          echo '- OS: iOS 26' >> "$GITHUB_STEP_SUMMARY"
          echo '- Browser: Safari' >> "$GITHUB_STEP_SUMMARY"
          echo '- Required runtime: kelo-custom-pck + native KeloWebBridge' >> "$GITHUB_STEP_SUMMARY"
          echo '- Lifecycle: creator hibernate + heartbeat + full release verified' >> "$GITHUB_STEP_SUMMARY"
