name: World Surgery Wire V4

on:
  push:
    branches: [world-surgery]

permissions:
  contents: write

jobs:
  wire-v4:
    runs-on: ubuntu-latest
    if: github.actor != 'kelo-world-surgery-v4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: world-surgery
          fetch-depth: 1

      - name: Wire compiler kill switch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/studio/studio-entry.mjs')
          text=p.read_text()
          changed=False

          def once(old,new,marker):
              global text,changed
              if marker in text:
                  print('already wired:',marker)
                  return
              if old not in text:
                  raise SystemExit('expected block missing: '+marker)
              text=text.replace(old,new,1)
              changed=True
              print('wired:',marker)

          once(
            """  const profilerMod=await import('./performance/studio-profiler.mjs');await wait();abort();\n  const compilerMod=await import('./compiler/world-compiler.mjs');await wait();abort();\n""",
            """  const profilerMod=await import('./performance/studio-profiler.mjs');await wait();abort();\n  const surgery=root.KELO_WORLD_SURGERY;\n  let compilerMod=null;\n  if(surgery?.enabled?.('compiler')===false){\n    compilerMod={createWorldCompiler:null};\n    surgery?.markStatus?.('compiler','DISABLED',{phase:'module-import'});\n  }else{\n    const compilerToken=surgery?.start?.('compiler','module-import');\n    try{\n      compilerMod=await import('./compiler/world-compiler.mjs');await wait();abort();\n      surgery?.done?.(compilerToken);\n    }catch(error){surgery?.fail?.(compilerToken,error);throw error;}\n  }\n""",
            "compilerMod={createWorldCompiler:null}"
          )

          once(
            """    createWorldCompiler:compilerMod.createWorldCompiler,\n""",
            """    createWorldCompiler:compilerMod?.createWorldCompiler||null,\n""",
            "createWorldCompiler:compilerMod?.createWorldCompiler||null"
          )

          once(
            """const NOOP_ASSET_PREVIEW=Object.freeze({renderThumbnail:async()=>false,warmAsset:async()=>false,close(){}});\n""",
            """const NOOP_ASSET_PREVIEW=Object.freeze({renderThumbnail:async()=>false,warmAsset:async()=>false,close(){}});\nconst DISABLED_COMPILER=Object.freeze({compile(){throw new Error('WORLD_SURGERY_COMPILER_DISABLED');}});\n""",
            "WORLD_SURGERY_COMPILER_DISABLED"
          )

          once(
            """  const compiler = createWorldCompiler({ resolvePrefab });\n  const worker = createStudioWorkerClient&&surgery.enabled('worker')?createStudioWorkerClient({ resolvePrefab, prefabSnapshot: () => Object.fromEntries(kernel.prefabs.list().map(p => [p.id, kernel.prefabs.resolve(p.id)])) }):{compile:(doc,options)=>Promise.resolve(compiler.compile(doc,options)),close(){},get active(){return false;}};\n""",
            """  const compiler=surgery.enabled('compiler')&&typeof createWorldCompiler==='function'?createWorldCompiler({resolvePrefab}):DISABLED_COMPILER;\n  surgery.markStatus('compiler',surgery.enabled('compiler')&&typeof createWorldCompiler==='function'?'ACTIVE':'DISABLED',{phase:'boot'});\n  const worker = createStudioWorkerClient&&surgery.enabled('worker')?createStudioWorkerClient({ resolvePrefab, prefabSnapshot: () => Object.fromEntries(kernel.prefabs.list().map(p => [p.id, kernel.prefabs.resolve(p.id)])) }):{compile:(doc,options)=>Promise.resolve(compiler.compile(doc,options)),close(){},get active(){return false;}};\n""",
            "surgery.markStatus('compiler'"
          )

          if changed:p.write_text(text)
          PY

      - name: Syntax check
        run: node --check src/studio/studio-entry.mjs

      - name: Commit generated wiring
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'kelo-world-surgery-v4'
          git config user.email 'kelo-world-surgery-v4@users.noreply.github.com'
          git add src/studio/studio-entry.mjs
          git commit -m 'feat(world-surgery): make compiler kill switch real [skip ci]'
          git push origin HEAD:world-surgery
