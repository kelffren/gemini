name: Black Screen Boot Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/main-stability-mobile.spec.js'
      - '.github/workflows/black-screen-boot-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      KELO_PAGES: http://127.0.0.1:4173/
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Build
        run: npm run build
      - name: Start PR server
        run: |
          mkdir -p test-results
          python3 -m http.server 4173 --bind 127.0.0.1 > test-results/black-screen-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat test-results/black-screen-http.log
          exit 1
      - name: Verify world renders and remains playable
        run: npx playwright test tests/black-screen-boot.spec.js --project=chromium
      - name: Upload evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: black-screen-boot-smoke
          path: test-results/
          if-no-files-found: ignore
