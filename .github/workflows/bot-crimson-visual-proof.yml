name: Crimson bot visual proof

on:
  push:
    branches:
      - chatgpt/bot-crimson-live-audit
    paths:
      - .github/workflows/bot-crimson-visual-proof.yml

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright@1.55.0
      - name: Capture player and bot together from LIVE
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN});
            const context=await browser.newContext({viewport:{width:414,height:896},deviceScaleFactor:2,isMobile:true,hasTouch:true});
            const page=await context.newPage();
            await page.goto('https://kelffren.github.io/gemini/?visualBotProof='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>window.KeloCharacterAppearance&&window.KELO_CHARACTER_APPEARANCE_AUDIT.loaded.bot_crimson_v1===true,null,{timeout:45000});
            const pvp=page.locator('button').filter({hasText:/PVP/i}).first();
            await pvp.waitFor({state:'visible',timeout:30000});
            await pvp.click();
            await page.waitForFunction(()=>window.KELO_COMBAT_ENABLED===true,null,{timeout:10000});
            await page.evaluate(()=>{
              const d=simulatedPlayers[0];
              localPlayer.x=d.x-105; localPlayer.y=d.y;
              localPlayer.vx=0; localPlayer.vy=0;
              d._visualMotion={on:false,dx:0,dy:0,face:'down',frame:0};
              if(typeof camera!=='undefined'&&camera){camera.x=localPlayer.x;camera.y=localPlayer.y;if('targetX'in camera)camera.targetX=localPlayer.x;if('targetY'in camera)camera.targetY=localPlayer.y;}
            });
            await page.waitForTimeout(1200);
            const state=await page.evaluate(()=>({player:localPlayer.appearanceId,bot:simulatedPlayers[0].appearanceId,last:window.KELO_CHARACTER_APPEARANCE_AUDIT.lastDraw}));
            console.log('VISUAL_STATE',JSON.stringify(state));
            if(state.player!=='player_hero_v1'||state.bot!=='bot_crimson_v1')throw new Error('appearance mismatch');
            await page.screenshot({path:'artifacts/player-and-crimson-bot-live.png',fullPage:false});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: player-and-crimson-bot-live
          path: artifacts/player-and-crimson-bot-live.png
          if-no-files-found: error
