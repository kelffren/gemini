name: World Editor Lazy Boot CI

on:
  push:
    branches: [main]
    paths:
      - 'src/creators/adapters/world-creator-adapter.mjs'
      - 'src/creators/workspaces/world-workspace.mjs'
      - 'src/world/world-draft-store.js'
      - 'src/world/world-revision-system.js'
      - 'src/world/world-edit-authority.js'
      - 'src/world/authorities/local-world-edit-authority.js'
      - 'scripts/world-editor-lazy-boot-audit.mjs'
      - '.github/workflows/world-editor-lazy-boot-ci.yml'
  pull_request:
    paths:
      - 'src/creators/adapters/world-creator-adapter.mjs'
      - 'src/creators/workspaces/world-workspace.mjs'
      - 'src/world/world-draft-store.js'
      - 'src/world/world-revision-system.js'
      - 'src/world/world-edit-authority.js'
      - 'src/world/authorities/local-world-edit-authority.js'
      - 'scripts/world-editor-lazy-boot-audit.mjs'
      - '.github/workflows/world-editor-lazy-boot-ci.yml'

permissions:
  contents: read

jobs:
  lazy-world-editor-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify World editor lazy bootstrap contract
        run: node scripts/world-editor-lazy-boot-audit.mjs
