name: TEMP Verify Explicit Guest Boot
on:
  push:
    branches: [fix/guest-play-explicit-current-main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KELO_PAGES: http://127.0.0.1:4173/
      KELO_PAGES_URL: http://127.0.0.1:4173/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium --with-deps
      - name: Serve
        shell: bash
        run: |
          mkdir -p test-results
          python3 -m http.server 4173 --bind 127.0.0.1 >test-results/http.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat test-results/http.log
          exit 1
      - name: Explicit guest boot
        run: npx playwright test tests/tmp-explicit-guest-boot.spec.js --project=chromium --workers=1 --retries=0 --reporter=list
      - name: Live Asset QA through guest
        continue-on-error: true
        run: npx playwright test tests/live-asset-qa-telemetry.spec.js --project=chromium --workers=1 --retries=0 --reporter=list
      - name: Normal boot regression
        run: npx playwright test tests/black-screen-boot.spec.js --project=chromium --workers=1 --retries=0 --reporter=list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guest-boot-evidence
          if-no-files-found: ignore
          retention-days: 14
          path: test-results/**
