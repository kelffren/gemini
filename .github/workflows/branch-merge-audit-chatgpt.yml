name: Branch Merge Status Audit

on:
  push:
    branches:
      - audit/branch-merge-status-20260915-2251
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit every branch against main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*'

          BASE='origin/main'
          SELF='origin/audit/branch-merge-status-20260915-2251'
          total=0
          contained=0
          unique=0
          : > /tmp/contained.txt
          : > /tmp/unique.txt

          while IFS= read -r ref; do
            [ "$ref" = 'origin/HEAD' ] && continue
            [ "$ref" = "$BASE" ] && continue
            [ "$ref" = "$SELF" ] && continue

            total=$((total + 1))
            counts="$(git rev-list --left-right --count "$BASE...$ref")"
            behind="$(awk '{print $1}' <<< "$counts")"
            ahead="$(awk '{print $2}' <<< "$counts")"
            branch="${ref#origin/}"

            if [ "$ahead" -eq 0 ]; then
              contained=$((contained + 1))
              printf '%s|ahead=%s|behind=%s\n' "$branch" "$ahead" "$behind" >> /tmp/contained.txt
            else
              unique=$((unique + 1))
              printf '%s|ahead=%s|behind=%s\n' "$branch" "$ahead" "$behind" >> /tmp/unique.txt
            fi
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin | sort)

          echo "AUDIT_TOTAL_NON_MAIN_ORIGINAL=$total"
          echo "AUDIT_FULLY_CONTAINED_IN_MAIN=$contained"
          echo "AUDIT_WITH_UNIQUE_COMMITS_NOT_IN_MAIN=$unique"
          echo '--- UNIQUE_BRANCHES_START ---'
          cat /tmp/unique.txt
          echo '--- UNIQUE_BRANCHES_END ---'
          echo '--- CONTAINED_BRANCHES_START ---'
          cat /tmp/contained.txt
          echo '--- CONTAINED_BRANCHES_END ---'
