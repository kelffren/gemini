name: PvP Cast Movement Live CI

on:
  push:
    branches: [main]
    paths:
      - 'src/abilities/ability-action-timeline.js'
      - 'src/core/kelo-runtime-bootstrap.js'
      - 'src/systems/pvp-combat-runtime-loader.js'
      - 'src/systems/pvp-ability-movement-prediction.js'
      - 'scripts/audit-pvp-cast-movement-parity.js'
      - 'scripts/live-pvp-cast-movement-judge.mjs'
      - '.github/workflows/pvp-cast-movement-live-ci.yml'
  pull_request:
    paths:
      - 'src/abilities/ability-action-timeline.js'
      - 'src/core/kelo-runtime-bootstrap.js'
      - 'src/systems/pvp-combat-runtime-loader.js'
      - 'src/systems/pvp-ability-movement-prediction.js'
      - 'scripts/audit-pvp-cast-movement-parity.js'
      - 'scripts/live-pvp-cast-movement-judge.mjs'
      - '.github/workflows/pvp-cast-movement-live-ci.yml'

permissions:
  contents: read

jobs:
  live-cast-movement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local Kelo World
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/kelo-cast-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/index.html >/dev/null && break; sleep 1; done
      - name: Deterministic cast movement parity
        run: node scripts/audit-pvp-cast-movement-parity.js
      - name: Live mobile and desktop cast movement feel
        env:
          AUDIT_URL: http://127.0.0.1:8000/
        run: node scripts/live-pvp-cast-movement-judge.mjs
      - name: Foundation architecture
        run: npm run audit:foundation
      - name: Performance Foundation
        run: npm run audit:performance-foundation
