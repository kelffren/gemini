          replace('src/studio/ui/studio-live-shell.mjs', "const SHELL_VERSION='studio-live-shell-v1.5.0';", "const SHELL_VERSION='studio-live-shell-v1.6.0';")
          replace('src/studio/ui/studio-live-shell.mjs',
            "  host=globalThis.document?.body,assets=[],onMode,onAsset,onUndo,onRedo,onRotate,onErase,onSave,onClose,\n  onSelectEntity,onDuplicate,onDelete,onPropertyChange,onPlay,onBrushSize,onFocus,renderAssetPreview",
            "  host=globalThis.document?.body,assets=[],onMode,onAsset,onUndo,onRedo,onRotate,onScale,onErase,onSave,onClose,\n  onSelectEntity,onDuplicate,onDelete,onPropertyChange,onPlay,onBrushSize,onFocus,renderAssetPreview")
