name: Implement World Editor Scale

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/implement-world-editor-scale.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch canonical scale support
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); text=p.read_text()
              found=text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {found}: {old[:120]!r}')
              p.write_text(text.replace(old,new,count))

          # World revision snapshots: scale is additive/backward-compatible in schema v1.
          replace('src/world/world-revision-system.js',
            "const clone=v=>v==null?v:JSON.parse(JSON.stringify(v));\n",
            "const clone=v=>v==null?v:JSON.parse(JSON.stringify(v));\nconst normalizeScale=v=>{const n=Number(v);return Math.max(.1,Math.min(8,Number.isFinite(n)?Math.round(n*100)/100:1));};\n")
          replace('src/world/world-revision-system.js',
            "    rotation:((Math.floor(Number(raw.rotation)||0)%4)+4)%4,\n    layer:String(raw.layer||'property'),",
            "    rotation:((Math.floor(Number(raw.rotation)||0)%4)+4)%4,\n    scale:normalizeScale(raw.scale),\n    layer:String(raw.layer||'property'),")

          # Projection equality must notice scale-only changes.
          replace('src/world/world-edit-authority.js',
            "    rotation:((Math.floor(Number(r.rotation)||0)%4)+4)%4\n",
            "    rotation:((Math.floor(Number(r.rotation)||0)%4)+4)%4,\n    scale:Math.max(.1,Math.min(8,Number.isFinite(Number(r.scale))?Math.round(Number(r.scale)*100)/100:1))\n")

          # PropertySystem remains the canonical placement/render/collision owner.
          replace('src/property/property-system.js',
            "  function rotatedSize(t,q){q=((Math.floor(Number(q)||0)%4)+4)%4;return(q%2)?{w:t.height,h:t.width}:{w:t.width,h:t.height};}\n",
            "  function normalizeScale(v){const n=Number(v);return Math.max(.1,Math.min(8,Number.isFinite(n)?Math.round(n*100)/100:1));}\n  function rotatedSize(t,q,scale=1){q=((Math.floor(Number(q)||0)%4)+4)%4;const s=normalizeScale(scale),w=t.width*s,h=t.height*s;return(q%2)?{w:h,h:w}:{w,h};}\n")
          replace('src/property/property-system.js',
            "  function isHouseMutation(op,data){if(!['place','move','rotate','remove'].includes(op))return false;",
            "  function isHouseMutation(op,data){if(!['place','move','rotate','scale','remove'].includes(op))return false;")
          replace('src/property/property-system.js',
            "      const q=((Math.floor(Number(data.rotation)||0)%4)+4)%4,d=rotatedSize(t,q),s=Math.max(1,t.snap||C.tileSize),x=snap(data.x,s),y=snap(data.y,s);\n",
            "      const q=((Math.floor(Number(data.rotation)||0)%4)+4)%4,scale=normalizeScale(data.scale),d=rotatedSize(t,q,scale),s=Math.max(1,t.snap||C.tileSize),x=snap(data.x,s),y=snap(data.y,s);\n")
          replace('src/property/property-system.js',
            "      const rec={placementId:id('placement'),parcelId:p.parcelId,ownerId:owner,assetId:t.id,x,y,rotation:q,layer:'property',createdAt:Date.now(),updatedAt:Date.now()};",
            "      const rec={placementId:id('placement'),parcelId:p.parcelId,ownerId:owner,assetId:t.id,x,y,rotation:q,scale,layer:'property',createdAt:Date.now(),updatedAt:Date.now()};")
          replace('src/property/property-system.js',
            "      const d=rotatedSize(t,rec.rotation),s=Math.max(1,t.snap||C.tileSize),x=snap(data.x,s),y=snap(data.y,s);if(!within(p.bounds,x,y,d.w,d.h))throw new Error('OUTSIDE_PARCEL');rec.x=x;rec.y=y;rec.updatedAt=Date.now();bump();return clone(rec);",
            "      const d=rotatedSize(t,rec.rotation,rec.scale),s=Math.max(1,t.snap||C.tileSize),x=snap(data.x,s),y=snap(data.y,s);if(!within(p.bounds,x,y,d.w,d.h))throw new Error('OUTSIDE_PARCEL');rec.x=x;rec.y=y;rec.updatedAt=Date.now();bump();return clone(rec);")
          replace('src/property/property-system.js',
            "      const rec=state.placements.find(x=>x.placementId===data.placementId);if(!rec)throw new Error('PLACEMENT_NOT_FOUND');const p=parcel(rec.parcelId),t=C.get(rec.assetId);if(!canEdit(p,owner)&&rec.ownerId!==owner)throw new Error('NOT_PLACEMENT_OWNER');const q=(rec.rotation+(Number(data.delta)||1)+4)%4,d=rotatedSize(t,q);if(!within(p.bounds,rec.x,rec.y,d.w,d.h))throw new Error('OUTSIDE_PARCEL');rec.rotation=q;rec.updatedAt=Date.now();bump();return clone(rec);\n    }\n    if(op==='remove'){",
            "      const rec=state.placements.find(x=>x.placementId===data.placementId);if(!rec)throw new Error('PLACEMENT_NOT_FOUND');const p=parcel(rec.parcelId),t=C.get(rec.assetId);if(!canEdit(p,owner)&&rec.ownerId!==owner)throw new Error('NOT_PLACEMENT_OWNER');const q=(rec.rotation+(Number(data.delta)||1)+4)%4,d=rotatedSize(t,q,rec.scale);if(!within(p.bounds,rec.x,rec.y,d.w,d.h))throw new Error('OUTSIDE_PARCEL');rec.rotation=q;rec.updatedAt=Date.now();bump();return clone(rec);\n    }\n    if(op==='scale'){\n      const rec=state.placements.find(x=>x.placementId===data.placementId);if(!rec)throw new Error('PLACEMENT_NOT_FOUND');const p=parcel(rec.parcelId),t=C.get(rec.assetId);if(!canEdit(p,owner)&&rec.ownerId!==owner)throw new Error('NOT_PLACEMENT_OWNER');const scale=normalizeScale(data.scale),d=rotatedSize(t,rec.rotation,scale);if(!within(p.bounds,rec.x,rec.y,d.w,d.h))throw new Error('OUTSIDE_PARCEL');rec.scale=scale;rec.updatedAt=Date.now();bump();return clone(rec);\n    }\n    if(op==='remove'){")
          replace('src/property/property-system.js',
            "      const safe=[];for(const raw of rows){const t=C.get(raw.assetId);if(!t)continue;const q=((Math.floor(Number(raw.rotation)||0)%4)+4)%4,d=rotatedSize(t,q),x=snap(raw.x,t.snap||C.tileSize),y=snap(raw.y,t.snap||C.tileSize);if(!within(p.bounds,x,y,d.w,d.h))continue;safe.push({placementId:String(raw.placementId||id('placement')),parcelId:p.parcelId,ownerId:String(raw.ownerId||p.ownerId),assetId:t.id,x,y,rotation:q,layer:'property',createdAt:Number(raw.createdAt)||Date.now(),updatedAt:Number(raw.updatedAt)||Date.now()});}\n",
            "      const safe=[];for(const raw of rows){const t=C.get(raw.assetId);if(!t)continue;const q=((Math.floor(Number(raw.rotation)||0)%4)+4)%4,scale=normalizeScale(raw.scale),d=rotatedSize(t,q,scale),x=snap(raw.x,t.snap||C.tileSize),y=snap(raw.y,t.snap||C.tileSize);if(!within(p.bounds,x,y,d.w,d.h))continue;safe.push({placementId:String(raw.placementId||id('placement')),parcelId:p.parcelId,ownerId:String(raw.ownerId||p.ownerId),assetId:t.id,x,y,rotation:q,scale,layer:'property',createdAt:Number(raw.createdAt)||Date.now(),updatedAt:Number(raw.updatedAt)||Date.now()});}\n")
          replace('src/property/property-system.js',
            "      const safe=[];for(const raw of rows){const t=C.get(raw.assetId);if(!t)continue;const q=((Math.floor(Number(raw.rotation)||0)%4)+4)%4,d=rotatedSize(t,q),x=snap(raw.x,t.snap),y=snap(raw.y,t.snap);if(!within(p.bounds,x,y,d.w,d.h))continue;safe.push({placementId:String(raw.placementId||id('placement')),parcelId:p.parcelId,ownerId:'developer',assetId:t.id,x,y,rotation:q,layer:'property',createdAt:Number(raw.createdAt)||Date.now(),updatedAt:Date.now()});}\n",
            "      const safe=[];for(const raw of rows){const t=C.get(raw.assetId);if(!t)continue;const q=((Math.floor(Number(raw.rotation)||0)%4)+4)%4,scale=normalizeScale(raw.scale),d=rotatedSize(t,q,scale),x=snap(raw.x,t.snap),y=snap(raw.y,t.snap);if(!within(p.bounds,x,y,d.w,d.h))continue;safe.push({placementId:String(raw.placementId||id('placement')),parcelId:p.parcelId,ownerId:'developer',assetId:t.id,x,y,rotation:q,scale,layer:'property',createdAt:Number(raw.createdAt)||Date.now(),updatedAt:Date.now()});}\n")
          replace('src/property/property-system.js',
            "  function placementBounds(rec){const t=C.get(rec.assetId);if(!t)return null;const d=rotatedSize(t,rec.rotation);return{x:rec.x,y:rec.y,w:d.w,h:d.h};}\n",
            "  function placementBounds(rec){const t=C.get(rec.assetId);if(!t)return null;const d=rotatedSize(t,rec.rotation,rec.scale);return{x:rec.x,y:rec.y,w:d.w,h:d.h};}\n")
          replace('src/property/property-system.js',
            "    const q=((rec.rotation%4)+4)%4,W=t.width,H=t.height;const pts=[[r.x,r.y],[r.x+r.w,r.y],[r.x,r.y+r.h],[r.x+r.w,r.y+r.h]].map(([px,py])=>{let x=px,y=py;if(q===1){return[H-y,x];}if(q===2){return[W-x,H-y];}if(q===3){return[y,W-x];}return[x,y];});const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);return{x:rec.x+Math.min(...xs),y:rec.y+Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)};",
            "    const q=((rec.rotation%4)+4)%4,s=normalizeScale(rec.scale),W=t.width*s,H=t.height*s,sr={x:r.x*s,y:r.y*s,w:r.w*s,h:r.h*s};const pts=[[sr.x,sr.y],[sr.x+sr.w,sr.y],[sr.x,sr.y+sr.h],[sr.x+sr.w,sr.y+sr.h]].map(([px,py])=>{let x=px,y=py;if(q===1){return[H-y,x];}if(q===2){return[W-x,H-y];}if(q===3){return[y,W-x];}return[x,y];});const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);return{x:rec.x+Math.min(...xs),y:rec.y+Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)};")
          replace('src/property/property-system.js',
            "    const q=((rec.rotation%4)+4)%4,d=rotatedSize(t,q);g.save();g.translate(rec.x+d.w/2,rec.y+d.h/2);g.rotate(q*Math.PI/2);g.translate(-t.width/2,-t.height/2);\n",
            "    const q=((rec.rotation%4)+4)%4,s=normalizeScale(rec.scale),d=rotatedSize(t,q,s);g.save();g.translate(rec.x+d.w/2,rec.y+d.h/2);g.rotate(q*Math.PI/2);g.scale(s,s);g.translate(-t.width/2,-t.height/2);\n")
          replace('src/property/property-system.js', "version:'property-system-v1.2.0'", "version:'property-system-v1.3.0'", count=2)

          # House authority inherits the same placement mutation contract.
          replace('src/instances/house-instance.js',
            "    if(['place','move','rotate','remove'].includes(op)){",
            "    if(['place','move','rotate','scale','remove'].includes(op)){")

          # Local WorldEdit authority and its online-compatible operation contract.
          replace('src/world/authorities/local-world-edit-authority.js',
            "    if(['world:placement:create','world:placement:move','world:placement:rotate','world:placement:remove'].includes(op)){",
            "    if(['world:placement:create','world:placement:move','world:placement:rotate','world:placement:scale','world:placement:remove'].includes(op)){")
          replace('src/world/authorities/local-world-edit-authority.js',
            "        result=await S.request('place',{ownerId:'developer',parcelId:WORLD_PARCEL_ID,assetId:payload.assetId,x:payload.x,y:payload.y,rotation:payload.rotation||0});",
            "        result=await S.request('place',{ownerId:'developer',parcelId:WORLD_PARCEL_ID,assetId:payload.assetId,x:payload.x,y:payload.y,rotation:payload.rotation||0,scale:payload.scale});")
          replace('src/world/authorities/local-world-edit-authority.js',
            "        if(op==='world:placement:rotate')result=await S.request('rotate',{ownerId:'developer',placementId:objectId,delta:payload.delta||1});\n        if(op==='world:placement:remove')",
            "        if(op==='world:placement:rotate')result=await S.request('rotate',{ownerId:'developer',placementId:objectId,delta:payload.delta||1});\n        if(op==='world:placement:scale')result=await S.request('scale',{ownerId:'developer',placementId:objectId,scale:payload.scale});\n        if(op==='world:placement:remove')")

          # Studio import keeps the scale stored by the world authority.
          replace('src/studio/adapters/current-world-importer.mjs',
            "const copy = value => value == null ? value : (typeof structuredClone === 'function' ? structuredClone(value) : JSON.parse(JSON.stringify(value)));\n",
            "const copy = value => value == null ? value : (typeof structuredClone === 'function' ? structuredClone(value) : JSON.parse(JSON.stringify(value)));\nconst scaleOf = value => { const n=Number(value); return Math.max(.1,Math.min(8,Number.isFinite(n)?Math.round(n*100)/100:1)); };\n")
          replace('src/studio/adapters/current-world-importer.mjs',
            "transform: { x: Number(placement.x) || 0, y: Number(placement.y) || 0, rotation: quarter * 90 },",
            "transform: { x: Number(placement.x) || 0, y: Number(placement.y) || 0, rotation: quarter * 90, scale: scaleOf(placement.scale) },")

          # Studio spatial, dirty rects and compiler use scaled bounds.
          replace('src/studio/core/studio-kernel.mjs',
            "const entityRect=e=>({x:Number(e.transform?.x)||0,y:Number(e.transform?.y)||0,w:Math.max(1,Number(e.bounds?.w)||1),h:Math.max(1,Number(e.bounds?.h)||1)});",
            "const entityScale=e=>{const n=Number(e?.transform?.scale);return Math.max(.1,Math.min(8,Number.isFinite(n)?n:1));};\nconst entityRect=e=>{const s=entityScale(e);return{x:Number(e.transform?.x)||0,y:Number(e.transform?.y)||0,w:Math.max(1,(Number(e.bounds?.w)||1)*s),h:Math.max(1,(Number(e.bounds?.h)||1)*s)};};")
          replace('src/studio/document/document-commands.mjs',
            "const rectFor = entity => ({ x: Number(entity?.transform?.x) || 0, y: Number(entity?.transform?.y) || 0, w: Math.max(1, Number(entity?.bounds?.w) || 1), h: Math.max(1, Number(entity?.bounds?.h) || 1) });",
            "const scaleOf = value => { const n=Number(value); return Math.max(.1,Math.min(8,Number.isFinite(n)?Math.round(n*100)/100:1)); };\nconst rectFor = entity => { const s=scaleOf(entity?.transform?.scale); return { x: Number(entity?.transform?.x) || 0, y: Number(entity?.transform?.y) || 0, w: Math.max(1, (Number(entity?.bounds?.w) || 1)*s), h: Math.max(1, (Number(entity?.bounds?.h) || 1)*s) }; }; ")
          replace('src/studio/document/document-commands.mjs',
            "  if (next?.transform && next.transform.rotation != null) next.transform.rotation = Math.round((Number(next.transform.rotation) || 0) / 90) * 90;\n",
            "  if (next?.transform && next.transform.rotation != null) next.transform.rotation = Math.round((Number(next.transform.rotation) || 0) / 90) * 90;\n  if (next?.transform && next.transform.scale != null) next.transform.scale = scaleOf(next.transform.scale);\n")
          replace('src/studio/compiler/world-compiler.mjs',
            "const rectOf = entity => ({ x: Number(entity.transform?.x) || 0, y: Number(entity.transform?.y) || 0, w: Math.max(1, Number(entity.bounds?.w) || 1), h: Math.max(1, Number(entity.bounds?.h) || 1) });",
            "const scaleOf = value => { const n=Number(value); return Math.max(.1,Math.min(8,Number.isFinite(n)?n:1)); };\nconst rectOf = entity => { const s=scaleOf(entity.transform?.scale); return { x: Number(entity.transform?.x) || 0, y: Number(entity.transform?.y) || 0, w: Math.max(1, (Number(entity.bounds?.w) || 1)*s), h: Math.max(1, (Number(entity.bounds?.h) || 1)*s) }; };")
          replace('src/studio/compiler/world-compiler.mjs',
            "function colliderRect(entityRect, collider) {\n  const local = collider?.rect;\n  if (!local) return clone(entityRect);\n  return { x: entityRect.x + (Number(local.x) || 0), y: entityRect.y + (Number(local.y) || 0), w: Math.max(1, Number(local.w) || entityRect.w), h: Math.max(1, Number(local.h) || entityRect.h) };\n}",
            "function colliderRect(entityRect, collider, scale=1) {\n  const local = collider?.rect;\n  if (!local) return clone(entityRect);\n  const s=scaleOf(scale),lw=Number(local.w),lh=Number(local.h);\n  return { x: entityRect.x + (Number(local.x) || 0)*s, y: entityRect.y + (Number(local.y) || 0)*s, w: Math.max(1, Number.isFinite(lw)&&lw>0?lw*s:entityRect.w), h: Math.max(1, Number.isFinite(lh)&&lh>0?lh*s:entityRect.h) };\n}")
          replace('src/studio/compiler/world-compiler.mjs',
            "if (components.collider) colliders.push({ id: runtime.id, rect: colliderRect(rect, components.collider), blocksMovement: components.collider.blocksMovement !== false });",
            "if (components.collider) colliders.push({ id: runtime.id, rect: colliderRect(rect, components.collider, entity.transform?.scale), blocksMovement: components.collider.blocksMovement !== false });")

          # Multi-selection scale is one reversible Studio command.
          replace('src/studio/tools/creator-actions.mjs',
            "function newId() { const uuid = globalThis.crypto?.randomUUID?.(); return `entity:${uuid || `${Date.now().toString(36)}:${Math.random().toString(36).slice(2,10)}`}`; }\n",
            "function newId() { const uuid = globalThis.crypto?.randomUUID?.(); return `entity:${uuid || `${Date.now().toString(36)}:${Math.random().toString(36).slice(2,10)}`}`; }\nconst scaleOf=value=>{const n=Number(value);return Math.max(.1,Math.min(8,Number.isFinite(n)?Math.round(n*100)/100:1));};\n")
          replace('src/studio/tools/creator-actions.mjs',
            "  async function patchPrimary(patch) {",
            "  async function scaleSelection({delta=0,value=null}={}) {\n    const rows=selectedEntities(); if(!rows.length)return [];\n    const commands=[];\n    for(const row of rows){const current=scaleOf(row.transform?.scale),next=scaleOf(value==null?current+(Number(delta)||0):value);if(next===current)continue;commands.push(createPatchEntityCommand(row.id,{transform:{...(row.transform||{}),scale:next}}));}\n    if(!commands.length)return rows;\n    await kernel.execute(createCompositeCommand(commands,{type:'entity.batch.scale',label:`Scale ${rows.length} object${rows.length===1?'':'s'}`}));\n    return selectedEntities();\n  }\n\n  async function patchPrimary(patch) {")
          replace('src/studio/tools/creator-actions.mjs',
            "return Object.freeze({ selectedEntities, removeSelection, duplicateSelection, copySelection, pasteClipboard, rotateSelection, patchPrimary, get clipboardSize(){return clipboard.length;} });",
            "return Object.freeze({ selectedEntities, removeSelection, duplicateSelection, copySelection, pasteClipboard, rotateSelection, scaleSelection, patchPrimary, get clipboardSize(){return clipboard.length;} });")

          # Authority mirror sends absolute uniform scale and preserves undo/redo.
          replace('src/studio/integration/authority-command-mirror.mjs',
