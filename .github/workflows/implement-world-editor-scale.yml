            "const quarter = degrees => ((Math.round((Number(degrees) || 0) / 90) % 4) + 4) % 4;\nconst uniformScale = value => { const n=Number(value); return Math.max(.1,Math.min(8,Number.isFinite(n)?Math.round(n*100)/100:1)); };\n")
          replace('src/studio/integration/authority-command-mirror.mjs',
            "const result = await adapter.worldEditRequest('world:placement:create', base({ assetId: entity.prefabId, x: Number(entity.transform?.x) || 0, y: Number(entity.transform?.y) || 0, rotation: quarter(entity.transform?.rotation) }));",
