name: Weightless V7 Exact Full PNG Lab

on:
  push:
    branches:
      - feature/weightless-v7-exact-trim-lab
    paths:
      - 'scripts/exact-alpha-trim-lab.mjs'
      - 'scripts/instant-delivery-compiler.mjs'
      - 'src/creators/assets/instant-delivery-compiler.mjs'
      - 'src/creators/assets/png-space-optimizer.mjs'
      - 'config/instant-delivery-plaza.json'
      - 'assets/justicia_fountain_v2.PNG'
      - 'assets/world/imperial-plaza/arbol-redondo.png'
      - '.github/workflows/weightless-v7-exact-trim-lab.yml'

concurrency:
  group: kelo-weightless-v7-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  exact-full-png:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FOUNTAIN_SHA256: f5ba82df1680b758980489a56543d59311ca4c0a6a39d0899d8e434332beb239
      TREE_SHA256: fc9790cbc6e907d32ec1bfbdbb6a4220cb9c2099f35bc5cb83a35da81442479a
      FOUNTAIN_TARGET: assets/pf-f5ba82df.png
      TREE_TARGET: assets/prt-fc9790cb.png
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/weightless-v7-exact-trim-lab
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Materialize and verify exact full PNG candidates
        run: node scripts/exact-alpha-trim-lab.mjs --report=test-results/exact-alpha-trim/report.json
      - name: Verify immutable delivery identities
        run: |
          FOUNTAIN_CANDIDATE="test-results/exact-alpha-trim/assets/plaza-fountain-kelo--${FOUNTAIN_SHA256:0:16}.png"
          TREE_CANDIDATE="test-results/exact-alpha-trim/assets/plaza-round-tree--${TREE_SHA256:0:16}.png"
          echo "$FOUNTAIN_SHA256  $FOUNTAIN_CANDIDATE" | sha256sum -c -
          echo "$TREE_SHA256  $TREE_CANDIDATE" | sha256sum -c -
          test "$(wc -c < "$FOUNTAIN_CANDIDATE")" -eq 2329441
          test "$(wc -c < "$TREE_CANDIDATE")" -eq 1581201
      - name: Publish verified delivery blobs to branch
        run: |
          cp "test-results/exact-alpha-trim/assets/plaza-fountain-kelo--${FOUNTAIN_SHA256:0:16}.png" "$FOUNTAIN_TARGET"
          cp "test-results/exact-alpha-trim/assets/plaza-round-tree--${TREE_SHA256:0:16}.png" "$TREE_TARGET"
          echo "$FOUNTAIN_SHA256  $FOUNTAIN_TARGET" | sha256sum -c -
          echo "$TREE_SHA256  $TREE_TARGET" | sha256sum -c -
          git config user.name "kelo-weightless-bot"
          git config user.email "68343904+kelffren@users.noreply.github.com"
          git add "$FOUNTAIN_TARGET" "$TREE_TARGET"
          if ! git diff --cached --quiet; then
            git commit -m "perf(weightless): publish exact fountain and tree PNG delivery"
            git push origin HEAD:feature/weightless-v7-exact-trim-lab
          else
            echo "EXACT_FULL_PNG_PUBLISH_NOOP"
          fi
      - name: Route exact PNG delivery and declare replacement contracts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const contract='src/environment/prop-contract.js';
          let text=fs.readFileSync(contract,'utf8');
          text=text.replace("assets/world/imperial-plaza/arbol-redondo.png?art=631","assets/prt-fc9790cb.png");
          text=text.replace("assets/justicia_fountain_v2.PNG?art=502","assets/pf-f5ba82df.png");
          if(!text.includes("src:'assets/prt-fc9790cb.png'"))throw new Error('ROUND_TREE_DELIVERY_ROUTE_MISSING');
          if(!text.includes("src:'assets/pf-f5ba82df.png'"))throw new Error('FOUNTAIN_DELIVERY_ROUTE_MISSING');
          fs.writeFileSync(contract,text);
          const planPath='config/instant-delivery-plaza.json';
          const plan=JSON.parse(fs.readFileSync(planPath,'utf8'));
          const fountain=plan.assets.find(x=>x.id==='plazaFountainKelo');
          const tree=plan.assets.find(x=>x.id==='plazaRoundTree');
          if(!fountain||!tree)throw new Error('V7_PLAN_TARGET_MISSING');
          fountain.mode='exact-png-lossless';
          fountain.delivery={path:'assets/pf-f5ba82df.png',bytes:2329441,sha256:process.env.FOUNTAIN_SHA256,exact:true,fullRgbaExact:true,width:1254,height:1254};
          tree.mode='exact-png-lossless';
          tree.delivery={path:'assets/prt-fc9790cb.png',bytes:1581201,sha256:process.env.TREE_SHA256,exact:true,fullRgbaExact:true,width:1254,height:1254};
          fs.writeFileSync(planPath,JSON.stringify(plan,null,2)+'\n');
          NODE
          git add src/environment/prop-contract.js config/instant-delivery-plaza.json
          if ! git diff --cached --quiet; then
            git commit -m "perf(weightless): route fountain and round tree through exact PNG delivery"
            git push origin HEAD:feature/weightless-v7-exact-trim-lab
          else
            echo "EXACT_FULL_PNG_ROUTE_NOOP"
          fi
      - name: Publish exact PNG summary
        if: always()
        run: |
          if [ -f test-results/exact-alpha-trim/report.json ]; then
            node -e "const r=require('./test-results/exact-alpha-trim/report.json'); const t=r.totals; require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, '# Weightless V7 exact full PNG delivery\n\nSOURCE: '+t.sourceBytes+' B\n\nExact full PNG: '+t.candidateBytes+' B\n\nExact saving: '+t.savedBytes+' B ('+t.savedPercent+'%)\n\nExtra available only with geometric trim: '+t.cropExtraSavedBytes+' B\n')"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: kelo-weightless-v7-exact-full-png
          path: test-results/exact-alpha-trim
          if-no-files-found: error
