name: Sword Swap Real Throw Visible

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sword-swap-real-throw-visible.yml'

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Wait for deployed real throw
        run: |
          for i in $(seq 1 24); do
            A="$(curl -fsS "https://kelffren.github.io/gemini/src/visuals/ability-visuals.js?v=$RANDOM" || true)"
            P="$(curl -fsS "https://kelffren.github.io/gemini/src/systems/pvp-world.js?v=$RANDOM" || true)"
            if echo "$A" | grep -q "ability-visual-resolver-v1.2.0" && echo "$P" | grep -q "pvp-world-v1.5"; then
              echo "REAL_THROW_DEPLOY_VISIBLE"
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Capture visible real katana throw
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          mkdir -p artifacts
          echo 'CmNvbnN0IGZzPXJlcXVpcmUoJ2ZzJyk7CmNvbnN0IHtjaHJvbWl1bX09cmVxdWlyZSgncGxheXdyaWdodCcpOwoKKGFzeW5jKCk9PnsKICBjb25zdCBicm93c2VyPWF3YWl0IGNocm9taXVtLmxhdW5jaCh7CiAgICBoZWFkbGVzczp0cnVlLAogICAgZXhlY3V0YWJsZVBhdGg6cHJvY2Vzcy5lbnYuQ0hST01FX0JJTiwKICAgIGFyZ3M6WyctLW5vLXNhbmRib3gnLCctLWRpc2FibGUtZGV2LXNo   ' | tr -d ' ' | base64 -d > /tmp/test.js
          NODE_PATH="$PWD/node_modules" node /tmp/test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sword-swap-real-throw-visible
          path: artifacts/
          if-no-files-found: error
