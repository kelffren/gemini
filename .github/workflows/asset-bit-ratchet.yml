name: Asset Bit Ratchet

on:
  pull_request:
    paths:
      - 'assets/**/*.png'
      - 'C/**/*.png'
      - 'src/creators/assets/asset-bit-ratchet.mjs'
      - 'src/creators/assets/png-*.mjs'
      - 'src/creators/assets/asset-*.mjs'
      - 'scripts/asset-bit-ratchet*.mjs'
      - 'scripts/asset-space-budget.mjs'
      - '.github/workflows/asset-bit-ratchet.yml'

concurrency:
  group: asset-bit-ratchet-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lossless-byte-ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Ratchet deterministic self-test
        run: node scripts/asset-bit-ratchet-audit.mjs
      - name: Measure head asset information and bytes
        run: node scripts/asset-space-budget.mjs --input=assets --max-files=10000 --report=test-results/asset-space-budget-head
      - name: Measure base asset information and bytes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach /tmp/kelo-world-base "$BASE_SHA"
          cd /tmp/kelo-world-base
          node scripts/asset-space-budget.mjs --input=assets --max-files=10000 --report=/tmp/asset-space-budget-base
      - name: Enforce monotonic bytes for unchanged RGBA information
        run: node scripts/asset-bit-ratchet.mjs --base=/tmp/asset-space-budget-base/report.json --head=test-results/asset-space-budget-head/report.json --report=test-results/asset-bit-ratchet/report.json
      - name: Publish ratchet summary
        if: always()
        run: |
          if [ -f test-results/asset-bit-ratchet/report.json ]; then
            node -e "const r=require('./test-results/asset-bit-ratchet/report.json'); const s=r.summary; require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, '# Asset Bit Ratchet\n\nPass: '+r.pass+'\n\nComparable unchanged-information files: '+s.comparableFiles+'\n\nImproved: '+s.improvedFiles+'\n\nRegressed: '+s.regressedFiles+'\n\nBytes saved on comparable files: '+s.comparableSavedBytes+'\n\nTotal stored delta (new/changed information included): '+s.totalStoredDeltaBytes+'\n\nRGBA duplicate saving opportunity: '+s.rgbaDuplicatePotentialAfter+' bytes\n')"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: asset-bit-ratchet-report
          path: |
            test-results/asset-space-budget-head
            test-results/asset-bit-ratchet
          if-no-files-found: ignore
