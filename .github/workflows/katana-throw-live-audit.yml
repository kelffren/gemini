name: Katana Throw LIVE Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/katana-throw-live-audit.yml'

permissions:
  contents: read

jobs:
  katana-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Wait for corrected deployed katana runtime
        run: |
          python3 - <<'PY'
          import time, urllib.request
          base='https://kelffren.github.io/gemini/'
          for attempt in range(24):
              stamp=str(time.time())
              try:
                  manifest=urllib.request.urlopen(base+'src/visuals/visual-manifests.js?katana='+stamp, timeout=15).read().decode('utf-8','ignore')
                  fx=urllib.request.urlopen(base+'src/visuals/fx-system.js?katana='+stamp, timeout=15).read().decode('utf-8','ignore')
                  if "visual-manifests-v1.3.1" in manifest and 'frameRects' in manifest and 'projectile-visual-runtime-v1.1.1' in fx:
                      print('KATANA_CORRECTED_DEPLOY_VISIBLE')
                      break
              except Exception as exc:
                  print('deploy check', attempt+1, exc)
              time.sleep(5)
          else:
              raise SystemExit('Corrected katana runtime not visible on Pages')
          PY
      - name: Audit corrected katana throw on mobile
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const fs=require('fs'); const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
            const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true});
            const page=await context.newPage(); const errors=[]; const failed=[]; const http=[];
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())}); page.on('pageerror',e=>errors.push(`PAGEERROR: ${e.message}`));
            page.on('requestfailed',r=>failed.push(r.url())); page.on('response',r=>{if(r.status()>=400)http.push([r.status(),r.url()])});
            await page.goto(`https://kelffren.github.io/gemini/?visualLab=1&katana-fixed=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(()=>window.KELO_VISUAL_AUDIT?.integrationReady&&window.KeloVisualLab?.previewKatanaThrow&&window.KeloProjectileVisualRegistry?.get('sword_swap_katana_throw_visual'),null,{timeout:20000});
            await page.evaluate(async()=>KeloAssetRegistry.load('sword_swap_katana_throw_asset'));
            const before=await page.evaluate(()=>{const p=window.localPlayer||localPlayer;const d=KeloProjectileVisualRegistry.get('sword_swap_katana_throw_visual');const img=KeloAssetRegistry.resource('sword_swap_katana_throw_asset');return{player:{x:p.x,y:p.y,radius:p.radius},def:d,image:{w:img.naturalWidth||img.width,h:img.naturalHeight||img.height},runtime:KeloProjectileVisuals.version};});
            if(before.image.w!==2172||before.image.h!==724)throw new Error('wrong image dimensions');
            if(before.def.frames!==6||before.def.fps!==12||!Array.isArray(before.def.frameRects)||before.def.frameRects.length!==6||before.runtime!=='projectile-visual-runtime-v1.1.1')throw new Error(`wrong corrected definition ${JSON.stringify(before)}`);
            await page.evaluate(()=>KeloVisualLab.previewKatanaThrow()); await page.waitForTimeout(180);
            const during=await page.evaluate(()=>{const p=window.localPlayer||localPlayer;return{player:{x:p.x,y:p.y,radius:p.radius},metrics:KeloProjectileVisuals.metrics(),collapsed:KeloVisualLab.collapsed,missing:KELO_VISUAL_AUDIT.missingAssets.slice()};});
            if(during.metrics.active<1||!during.collapsed||during.missing.length)throw new Error(`katana preview state bad ${JSON.stringify(during)}`);
            if(JSON.stringify(during.player)!==JSON.stringify(before.player))throw new Error('visual mutated gameplay');
            await page.screenshot({path:'artifacts/katana-throw-mobile-fixed.png',fullPage:false,scale:'device'});
            if(errors.length||failed.length||http.length)throw new Error(`browser errors ${JSON.stringify({errors,failed,http})}`);
            fs.writeFileSync('artifacts/katana-throw-live-fixed.json',JSON.stringify({before,during,errors,failed,http},null,2));
            console.log('KATANA_FIXED_LIVE_PASS '+JSON.stringify({def:before.def,image:before.image,runtime:before.runtime,metrics:during.metrics}));
            await context.close(); await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: katana-throw-live-fixed
          path: artifacts/
          if-no-files-found: error
