name: Update visual memory once
# one-shot validated memory append
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-visual-memory-once.yml'
permissions:
  contents: write
jobs:
  append-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append validated Gardens v16 finding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/VISUAL_DIRECTION_MEMORY.md')
          text=p.read_text()
          marker='## Validated Gardens T-junction — 2026-09-04 / Gardens v16 / World v1.17'
          if marker not in text:
              text += '''\n\n## Validated Gardens T-junction — 2026-09-04 / Gardens v16 / World v1.17
- After two validated L-shaped hedge boundaries, the next useful composition bottleneck was branching vocabulary rather than additional prop density. Gardens now exposes one registry-addressable `HEDGE_T_NWS` virtual join in `gardens-joins-v4`, composed from the existing authored base hedge language so no unrelated art or gameplay systems were changed.
- `gardens-compositions-v16` places the first southeast T-junction at `[22,17]` with its south branch ending at `[22,18]`; the declared Gardens budget remains exactly 41 cells, with 9 fixed placements. The declared-to-renderable placement gate continues to pass all 41 positions without road/path/landmark conflicts or duplicates.
- `world-v1.17` renders the virtual join as a vertical authored hedge plus the west half of the authored horizontal hedge, preserving the established 32px pixel language and crisp mobile rendering.
- Kelo CI run `33840297115`, Pages deployment `33840296447`, and the reframed dedicated Gardens LIVE audit `33840297122` all completed successfully on the certified runtime. The LIVE report recorded 390x844 CSS / 780x1688 backing canvas, `consoleErrors=[]`, `failedRequests=[]`, `httpErrors=[]`, and palette evidence green=946281, ivory=290661, cyan=15072.
- QA finding validated: a technically green LIVE screenshot is insufficient if it does not frame the feature being certified. The first v16 audit run was rejected as visual evidence because it framed the west side of Gardens; the audit camera was moved to the southeast T-junction and rerun before this state was accepted.
- Manual inspection of the corrected LIVE capture confirms the southeast hedge reads as a continuous T-shaped branch, remains clear of the marble route and does not introduce an obvious seam at mobile scale.
- Next bottleneck: the T is currently a one-orientation virtual composite with renderer-specific handling. The next safe architecture pass should generalize junction composition/rotation in registry data (or author a complete T family in the modular join atlas) before adding more T placements or increasing decorative density.
'''
              p.write_text(text)
          PY
      - name: Commit memory update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/VISUAL_DIRECTION_MEMORY.md
          git diff --cached --quiet || git commit -m "docs(visual): validate Gardens T-junction v16"
          git push
