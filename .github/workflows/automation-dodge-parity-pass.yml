# KELO-INDEX
# area: CI / TEMPORARY AUTOMATION
# owner: one-shot autonomous patch runner
# keys: PVP DODGE TRAJECTORY RECOVERY PARITY
# purpose: aplica y valida un único pass de paridad del dodge; se auto-retira tras commit
# online: alinea predicción cliente con autoridad server
name: Autonomous Dodge Parity Pass
permissions:
  contents: write
on:
  push:
    paths:
      - '.github/workflows/automation-dodge-parity-pass.yml'
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply candidate B parity patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/abilities/kelo-ability-boot.js')
          s=p.read_text()
          old="const k=1-Math.max(0,dash.time)/dash.max;let nextX=dash.sx+(dash.tx-dash.sx)*Math.min(1,k),nextY=dash.sy+(dash.ty-dash.sy)*Math.min(1,k);"
          new="const k=1-Math.max(0,dash.time)/dash.max,ease=1-Math.pow(1-Math.min(1,k),3);let nextX=dash.sx+(dash.tx-dash.sx)*ease,nextY=dash.sy+(dash.ty-dash.sy)*ease;"
          if old not in s: raise SystemExit('ABILITY_DASH_BASELINE_CHANGED')
          p.write_text(s.replace(old,new,1))
          p=Path('src/systems/pvp-world.js')
          s=p.read_text()
          old="dodge:Object.freeze({distance:112,duration:.16,iFrames:.105,recovery:.15,cooldown:.85,directionSource:'move'})"
          new="dodge:Object.freeze({distance:112,duration:.16,iFrames:.105,recovery:0,cooldown:.85,directionSource:'move'})"
          if old not in s: raise SystemExit('PVP_DODGE_RECOVERY_BASELINE_CHANGED')
          p.write_text(s.replace(old,new,1))
          p=Path('server/pvp-authority.js')
          s=p.read_text()
          old="const DODGE=Object.freeze({distance:112,duration:.16,iFrames:.105,recovery:.15,cooldown:.85});"
          new="const DODGE=Object.freeze({distance:112,duration:.16,iFrames:.105,recovery:0,cooldown:.85});"
          if old not in s: raise SystemExit('SERVER_DODGE_RECOVERY_BASELINE_CHANGED')
          p.write_text(s.replace(old,new,1))
          p=Path('scripts/audit-pvp-dodge-timing.js')
          s=p.read_text()
          s=s.replace("if(!abilities.includes('const k=1-Math.max(0,dash.time)/dash.max'))throw new Error('CLIENT_DASH_LINEAR_CONTRACT_CHANGED');","if(!abilities.includes('ease=1-Math.pow(1-Math.min(1,k),3)'))throw new Error('CLIENT_DASH_CUBIC_PARITY_MISSING');")
          s=s.replace("const result={distancePx:distance,durationMs:duration*1000,clientRecoveryLockMs:recovery*1000,serverPostDashMovementLockMs:0,postDashControlDeltaMs:recovery*1000,refresh:[60,90,120].map(sample)};","const result={distancePx:distance,durationMs:duration*1000,clientRecoveryLockMs:recovery*1000,serverPostDashMovementLockMs:0,postDashControlDeltaMs:recovery*1000,refresh:[60,90,120].map(sample)};\nif(recovery!==0)throw new Error('DODGE_POST_DASH_RECOVERY_NOT_PARITY');\nfor(const r of result.refresh){if(r.maxTrajectoryDeltaPx>.001)throw new Error('DODGE_TRAJECTORY_PARITY_FAILED_'+r.hz);}")
          s=s.replace("client=distance*k;authority=distance*(1-Math.pow(1-k,3));","client=distance*(1-Math.pow(1-k,3));authority=distance*(1-Math.pow(1-k,3));")
          p.write_text(s)
      - name: Syntax and deterministic parity
        run: |
          node --check src/abilities/kelo-ability-boot.js
          node --check src/systems/pvp-world.js
          node --check server/pvp-authority.js
          node scripts/audit-pvp-dodge-timing.js
          npm run audit:foundation
          npm run audit:performance
      - name: Commit winner and self-retire
        run: |
          git config user.name 'kelo-pvp-agent'
          git config user.email '68343904+kelffren@users.noreply.github.com'
          rm .github/workflows/automation-dodge-parity-pass.yml
          git add src/abilities/kelo-ability-boot.js src/systems/pvp-world.js server/pvp-authority.js scripts/audit-pvp-dodge-timing.js .github/workflows/automation-dodge-parity-pass.yml
          git commit -m 'Align PvP dodge trajectory and recovery parity'
          git push origin HEAD:main
