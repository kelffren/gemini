name: Asset PNG Space Compiler

on:
  push:
    branches:
      - main
      - feat/adaptive-png-space-compiler
    paths:
      - 'src/creators/assets/png-*.mjs'
      - 'src/creators/assets/asset-image-profiler.mjs'
      - 'src/creators/assets/runtime-image-variants.mjs'
      - 'src/creators/assets/quality-pareto.mjs'
      - 'src/creators/assets/perceptual-quality-bridge.mjs'
      - 'scripts/asset-space-*.mjs'
      - 'scripts/asset-atlas-space-audit.mjs'
      - 'scripts/asset-codec-tournament.mjs'
      - 'src/environment/generated/*manifest*.js'
      - 'assets/**/*.png'
      - 'C/**/*.png'
      - '.github/workflows/asset-space-compiler.yml'
  pull_request:
    paths:
      - 'src/creators/assets/png-*.mjs'
      - 'src/creators/assets/asset-image-profiler.mjs'
      - 'src/creators/assets/runtime-image-variants.mjs'
      - 'src/creators/assets/quality-pareto.mjs'
      - 'src/creators/assets/perceptual-quality-bridge.mjs'
      - 'scripts/asset-space-*.mjs'
      - 'scripts/asset-atlas-space-audit.mjs'
      - 'scripts/asset-codec-tournament.mjs'
      - 'src/environment/generated/*manifest*.js'
      - 'assets/**/*.png'
      - 'C/**/*.png'
      - '.github/workflows/asset-space-compiler.yml'
  workflow_dispatch:
    inputs:
      input_path:
        description: PNG file or folder to inspect
        required: true
        default: assets
        type: string
      mode:
        description: Compression policy
        required: true
        default: strict
        type: choice
        options:
          - strict
          - adaptive
          - tournament

concurrency:
  group: asset-png-space-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deterministic PNG compiler self-test
        run: node scripts/asset-space-compiler-audit.mjs
      - name: Meta policy / seam / tournament audit
        run: node scripts/asset-space-meta-audit.mjs
      - name: Existing Asset Sheet compatibility audit
        run: node scripts/asset-sheet-compiler-audit.mjs
      - name: Documentation contract audit
        run: node scripts/system-documentation-audit.js
      - name: Asset transfer / decode / transparency budget
        run: node scripts/asset-space-budget.mjs --input="${{ github.event.inputs.input_path || 'assets' }}" --max-files=80 --report=test-results/asset-space-budget
      - name: Forest Plaza atlas occupancy / trim / repack budget
        run: node scripts/asset-atlas-space-audit.mjs --manifest=src/environment/generated/forest-plaza-tileset-v2-manifest.js --report=test-results/asset-atlas-space
      - name: Dry-run representative real PNG assets
        run: node scripts/asset-space-compiler.mjs --input="${{ github.event.inputs.input_path || 'assets' }}" --mode=strict --effort=fast --max-files=12 --report=test-results/asset-space-report
      - name: Publish summary
        if: always()
        run: |
          if [ -f test-results/asset-space-report/report.json ]; then
            node -e "const r=require('./test-results/asset-space-report/report.json'); require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, '# PNG Space Compiler\n\nFiles: '+r.fileCount+'\n\nBefore: '+r.beforeBytes+' bytes\n\nAfter: '+r.afterBytes+' bytes\n\nPotential strict saving: '+r.savedPercent.toFixed(2)+'%\n')"
          fi
          if [ -f test-results/asset-space-budget/report.json ]; then
            node -e "const r=require('./test-results/asset-space-budget/report.json'); require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\n## Asset memory budget\n\nStored: '+r.totals.storedBytes+' bytes\n\nDecoded RGBA baseline: '+r.totals.decodedRgbaBytes+' bytes ('+r.totals.decodedExpansion+'x)\n\nExact duplicate groups: '+r.totals.duplicateGroups+'\n')"
          fi
          if [ -f test-results/asset-atlas-space/report.json ]; then
            node -e "const r=require('./test-results/asset-atlas-space/report.json'); require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\n## Forest Plaza atlas geometry\n\nFrames: '+r.atlas.frameCount+'\n\nSourceRect union: '+(r.geometry.sourceRectUnionRatio*100).toFixed(2)+'%\n\nVisual bounds: '+(r.geometry.visualBoundsAreaRatio*100).toFixed(2)+'%\n\nConservative shelf-pack area saving: '+(r.conservativeShelfPack?.estimatedAreaSavingPercent||0).toFixed(2)+'%\n')"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: png-space-strict-report
          path: |
            test-results/asset-space-report
            test-results/asset-space-budget
            test-results/asset-atlas-space
          if-no-files-found: ignore

  adaptive-lab:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'adaptive'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install adaptive image codec
        run: npm install --no-save sharp@0.35.4
      - name: Adaptive dry-run with captures
        run: node scripts/asset-space-compiler.mjs --input="${{ github.event.inputs.input_path }}" --mode=adaptive --effort=deep --capture --max-files=12 --report=test-results/asset-space-adaptive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: png-space-adaptive-report
          path: test-results/asset-space-adaptive
          if-no-files-found: ignore

  codec-tournament-lab:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'tournament'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install runtime codecs
        run: |
          npm install --no-save sharp@0.35.4
          sudo apt-get update
          sudo apt-get install -y zopfli webp pngquant
          cargo install oxipng --version 10.0.0 --locked
      - name: Run deep codec tournament
        run: node scripts/asset-codec-tournament.mjs --input="${{ github.event.inputs.input_path }}" --max-files=6 --emit-variants --report=test-results/asset-codec-tournament
      - name: Publish tournament summary
        if: always()
        run: |
          if [ -f test-results/asset-codec-tournament/report.json ]; then
            node -e "const r=require('./test-results/asset-codec-tournament/report.json'); require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, '# Asset Codec Tournament\n\nFiles: '+r.fileCount+'\n\nAuthoring PNG saving: '+r.totals.authoringSavedPercent.toFixed(2)+'%\n\nRuntime candidate saving: '+r.totals.runtimeSavedPercent.toFixed(2)+'%\n')"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-codec-tournament
          path: test-results/asset-codec-tournament
          if-no-files-found: ignore
