name: Temporary Regional Logistics Reconcile V2

on:
  push:
    branches:
      - fix/regional-logistics-current-main
    paths:
      - '.github/workflows/tmp-reconcile-regional-logistics-v2.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch current-main files
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');const read=p=>fs.readFileSync(p,'utf8');const write=(p,s)=>fs.writeFileSync(p,s);
          {const p='index.html';let s=read(p);if(!s.includes('src/systems/regional-economy-math.js')){const a='<script src="src/systems/commerce-authority.js?v=1"></script>';const b=a+'\n<script src="src/systems/regional-economy-math.js?v=1"></script>\n<script src="src/systems/faction-clan-system.js?v=1"></script>\n<script src="src/systems/caravan-system.js?v=1"></script>\n<script src="src/systems/regional-economy-system.js?v=1"></script>\n<script src="src/systems/logistics-devtools.js?v=1"></script>';if(!s.includes(a))throw Error('index anchor missing');write(p,s.replace(a,b));}}
          {const p='package.json',j=JSON.parse(read(p));j.scripts['audit:logistics']='node scripts/regional-logistics-audit.js';write(p,JSON.stringify(j,null,2)+'\n');}
          {const p='docs/system-catalog.json',j=JSON.parse(read(p));const defs=[{id:'regional-economy',owner:'KeloRegionalEconomy',source:'src/systems/regional-economy-system.js',technicalDoc:'docs/systems/REGIONAL_ECONOMY_LOGISTICS_SYSTEM.md',playerVisible:false,status:'foundation-api-live-offline-online-ready'},{id:'caravans',owner:'KeloCaravans',source:'src/systems/caravan-system.js',technicalDoc:'docs/systems/REGIONAL_ECONOMY_LOGISTICS_SYSTEM.md',playerVisible:false,status:'foundation-api-live-offline-online-ready'},{id:'factions-clans',owner:'KeloFactions',source:'src/systems/faction-clan-system.js',technicalDoc:'docs/systems/REGIONAL_ECONOMY_LOGISTICS_SYSTEM.md',playerVisible:false,status:'foundation-api-live-offline-online-ready'},{id:'logistics-devtools',owner:'KeloLogisticsDevtools',source:'src/systems/logistics-devtools.js',technicalDoc:'docs/systems/REGIONAL_ECONOMY_LOGISTICS_SYSTEM.md',playerVisible:false,status:'development-observability'}];const ids=new Set(j.systems.map(x=>x.id));for(const d of defs)if(!ids.has(d.id))j.systems.push(d);write(p,JSON.stringify(j,null,2)+'\n');}
          {const p='src/systems/combat/combat-engine.js';let s=read(p);if(!s.includes('ATTACHED_CART_COMBAT_BLOCKED')){const a="    if(!attacker){reject('INVALID_ATTACKER',events,{source:o.source});return Object.freeze({ok:false,reason:'INVALID_ATTACKER'});}\n";const g="    if(root.KeloCaravans?.canActorAttack&&!root.KeloCaravans.canActorAttack(idOf(attacker))){reject('ATTACHED_CART_COMBAT_BLOCKED',events,{actor:attacker,actorId:idOf(attacker)});return Object.freeze({ok:false,reason:'ATTACHED_CART_COMBAT_BLOCKED'});}\n";if(!s.includes(a))throw Error('combat anchor missing');write(p,s.replace(a,a+g));}}
          {const p='src/systems/container-system.js';let s=read(p);if(!s.includes('preservedIdentity:amount===current&&!!movedItemKey')){const a="return{ok:true,source:sourceType,destination:destType,itemKey:String(itemKey),requested:amount,moved:amount,merged,createdKeys,movedItemKey,sourceRemaining:amount===current?0:quantity(item)};";const b="return{ok:true,source:sourceType,destination:destType,itemKey:String(itemKey),requested:amount,moved:amount,merged,createdKeys,preservedIdentity:amount===current&&!!movedItemKey,movedItemKey,sourceRemaining:amount===current?0:quantity(item)};";if(!s.includes(a))throw Error('container anchor missing');write(p,s.replace(a,b));}}
          {const p='scripts/container-system-audit.js';let s=read(p);s=s.replace("assert.equal(C.version,'container-v1.3.0');","assert.equal(C.version,'container-v1.4.0');");s=s.replace("const arrays=()=>[context.STATE.inventory,context.STATE.warehouse.items,context.STATE.marketEscrow.items,context.STATE.tradeEscrow.items,context.STATE.emoteLoadout.items];","const arrays=()=>[context.STATE.inventory,context.STATE.warehouse.items,context.STATE.marketEscrow.items,context.STATE.tradeEscrow.items,context.STATE.emoteLoadout.items,...Object.values(context.STATE.dynamicContainers||{}).map(c=>c.items||[])];");s=s.replace("const snapshot=JSON.stringify({inventory:context.STATE.inventory,backpack:context.STATE.backpack,warehouse:context.STATE.warehouse,marketEscrow:context.STATE.marketEscrow,tradeEscrow:context.STATE.tradeEscrow,emoteLoadout:context.STATE.emoteLoadout});","const snapshot=JSON.stringify({inventory:context.STATE.inventory,backpack:context.STATE.backpack,warehouse:context.STATE.warehouse,marketEscrow:context.STATE.marketEscrow,tradeEscrow:context.STATE.tradeEscrow,emoteLoadout:context.STATE.emoteLoadout,dynamicContainers:context.STATE.dynamicContainers});");if(!s.includes("id:'audit_cart'")){const a="const snapshot=JSON.stringify({inventory:context.STATE.inventory,backpack:context.STATE.backpack,warehouse:context.STATE.warehouse,marketEscrow:context.STATE.marketEscrow,tradeEscrow:context.STATE.tradeEscrow,emoteLoadout:context.STATE.emoteLoadout,dynamicContainers:context.STATE.dynamicContainers});";const t="r=C.registerContainer({id:'audit_cart',type:'cart',owner:'PLAYER:audit',capacity:3,permissions:{deposit:true,withdraw:true,merge:true,elastic:false}},{persist:false});assert(r.ok&&r.created);assert.equal(C.getStats('audit_cart').capacity,3);const cartCargo={id:'cart_cargo_1',templateId:'cart_cargo',name:'Carga',kind:'material',quantity:1,maxStack:1};context.STATE.inventory.push(cartCargo);B.ensure();before=totalQty();r=C.transferItem('backpack','audit_cart',bagSlotById('cart_cargo_1').key,null,{persist:false});assert(r.ok&&r.preservedIdentity);assert.equal(totalQty(),before);assertUnique();let cartSlot=C.getSlots('audit_cart').find(x=>x.item&&x.item.id==='cart_cargo_1');const cartCheckpoint=C.checkpoint();r=C.transferItem('audit_cart','backpack',cartSlot.key,null,{persist:false});assert(r.ok);C.restoreCheckpoint(cartCheckpoint,{persist:false});cartSlot=C.getSlots('audit_cart').find(x=>x.item&&x.item.id==='cart_cargo_1');assert(cartSlot);assert.equal(C.removeContainer('audit_cart',{persist:false}).error,'CONTAINER_NOT_EMPTY');r=C.transferItem('audit_cart','backpack',cartSlot.key,null,{persist:false});assert(r.ok);r=C.removeContainer('audit_cart',{persist:false});assert(r.ok&&!C.getContainer('audit_cart'));assertUnique();\n";if(!s.includes(a))throw Error('audit anchor missing');s=s.replace(a,t+a);}s=s.replace('identityUnique:true,saves:saveCalls','identityUnique:true,dynamicContainers:true,saves:saveCalls');write(p,s);}
          NODE
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html package.json docs/system-catalog.json src/systems/combat/combat-engine.js src/systems/container-system.js scripts/container-system-audit.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: reconcile regional logistics with current main"
          git push origin HEAD:fix/regional-logistics-current-main
