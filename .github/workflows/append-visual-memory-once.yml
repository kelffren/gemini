name: Append validated visual memory once

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/append-visual-memory-once.yml'

permissions:
  contents: write

jobs:
  append:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append validated V5.76 depth finding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('docs/VISUAL_DIRECTION_MEMORY.md')
          text=path.read_text(encoding='utf-8')
          heading='## Validated Architecture Depth Regression Guard — V5.76 / Registry 1.10.10 / 2026-09-02'
          if heading in text:
              print('Memory already current')
              raise SystemExit(0)
          section='''\n\n## Validated Architecture Depth Regression Guard — V5.76 / Registry 1.10.10 / 2026-09-02\n- The LIVE workflow now derives `EXPECTED_REGISTRY` directly from `src/environment/tile-registry.js` instead of carrying a hard-coded registry version. This prevents certification drift when TileRegistry advances.\n- The stricter gate immediately exposed a real Kelo Luxe regression introduced during the native-resolution PNG migration: the boutique prefab still advertised depth support, but its `occlusion` metadata had become `null`, so the shared architecture renderer loaded cleanly while `architectureOccluding=false`.\n- Restored scale-adjusted TileRegistry occlusion metadata for the current native 192x222 Kelo Luxe asset: `sideInset=9`, `topInset=40`, `bottomPadding=4`, with actor clip padding `7/24/7`. Placement, interaction and gameplay collider were not changed.\n- Registry advanced to `1.10.10` and the TileRegistry script cache key was bumped so GitHub Pages/mobile clients cannot retain the stale no-occlusion contract.\n- Final deployed runtime commit `97c347b9321bb56828c202afa6a6bcda8ce88aac` passed Kelo CI, GitHub Pages and the complete LIVE mobile audit at 390x844 CSS / 780x1688 backing canvas. The audit validated `architectureOccluding=true`, `marketOccluding=true`, three registry-driven architecture prefabs, and `consoleErrors=[]`, `failedRequests=[]`, `httpErrors=[]`.\n- Manual inspection of the LIVE architecture and Luxe captures confirms that the player is again partially hidden by the boutique volume when physically behind it while the authored PNG remains crisp and readable.\n- QA rule validated: audit expectations should come from the deployed source contract where possible, because a stale expected-version constant can hide newer runtime regressions instead of certifying them.\n- Next largest visual bottleneck remains the flat brown legacy Mercado building directly beside/behind Kelo Luxe. It should be replaced through the existing `architectureAssets + architecturePrefabs` generic renderer while preserving its gameplay footprint.\n'''
          marker='\n## Non-goals During Visual Passes\n'
          if marker in text:
              text=text.replace(marker,section+marker,1)
          else:
              text=text.rstrip()+section+'\n'
          path.write_text(text,encoding='utf-8')
          PY
      - name: Commit memory append
        run: |
          if git diff --quiet -- docs/VISUAL_DIRECTION_MEMORY.md; then
            echo 'No memory change required'
            exit 0
          fi
          git config user.name 'kelo-visual-memory-bot'
          git config user.email '68343904+kelffren@users.noreply.github.com'
          git add docs/VISUAL_DIRECTION_MEMORY.md
          git commit -m 'Record validated Kelo Luxe depth regression fix'
          git push origin HEAD:main
