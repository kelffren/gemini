name: Probe Sprite Forge API

on:
  push:
    branches:
      - qa/sprite-live-quality-smoke

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe animation with real Kelo hero input
        shell: bash
        run: |
          mkdir -p probe
          set +e
          HERO='https://raw.githubusercontent.com/kelffren/gemini/main/assets/hero.PNG'
          cat > probe/request.json <<JSON
          {"data":["Kelo World hero",{"path":"$HERO","url":"$HERO","orig_name":"hero.PNG","meta":{"_type":"gradio.FileData"}},"Chunky pixel-friendly","FLUX.2 Klein 4B — fast","Square · fast (544²)",["Walk"],2,4,1234,0.10,0.09,1.0,2,0.30,16,true,12,256]}
          JSON
          curl -sS -D probe/submit-headers.txt -H 'Content-Type: application/json' -H 'Accept: application/json' -X POST --data-binary @probe/request.json https://multimodalart-sprite-forge.hf.space/gradio_api/call/forge -o probe/submit.json
          python - <<'PY'
          import json, pathlib
          try:
              data=json.loads(pathlib.Path('probe/submit.json').read_text())
              eid=data.get('event_id','')
              pathlib.Path('probe/event-id.txt').write_text(eid)
              print('event_id=',eid)
          except Exception as e:
              print('submit parse error',e)
          PY
          EID="$(cat probe/event-id.txt 2>/dev/null)"
          if [ -n "$EID" ]; then
            curl -sS --max-time 240 -D probe/sse-headers.txt -H 'Accept: text/event-stream' "https://multimodalart-sprite-forge.hf.space/gradio_api/call/forge/$EID" -o probe/sse.txt
            echo $? > probe/sse-exit.txt
          fi
          echo '=== SUBMIT ==='
          cat probe/submit.json || true
          echo
          echo '=== SSE ==='
          cat probe/sse.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprite-forge-api-probe
          path: probe/
          retention-days: 2
