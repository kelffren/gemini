name: Probe Sprite Forge API

on:
  push:
    branches:
      - qa/sprite-live-quality-smoke

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Gradio API and direct generation
        shell: bash
        run: |
          mkdir -p probe
          set +e
          curl -sS -D probe/info-headers.txt https://multimodalart-sprite-forge.hf.space/gradio_api/info -o probe/info.json
          curl -sS -D probe/config-headers.txt https://multimodalart-sprite-forge.hf.space/config -o probe/config.json
          cat > probe/request.json <<'JSON'
          {"data":["Original Kelo World fantasy MMORPG adventurer, dark teal long coat, restrained gold trim, clean readable silhouette, premium pixel-art game character, no text",null,"Chunky pixel-friendly","FLUX.2 Klein 4B — fast","Square · fast (544²)",["Walk"],2,4,1234,0.10,0.09,1.0,2,0.30,16,true,12,256]}
          JSON
          curl -sS -D probe/submit-headers.txt -H 'Content-Type: application/json' -H 'Accept: application/json' -X POST --data-binary @probe/request.json https://multimodalart-sprite-forge.hf.space/gradio_api/call/forge -o probe/submit.json
          python - <<'PY'
          import json, pathlib
          try:
              data=json.loads(pathlib.Path('probe/submit.json').read_text())
              eid=data.get('event_id','')
              pathlib.Path('probe/event-id.txt').write_text(eid)
              print('event_id=',eid)
          except Exception as e:
              print('submit parse error',e)
          PY
          EID="$(cat probe/event-id.txt 2>/dev/null)"
          if [ -n "$EID" ]; then
            curl -sS --max-time 150 -D probe/sse-headers.txt -H 'Accept: text/event-stream' "https://multimodalart-sprite-forge.hf.space/gradio_api/call/forge/$EID" -o probe/sse.txt
            echo $? > probe/sse-exit.txt
          fi
          echo '=== SUBMIT ==='
          cat probe/submit.json || true
          echo
          echo '=== SSE ==='
          cat probe/sse.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprite-forge-api-probe
          path: probe/
          retention-days: 2
