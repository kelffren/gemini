name: Probe Self-Contained Sprite ZeroGPU

on:
  push:
    branches:
      - qa/sprite-live-quality-smoke

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe self-contained sprite generator
        shell: bash
        run: |
          mkdir -p probe
          set +e
          BASE='https://charlieamalet-tools3ox-pixelart-spritesheet-gene-3090969.hf.space'
          curl -sS -D probe/info-headers.txt "$BASE/gradio_api/info" -o probe/info.json
          cat > probe/request.json <<'JSON'
          {"data":["pixel art full-body dark fantasy MMORPG hero, dark teal long coat with subtle gold trim, black pants and boots, clean silhouette, character sprite sheet, consistent character, walking animation frames, simple flat background"]}
          JSON
          curl -sS -D probe/submit-headers.txt -H 'Content-Type: application/json' -H 'Accept: application/json' -X POST --data-binary @probe/request.json "$BASE/gradio_api/call/generate_mesh" -o probe/submit.json
          python - <<'PY'
          import json, pathlib
          try:
              info=json.loads(pathlib.Path('probe/info.json').read_text())
              print('=== INFO ===')
              print(json.dumps(info,indent=2)[:20000])
          except Exception as e: print('info parse error',e)
          try:
              data=json.loads(pathlib.Path('probe/submit.json').read_text())
              eid=data.get('event_id','')
              pathlib.Path('probe/event-id.txt').write_text(eid)
              print('event_id=',eid)
          except Exception as e:
              print('submit parse error',e)
          PY
          EID="$(cat probe/event-id.txt 2>/dev/null)"
          if [ -n "$EID" ]; then
            curl -sS --max-time 240 -D probe/sse-headers.txt -H 'Accept: text/event-stream' "$BASE/gradio_api/call/generate_mesh/$EID" -o probe/sse.txt
            echo $? > probe/sse-exit.txt
          fi
          echo '=== SUBMIT ==='
          cat probe/submit.json || true
          echo
          echo '=== SSE ==='
          cat probe/sse.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprite-zero-api-probe
          path: probe/
          retention-days: 2
