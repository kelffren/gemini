name: Inspect new numbered assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build visual contact sheet and metadata
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          from pathlib import Path
          import json, math

          files = [
            'assets/0401F8B5-2FCF-4CC5-B19A-CFF0D738E77A.png',
            'assets/0FED06CB-E23B-433C-A88D-55DDC3EC7BB5.png',
            'assets/1C16A3B8-CC59-420C-9B5B-0B483375F842.png',
            'assets/3F064BEE-CC8E-4431-BBF8-3722A05A97C1.png',
            'assets/4635DA44-88C7-4A27-B567-8DA0F178DAA0.png',
            'assets/608D7806-71E8-4DEB-97E8-33EE449A7D27.png',
            'assets/930630F4-557E-40C7-A928-8DFD72B843B1.png',
            'assets/BA1A549D-6FF5-4170-AD93-E81432793911.png',
            'assets/CCD7666A-7999-46F5-9884-AA5CB10C4937.png',
            'assets/E765632E-EFE2-401E-AF87-06BA8FF7E1B0.png',
            'assets/E9CF5E8F-5983-4C9F-BB2D-BA0D61F9389D.png',
            'assets/FE7DE07B-52F2-4C1D-AF7A-486DC5556075.png',
          ]

          out = Path('asset-inspection')
          out.mkdir(exist_ok=True)
          cells=[]
          meta=[]
          W,H=360,300
          for i,f in enumerate(files,1):
              p=Path(f)
              im=Image.open(p).convert('RGBA')
              a=im.getchannel('A')
              bbox=a.getbbox()
              alpha_pixels=sum(1 for v in a.getdata() if v>0)
              opaque_pixels=sum(1 for v in a.getdata() if v>=250)
              total=im.width*im.height
              entry={
                  'index':i,'file':f,'width':im.width,'height':im.height,
                  'bbox':bbox,'alpha_nonzero_ratio':round(alpha_pixels/total,5),
                  'opaque_ratio':round(opaque_pixels/total,5)
              }
              meta.append(entry)
              print('ASSET_META', json.dumps(entry))

              checker=Image.new('RGBA',(W,H),(238,238,238,255))
              d=ImageDraw.Draw(checker)
              s=18
              for y in range(0,H,s):
                  for x in range(0,W,s):
                      if ((x//s)+(y//s))%2:
                          d.rectangle((x,y,x+s-1,y+s-1),fill=(205,205,205,255))
              thumb=im.copy()
              thumb.thumbnail((W-20,H-64),Image.Resampling.LANCZOS)
              x=(W-thumb.width)//2; y=36+(H-48-thumb.height)//2
              checker.alpha_composite(thumb,(x,y))
              d=ImageDraw.Draw(checker)
              d.rectangle((0,0,W,34),fill=(15,18,25,235))
              d.text((10,8),f'{i:02d}  {p.name[:18]}...',fill='white')
              d.rectangle((0,H-28,W,H),fill=(15,18,25,235))
              d.text((10,H-21),f'{im.width}x{im.height}  alpha:{alpha_pixels/total:.1%}',fill='white')
              checker.convert('RGB').save(out/f'{i:02d}.jpg',quality=92)
              cells.append(checker)

          cols=3; rows=math.ceil(len(cells)/cols)
          sheet=Image.new('RGBA',(cols*W,rows*H),(30,30,30,255))
          for idx,c in enumerate(cells):
              sheet.alpha_composite(c,((idx%cols)*W,(idx//cols)*H))
          sheet.convert('RGB').save(out/'contact-sheet.jpg',quality=94)
          (out/'metadata.json').write_text(json.dumps(meta,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: numbered-assets-inspection
          path: asset-inspection/
          retention-days: 1
