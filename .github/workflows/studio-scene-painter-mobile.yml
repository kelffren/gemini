name: Studio Scene Painter mobile regression

on:
  push:
    paths:
      - 'src/creators/workspaces/world-workspace.mjs'
      - 'src/studio/integration/world-studio-bridge.mjs'
      - 'src/studio/integration/live-studio-controller.mjs'
      - 'src/studio/tools/paint-copies-tool.mjs'
      - 'src/studio/tools/register-core-tools-serial.mjs'
      - 'src/studio/tools/register-build-tools-serial.mjs'
      - 'tests/studio-scene-painter-mobile.spec.js'
      - '.github/workflows/studio-scene-painter-mobile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/creators/workspaces/world-workspace.mjs'
      - 'src/studio/integration/world-studio-bridge.mjs'
      - 'src/studio/integration/live-studio-controller.mjs'
      - 'src/studio/tools/paint-copies-tool.mjs'
      - 'src/studio/tools/register-core-tools-serial.mjs'
      - 'src/studio/tools/register-build-tools-serial.mjs'
      - 'tests/studio-scene-painter-mobile.spec.js'
      - '.github/workflows/studio-scene-painter-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scene-painter-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CI: true
      KELO_PAGES: http://127.0.0.1:4173/
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Start exact branch server
        run: |
          mkdir -p test-results
          python3 -m http.server 4173 --bind 127.0.0.1 > test-results/scene-painter-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat test-results/scene-painter-http.log
          exit 1
      - name: Scene Painter iPhone-sized regression
        run: npx playwright test tests/studio-scene-painter-mobile.spec.js --project=chromium
      - name: Upload evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-scene-painter-mobile-evidence
          path: |
            playwright-report.json
            test-results/
          retention-days: 14
          if-no-files-found: ignore
