name: TMP PvP Fireball Recovery Mobility

on:
  push:
    branches: ['ai/pvp-cast-recovery-mobility-a']
    paths:
      - 'src/abilities/abilityData.js'
      - 'scripts/audit-fireball-recovery-mobility.mjs'
      - 'scripts/live-fireball-recovery-mobility-judge.mjs'
      - '.github/workflows/tmp-pvp-fireball-recovery-mobility.yml'

permissions:
  contents: read

jobs:
  fireball-recovery-mobility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install repo dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local Kelo World
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/kelo-fireball-recovery-http.log 2>&1 &
          python3 - <<'PY'
          import time, urllib.request
          for _ in range(50):
              try:
                  r=urllib.request.urlopen('http://127.0.0.1:8000/index.html',timeout=1)
                  if r.status == 200:
                      raise SystemExit(0)
              except Exception:
                  time.sleep(.2)
          raise SystemExit('Kelo checkout server did not start')
          PY
      - name: Deterministic 60 90 120 A B
        run: node scripts/audit-fireball-recovery-mobility.mjs
      - name: Live mobile and desktop recovery movement
        env:
          AUDIT_URL: http://127.0.0.1:8000/
        run: node scripts/live-fireball-recovery-mobility-judge.mjs
      - name: Cast movement parity
        run: node scripts/audit-pvp-cast-movement-parity.js
      - name: Foundation architecture
        run: npm run audit:foundation
