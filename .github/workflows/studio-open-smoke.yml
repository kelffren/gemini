name: Kelo Studio LIVE open smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/studio/**'
      - 'src/creators/**'
      - 'src/ui/studio-launcher.js'
      - 'src/ui/account-auth-ui.js'
      - 'scripts/live-studio-open-smoke.mjs'
      - '.github/workflows/studio-open-smoke.yml'

jobs:
  open-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Verify deployed editor bypass
        run: |
          curl --max-time 10 -fsSL "https://kelffren.github.io/gemini/src/ui/account-auth-ui.js?smoke=${GITHUB_SHA}" | grep -q 'kelo-account-auth-ui-v1.0.1-editor-bypass'
      - name: Open World editor in live Chrome
        env:
          AUDIT_URL: https://kelffren.github.io/gemini/
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/live-studio-open-smoke.mjs
