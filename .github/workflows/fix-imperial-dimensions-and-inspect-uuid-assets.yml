name: Fix imperial dimensions and inspect UUID assets

on:
  push:
    paths:
      - '.github/workflows/fix-imperial-dimensions-and-inspect-uuid-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Correct imperial dimensions and build UUID contact sheets
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          import json, re, math

          root = Path('.')
          dimensions = {
            'fuente-de-la-justicia.png': (1122, 1402),
            'rosa-de-los-vientos.png': (1254, 1254),
            'plataforma-ceremonial.png': (1254, 1254),
            'jardinera-imperial-curva.png': (1254, 1254),
            'estandarte-imperial.png': (1024, 1536),
            'fuente-de-los-leones.png': (1122, 1402),
            'podio-imperial.png': (1254, 1254),
            'kiosco-imperial.png': (1254, 1254),
            'obelisco-imperial.png': (1024, 1536),
            'escalinata-imperial.png': (1448, 1086),
            'farola-imperial.png': (1024, 1536),
            'topiario-imperial.png': (1254, 1254),
          }
          key_by_file = {
            'fuente-de-la-justicia.png': 'imperialFountainJustice',
            'rosa-de-los-vientos.png': 'imperialCompassRose',
            'plataforma-ceremonial.png': 'imperialCeremonialPlatform',
            'jardinera-imperial-curva.png': 'imperialCurvedPlanter',
            'estandarte-imperial.png': 'imperialBanner',
            'fuente-de-los-leones.png': 'imperialLionFountain',
            'podio-imperial.png': 'imperialPodium',
            'kiosco-imperial.png': 'imperialKiosk',
            'obelisco-imperial.png': 'imperialObelisk',
            'escalinata-imperial.png': 'imperialStaircase',
            'farola-imperial.png': 'imperialLamp',
            'topiario-imperial.png': 'imperialTopiary',
          }

          # Verify binaries first, then update catalog metadata exactly once per entry.
          asset_dir = root / 'assets/world/imperial-plaza'
          for name, expected in dimensions.items():
            with Image.open(asset_dir / name) as im:
              if im.size != expected:
                raise RuntimeError(f'{name}: expected {expected}, got {im.size}')

          catalog_path = root / 'src/property/property-asset-catalog.js'
          catalog = catalog_path.read_text()
          total = 0
          for name, (w, h) in dimensions.items():
            key = key_by_file[name]
            pattern = rf"(\{{key:'{re.escape(key)}'[^\n]*?imageW:)\d+(,imageH:)\d+"
            catalog, count = re.subn(pattern, rf'\g<1>{w}\g<2>{h}', catalog)
            if count != 1:
              raise RuntimeError(f'catalog replacement count for {key}: {count}')
            total += count
          if total != 12:
            raise RuntimeError(f'expected 12 catalog replacements, got {total}')
          catalog = catalog.replace("property-asset-catalog-v1.2.1", "property-asset-catalog-v1.2.2")
          catalog_path.write_text(catalog)

          manifest_path = root / 'src/environment/art-asset-manifest.json'
          manifest = json.loads(manifest_path.read_text())
          by_path = {a['path']: a for a in manifest.get('assets', [])}
          for name, (w, h) in dimensions.items():
            p = f'assets/world/imperial-plaza/{name}'
            if p not in by_path:
              raise RuntimeError(f'manifest missing {p}')
            by_path[p]['width'] = w
            by_path[p]['height'] = h
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n')

          # Find only root-level UUID PNGs that remain unregistered/unclassified.
          uuid_re = re.compile(r'^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}\.png$', re.I)
          files = sorted(p for p in (root / 'assets').iterdir() if p.is_file() and uuid_re.match(p.name))
          print('UUID_COUNT', len(files))
          if not files:
            raise RuntimeError('No remaining UUID PNGs found')

          out = root / 'uuid-asset-inspection'
          out.mkdir(exist_ok=True)
          metadata = []
          tile_w, tile_h = 280, 300
          cols, rows_per_sheet = 4, 3
          per_sheet = cols * rows_per_sheet

          for idx, path in enumerate(files, 1):
            with Image.open(path) as im:
              rgba = im.convert('RGBA')
              alpha = rgba.getchannel('A')
              alpha_range = alpha.getextrema()
              bbox = alpha.getbbox()
              corners = [rgba.getpixel((0,0)), rgba.getpixel((rgba.width-1,0)), rgba.getpixel((0,rgba.height-1)), rgba.getpixel((rgba.width-1,rgba.height-1))]
              metadata.append({
                'index': idx,
                'file': str(path).replace('\\','/'),
                'width': rgba.width,
                'height': rgba.height,
                'alphaMin': alpha_range[0],
                'alphaMax': alpha_range[1],
                'alphaBBox': bbox,
                'corners': corners,
              })

          for sheet_index in range(math.ceil(len(files) / per_sheet)):
            subset = files[sheet_index*per_sheet:(sheet_index+1)*per_sheet]
            sheet = Image.new('RGB', (cols*tile_w, rows_per_sheet*tile_h), 'white')
            draw = ImageDraw.Draw(sheet)
            for local_i, path in enumerate(subset):
              idx = sheet_index*per_sheet + local_i + 1
              with Image.open(path) as im:
                rgba = im.convert('RGBA')
                # Checkerboard makes real transparency obvious.
                bg = Image.new('RGB', (tile_w-20, tile_h-72), (232,232,232))
                bgd = ImageDraw.Draw(bg)
                cell = 16
                for yy in range(0,bg.height,cell):
                  for xx in range(0,bg.width,cell):
                    if ((xx//cell)+(yy//cell))%2:
                      bgd.rectangle((xx,yy,xx+cell-1,yy+cell-1), fill=(205,205,205))
                preview = ImageOps.contain(rgba, bg.size, Image.Resampling.LANCZOS)
                px = (bg.width-preview.width)//2
                py = (bg.height-preview.height)//2
                bg.paste(preview, (px,py), preview)
                col = local_i % cols
                row = local_i // cols
                x, y = col*tile_w, row*tile_h
                sheet.paste(bg, (x+10,y+10))
                draw.text((x+10,y+tile_h-54), f'#{idx:02d}  {path.stem[:12]}', fill='black')
                with Image.open(path) as meta_im:
                  draw.text((x+10,y+tile_h-34), f'{meta_im.width}x{meta_im.height}', fill='black')
            sheet.save(out / f'contact-sheet-{sheet_index+1}.jpg', quality=92)

          (out / 'metadata.json').write_text(json.dumps(metadata, indent=2))
          print(json.dumps(metadata, indent=2))
          PY

      - name: Commit corrected imperial dimensions
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/property/property-asset-catalog.js src/environment/art-asset-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix: align imperial asset metadata with PNG binaries'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload UUID inspection
        uses: actions/upload-artifact@v4
        with:
          name: uuid-asset-inspection
          path: uuid-asset-inspection
          if-no-files-found: error
          retention-days: 2
