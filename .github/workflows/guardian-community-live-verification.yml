name: Guardian Community Live Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/guardian-community-live-verification.yml'
      - 'tests/guardian-pvp-takeover-*.spec.js'
      - 'scripts/guardian-pvp-host-audit.mjs'
      - 'src/systems/guardian-system.js'
      - 'src/systems/guardian-authority.js'
      - 'src/systems/guardian-pvp-host.js'
      - 'src/systems/guardian-pvp-net-adapter.js'
      - 'src/workers/guardian-pvp-authority-worker.js'
      - 'src/systems/pvp/**'
      - 'src/systems/combat/**'
      - 'src/systems/melee/**'
      - 'src/systems/effects/**'
      - 'src/abilities/**'
      - 'src/core/feature-registry.js'
      - 'src/core/module-loader.js'
      - 'src/core/movement-profile.js'
      - 'engine-net.js'

concurrency:
  group: guardian-takeover-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: read

jobs:
  community-live:
    if: github.event_name == 'workflow_dispatch'
    name: guardian-community-live-verification
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      KELO_GUARDIAN_TEST_ADMIN_EMAIL: ${{ secrets.KELO_GUARDIAN_TEST_ADMIN_EMAIL }}
      KELO_GUARDIAN_TEST_ADMIN_PASSWORD: ${{ secrets.KELO_GUARDIAN_TEST_ADMIN_PASSWORD }}
      KELO_GUARDIAN_TEST_DONOR_EMAIL: ${{ secrets.KELO_GUARDIAN_TEST_DONOR_EMAIL }}
      KELO_GUARDIAN_TEST_DONOR_PASSWORD: ${{ secrets.KELO_GUARDIAN_TEST_DONOR_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate required community secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(SUPABASE_URL SUPABASE_PUBLISHABLE_KEY KELO_GUARDIAN_TEST_ADMIN_EMAIL KELO_GUARDIAN_TEST_ADMIN_PASSWORD KELO_GUARDIAN_TEST_DONOR_EMAIL KELO_GUARDIAN_TEST_DONOR_PASSWORD)
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then echo "Missing required GitHub Actions secret: $key" >&2; exit 1; fi
          done
      - name: Live two-account Guardian quorum smoke
        run: node scripts/guardian-community-live-smoke.mjs

  pvp-takeover-deterministic:
    name: guardian-pvp-two-client-takeover-deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KELO_PAGES_URL: https://kelffren.github.io/gemini/
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Wait until Pages serves this build or a descendant
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            latest="$(curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2026-03-10' "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds/latest" || true)"
            status="$(jq -r '.status // empty' <<<"$latest" 2>/dev/null || true)"
            deployed="$(jq -r '.commit // empty' <<<"$latest" 2>/dev/null || true)"
            echo "attempt=$attempt status=${status:-unknown} deployed=${deployed:-unknown}"
            if [[ "$status" == "built" && -n "$deployed" ]]; then
              if [[ "$deployed" == "$TARGET_SHA" ]]; then exit 0; fi
              compare="$(curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2026-03-10' "https://api.github.com/repos/${GITHUB_REPOSITORY}/compare/${TARGET_SHA}...${deployed}" || true)"
              relation="$(jq -r '.status // empty' <<<"$compare" 2>/dev/null || true)"
              if [[ "$relation" == "ahead" || "$relation" == "identical" ]]; then exit 0; fi
            fi
            sleep 5
          done
          echo 'Pages deployment barrier timed out.' >&2
          exit 1
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Secretless two-client Guardian PvP takeover gate
        run: npx playwright test tests/guardian-pvp-takeover-deterministic.spec.js --project=chromium --retries=1
      - name: Upload deterministic takeover metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardian-pvp-takeover-deterministic-${{ github.run_id }}
          path: test-results/guardian-pvp-takeover-deterministic-metrics.json
          if-no-files-found: warn
          retention-days: 14

  pvp-takeover-live:
    if: github.event_name == 'workflow_dispatch'
    name: guardian-pvp-two-device-takeover-live
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KELO_PAGES_URL: https://kelffren.github.io/gemini/
      KELO_GUARDIAN_TEST_ADMIN_EMAIL: ${{ secrets.KELO_GUARDIAN_TEST_ADMIN_EMAIL }}
      KELO_GUARDIAN_TEST_ADMIN_PASSWORD: ${{ secrets.KELO_GUARDIAN_TEST_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate Guardian takeover secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(KELO_GUARDIAN_TEST_ADMIN_EMAIL KELO_GUARDIAN_TEST_ADMIN_PASSWORD)
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then echo "Missing required GitHub Actions secret: $key" >&2; exit 1; fi
          done
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Live two-device Guardian PvP takeover gate
        run: npx playwright test tests/guardian-pvp-takeover-live.spec.js --project=chromium --retries=1
      - name: Upload live takeover metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardian-pvp-takeover-live-${{ github.run_id }}
          path: test-results/guardian-pvp-takeover-metrics.json
          if-no-files-found: warn
          retention-days: 14
