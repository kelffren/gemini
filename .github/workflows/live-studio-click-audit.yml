name: Kelo Studio LIVE click audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/studio/**'
      - 'src/creators/**'
      - 'src/ui/studio-launcher.js'
      - 'src/core/camera-system.js'
      - 'index.html'
      - 'scripts/live-studio-click-audit.mjs'
      - '.github/workflows/live-studio-click-audit.yml'

concurrency:
  group: kelo-studio-live-click-main
  cancel-in-progress: true

jobs:
  click-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Syntax check click audit
        run: node --check scripts/live-studio-click-audit.mjs
      - name: Click MENÚ → CREATORS → World on GitHub Pages
        env:
          AUDIT_URL: https://kelffren.github.io/gemini/
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/live-studio-click-audit.mjs
