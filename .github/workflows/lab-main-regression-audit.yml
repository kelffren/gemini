name: LAB Main Regression Audit

on:
  push:
    branches:
      - lab/main-regression-audit-20260924
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: true
      KELO_PAGES: http://127.0.0.1:4173/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Updater contract
        run: npm run audit:updater
      - name: Guardian failover static contract
        run: node scripts/guardian-pvp-failover-audit.mjs
      - name: Studio foundation
        run: npm run audit:studio
      - name: Property editor contract
        run: npm run audit:property
      - name: Placement touch contract
        run: npm run audit:studio:placement-touch
      - name: Mobile hit slop contract
        run: npm run audit:studio:mobile-hit-slop
      - name: Context inspector contract
        run: npm run audit:studio:context

      - name: Serve exact branch bytes
        shell: bash
        run: |
          mkdir -p test-results
          python3 -m http.server 4173 --bind 127.0.0.1 >test-results/lab-main-audit-http.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat test-results/lab-main-audit-http.log
          exit 1

      - name: Studio mobile UI regressions
        run: >-
          npx playwright test
          tests/studio-mobile-context-ui.spec.js
          tests/studio-mobile-action-feedback.spec.js
          tests/studio-mobile-adaptive-toolbar.spec.js
          tests/studio-mobile-radial-context.spec.js
          --project=chromium --workers=1 --retries=0 --reporter=list

      - name: World editor regressions
        run: >-
          npx playwright test
          tests/world-editor-live-open.spec.js
          tests/world-editor-ios-reopen.spec.js
          tests/iphone-world-visible-flow.spec.js
          tests/world-placement-functional.spec.js
          --project=chromium --workers=1 --retries=0 --reporter=list

      - name: Main mobile stability
        run: npx playwright test tests/main-stability-mobile.spec.js --project=chromium --workers=1 --retries=0 --reporter=list

      - name: Black-screen boot
        run: npx playwright test tests/black-screen-boot.spec.js --project=chromium --workers=1 --retries=0 --reporter=list

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-main-regression-audit-evidence
          if-no-files-found: ignore
          retention-days: 14
          path: |
            test-results/**
            playwright-report.json
