name: Aldea map QA
on:
  pull_request:
    paths:
      - 'src/environment/generated/aldea-del-estanque.js'
      - 'src/environment/world-zones.js'
      - 'src/environment/prop-contract.js'
      - 'tests/aldea-del-estanque.spec.js'
      - '.github/workflows/aldea-map-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aldea:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      - name: Play exact PR map
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/aldea-http.log 2>&1 &
          KELO_PAGES=http://127.0.0.1:4173/ npx playwright test tests/aldea-del-estanque.spec.js --project=chromium
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aldea-playable-proof
          path: test-results/
