name: Kelo Foundation Architecture CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  foundation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Audit Foundation architecture
        run: node scripts/foundation-architecture-audit.js
      - name: Audit input-lock ownership contract
        run: node scripts/input-lock-contract-audit.js
      - name: Audit system documentation contract
        run: node scripts/system-documentation-audit.js
      - name: Report current architecture debt inventory
        run: node scripts/foundation-runtime-inventory.js
      - name: Syntax-check Foundation primitives
        run: |
          node --check src/core/input-lock-system.js
          node --check scripts/foundation-architecture-audit.js
          node --check scripts/input-lock-contract-audit.js
          node --check scripts/system-documentation-audit.js
          node --check scripts/foundation-runtime-inventory.js
