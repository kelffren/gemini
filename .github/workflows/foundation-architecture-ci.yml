name: Kelo Foundation Architecture CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  foundation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit Foundation architecture
        run: node scripts/foundation-architecture-audit.js
