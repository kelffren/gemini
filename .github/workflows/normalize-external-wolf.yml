name: Normalize External Wolf Asset
on:
  pull_request:
    paths:
      - '.github/workflows/normalize-external-wolf.yml'
      - 'assets/external/wolf-pack-32x32-normalized.png'
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install pillow
      - name: Fetch and normalize selected external asset
        run: |
          curl -L --fail --retry 3 'https://opengameart.org/sites/default/files/Wolfpack.png' -o /tmp/wolfpack.png
          python3 - <<'PY'
          from PIL import Image
          from collections import Counter, deque

          im = Image.open('/tmp/wolfpack.png').convert('RGBA')
          frame = im.crop((0, 0, 32, 32))
          w, h = frame.size

          # Background removal must be edge-connected. A global RGB tolerance either
          # leaves the blue halo or deletes similarly coloured pixels inside the wolf.
          corners = [frame.getpixel((0,0)), frame.getpixel((w-1,0)),
                     frame.getpixel((0,h-1)), frame.getpixel((w-1,h-1))]
          bg = Counter(corners).most_common(1)[0][0][:3]

          def dist(p):
              return max(abs(p[i] - bg[i]) for i in range(3))

          # Flood the matte from every image edge.  A generous threshold catches
          # antialiased/compressed blue fringe while connectivity protects the subject.
          threshold = 58
          q = deque()
          outside = set()
          for x in range(w):
              q.append((x,0)); q.append((x,h-1))
          for y in range(h):
              q.append((0,y)); q.append((w-1,y))

          while q:
              x,y = q.popleft()
              if (x,y) in outside:
                  continue
              p = frame.getpixel((x,y))
              if p[3] == 0 or dist(p) <= threshold:
                  outside.add((x,y))
                  if x: q.append((x-1,y))
                  if x+1<w: q.append((x+1,y))
                  if y: q.append((x,y-1))
                  if y+1<h: q.append((x,y+1))

          pix = frame.load()
          for x,y in outside:
              r,g,b,a = pix[x,y]
              pix[x,y] = (r,g,b,0)

          # Decontaminate the one-pixel subject boundary: blue matte can be blended
          # into opaque edge pixels even after the matte itself becomes transparent.
          src = frame.copy()
          sp = src.load()
          for y in range(h):
              for x in range(w):
                  r,g,b,a = sp[x,y]
                  if a == 0:
                      continue
                  adjacent_clear = any(
                      0 <= nx < w and 0 <= ny < h and sp[nx,ny][3] == 0
                      for nx,ny in ((x-1,y),(x+1,y),(x,y-1),(x,y+1))
                  )
                  if not adjacent_clear:
                      continue
                  # Remove only blue/cyan spill; preserve legitimate dark wolf pixels.
                  spill = max(0, b - max(r,g))
                  if spill > 8:
                      b = max(r,g) + 8
                      pix[x,y] = (r,g,min(255,b),a)

          # Hard QA: no edge-connected blue/cyan matte may survive.
          bad = []
          for y in range(h):
              for x in range(w):
                  r,g,b,a = pix[x,y]
                  if a and b > r + 35 and b > g + 20:
                      bad.append((x,y,r,g,b,a))
          if bad:
              raise SystemExit(f'blue fringe remains: {bad[:12]}')

          frame.save('wolf-normalized.png', optimize=True)
          print('source', im.size, 'frame', frame.size, 'bg', bg,
                'cleared', len(outside), 'blue_fringe', len(bad))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wolf-normalized
          path: wolf-normalized.png
