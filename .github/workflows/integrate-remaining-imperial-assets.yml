name: Integrate remaining imperial assets

on:
  push:
    paths:
      - '.github/workflows/integrate-remaining-imperial-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Migrate, repair and register remaining imperial assets
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from collections import deque
          from PIL import Image
          import json, re, shutil

          root=Path('.')
          target=root/'assets/world/imperial-plaza'
          target.mkdir(parents=True,exist_ok=True)

          # src, filename, key, template id, label, category, world w/h, collision, cache, repair opaque black background
          defs=[
            ('073AE6A1-CFCB-4FDD-87FA-01260F8614F9.png','farola-monumental.png','imperialMonumentalLamp','imperial:farola-monumental','Farola Monumental Imperial','decor',64,96,{'x':16,'y':64,'w':32,'h':32},613,False),
            ('0B06D0D4-E134-45C2-B141-83F0AF401E1F.png','fuente-astral.png','imperialAstralFountain','imperial:fuente-astral','Fuente Astral Imperial','architecture',128,128,{'x':0,'y':64,'w':128,'h':64},614,False),
            ('1AA3D3DE-BA37-4037-ACC1-8E624D647D9C.png','banco-imperial.png','imperialBench','imperial:banco','Banco Imperial','decor',128,96,{'x':0,'y':64,'w':128,'h':32},615,False),
            ('1D0F25B8-509E-4424-951F-AF8766F1B4F8.png','cartelera-imperial-triple.png','imperialTripleNoticeBoard','imperial:cartelera-triple','Cartelera Imperial Triple','architecture',128,96,{'x':0,'y':64,'w':128,'h':32},616,True),
            ('1FEBBFCC-68EA-4D20-B0DF-A0A0B0C9B4B1.png','escalinata-real.png','imperialRoyalStaircase','imperial:escalinata-real','Escalinata Real Imperial','architecture',128,96,None,617,False),
            ('29D1CCD1-C89B-4BE3-A122-705C501C9796.png','brasero-llama-azul.png','imperialBlueFlameBrazier','imperial:brasero-azul','Brasero Imperial de Llama Azul','decor',96,96,{'x':16,'y':64,'w':64,'h':32},618,False),
            ('3C570543-A7A4-4D88-BE3B-25AED8F15CDA.png','arbol-florido-blanco.png','imperialWhiteBlossomTree','imperial:arbol-florido-blanco','Árbol Florido Blanco Imperial','nature',128,128,{'x':24,'y':88,'w':80,'h':40},619,False),
            ('3C64B281-429B-48EA-983A-15A2B8CB2BBD.png','arbol-florido-azul.png','imperialBlueBlossomTree','imperial:arbol-florido-azul','Árbol Florido Azul Imperial','nature',128,128,{'x':24,'y':88,'w':80,'h':40},620,False),
            ('49CA1368-CA1A-4763-9989-41330CD1754D.png','poste-direccional.png','imperialDirectionPost','imperial:poste-direccional','Poste Direccional Imperial','decor',64,96,{'x':16,'y':64,'w':32,'h':32},621,False),
            ('4C5B8602-AD52-434F-B7C3-D18C1F220E21.png','puente-imperial.png','imperialBridge','imperial:puente','Puente Imperial','architecture',160,128,None,622,True),
            ('4DF39001-04BE-4A9B-BB9E-AB406B66A1BE.png','estatua-angel.png','imperialAngelStatue','imperial:estatua-angel','Estatua del Ángel Imperial','architecture',96,128,{'x':16,'y':88,'w':64,'h':40},623,True),
            ('5BEFB99B-70F2-4F65-B094-43C59851E6E4.png','baldosa-laureada-diagonal.png','imperialDiagonalLaurelTile','imperial:baldosa-laureada-diagonal','Baldosa Laureada Diagonal','tileset',96,96,None,624,False),
            ('7E576A36-16E8-461F-AF80-774C8D8DEBAF.png','canal-cascadas.png','imperialCascadeCanal','imperial:canal-cascadas','Canal Imperial con Cascadas','architecture',160,96,None,625,False),
            ('82F139AE-8001-425A-9888-011EEA50AD1B.png','baldosa-brujula-radial.png','imperialRadialCompassTile','imperial:baldosa-brujula-radial','Baldosa Brújula Radial','tileset',96,96,None,626,False),
            ('83A83429-3B28-4F8D-B9C8-BA27C61398B1.png','baldosa-brujula-laureada.png','imperialLaurelCompassTile','imperial:baldosa-brujula-laureada','Baldosa Brújula Laureada','tileset',96,96,None,627,False),
            ('A6133984-25DE-47C3-83BF-34C1701973CF.png','baldosa-rosa-central.png','imperialCentralRoseTile','imperial:baldosa-rosa-central','Baldosa Rosa Central','tileset',96,96,None,628,False),
            ('A64FAEC8-0388-4954-8139-D006B8C8E032.png','jardinera-floral.png','imperialFlowerPlanter','imperial:jardinera-floral','Jardinera Floral Imperial','nature',128,96,{'x':0,'y':64,'w':128,'h':32},629,False),
            ('B026A5CB-C65B-4D41-A35B-60630844D453.png','arbol-sagrado.png','imperialSacredTree','imperial:arbol-sagrado','Árbol Sagrado Imperial','nature',128,128,{'x':24,'y':88,'w':80,'h':40},630,False),
            ('B4D7410F-F817-43BA-9D67-1F664F1A2EE1.png','arbol-redondo.png','imperialRoundTree','imperial:arbol-redondo','Árbol Redondo Imperial','nature',96,96,{'x':16,'y':64,'w':64,'h':32},631,False),
            ('B87F1D3A-7208-48AC-AEC7-F4EB9384C5A1.png','tablon-misiones.png','imperialQuestBoard','imperial:tablon-misiones','Tablón de Misiones Imperial','architecture',128,96,{'x':0,'y':64,'w':128,'h':32},632,False),
            ('D03BB591-0C7E-45B2-86B5-7C9ABDFB8685.png','baldosa-curva-laureada.png','imperialLaurelCurveTile','imperial:baldosa-curva-laureada','Baldosa Curva Laureada','tileset',96,96,None,633,False),
            ('D43BFCCD-E02E-4547-84C0-3D634B7EAF92.png','baldosa-brujula-marco.png','imperialFramedCompassTile','imperial:baldosa-brujula-marco','Baldosa Brújula con Marco','tileset',96,96,None,634,False),
            ('D9AD317B-080E-4CDE-8FA3-5E2290622668.png','cipres-imperial.png','imperialCypress','imperial:cipres','Ciprés Imperial','nature',64,96,{'x':16,'y':64,'w':32,'h':32},635,False),
            ('DD980D97-9086-4AB3-A0A4-7D338F5B658C.png','fuente-estelar.png','imperialStarFountain','imperial:fuente-estelar','Fuente Estelar Imperial','architecture',96,96,{'x':0,'y':48,'w':96,'h':48},636,False),
            ('E5224DA3-B8E0-41F4-A6E5-B3C5D71EEAF1.png','baldosa-esquina-laureada.png','imperialLaurelCornerTile','imperial:baldosa-esquina-laureada','Baldosa Esquina Laureada','tileset',96,96,None,637,False),
            ('E5CAAF89-C7B3-4DCB-A85E-BFD491651F78.png','cipres-espiral.png','imperialSpiralCypress','imperial:cipres-espiral','Ciprés Espiral Imperial','nature',64,96,{'x':16,'y':64,'w':32,'h':32},638,False),
            ('E6D760D2-62A3-443F-A73D-E70EE2C623E6.png','arco-floral.png','imperialFloralArch','imperial:arco-floral','Arco Floral Imperial','architecture',128,128,None,639,False),
            ('F91579B0-5CE0-4CF3-88F5-E01D4C634871.png','baldosa-curva-interior.png','imperialInnerCurveTile','imperial:baldosa-curva-interior','Baldosa Curva Interior','tileset',96,96,None,640,False),
            ('FCF668DC-AE80-436B-BB9E-DF4DEB131D82.png','carrito-mercado.png','imperialMarketCart','imperial:carrito-mercado','Carrito de Mercado Imperial','architecture',128,96,{'x':0,'y':48,'w':128,'h':48},641,False),
          ]

          def remove_border_black(src,dst):
            im=Image.open(src).convert('RGBA'); px=im.load(); w,h=im.size
            seen=bytearray(w*h); q=deque()
            def dark(x,y):
              r,g,b,a=px[x,y]
              return a>0 and max(r,g,b)<=58 and max(r,g,b)-min(r,g,b)<=22
            def add(x,y):
              i=y*w+x
              if not seen[i] and dark(x,y): seen[i]=1; q.append((x,y))
            for x in range(w): add(x,0); add(x,h-1)
            for y in range(h): add(0,y); add(w-1,y)
            removed=0
            while q:
              x,y=q.popleft(); r,g,b,a=px[x,y]; px[x,y]=(r,g,b,0); removed+=1
              if x: add(x-1,y)
              if x+1<w: add(x+1,y)
              if y: add(x,y-1)
              if y+1<h: add(x,y+1)
            if removed==0: raise RuntimeError(f'no connected black background found in {src}')
            im.save(dst,optimize=True)
            return removed

          records=[]
          for src_name,dst_name,key,tid,label,category,ww,wh,collision,cache,repair in defs:
            src=root/'assets'/src_name; dst=target/dst_name
            if src.exists():
              if repair:
                removed=remove_border_black(src,dst); print('alpha repaired',src_name,removed)
              else:
                shutil.copy2(src,dst)
              src.unlink()
            elif not dst.exists():
              raise FileNotFoundError(src)
            with Image.open(dst) as im:
              rgba=im.convert('RGBA'); iw,ih=rgba.size; amin,amax=rgba.getchannel('A').getextrema()
              if amin!=0 or amax!=255: raise RuntimeError(f'{dst}: expected real transparent and opaque pixels, got {(amin,amax)}')
              records.append(dict(src=src_name,file=dst_name,key=key,tid=tid,label=label,category=category,worldW=ww,worldH=wh,collision=collision,cache=cache,imageW=iw,imageH=ih))

          # Extend the existing shared catalog instead of creating a parallel editor catalog.
          catalog_path=root/'src/property/property-asset-catalog.js'
          catalog=catalog_path.read_text()
          marker='  ]);\n\n  function registerImperialPlazaAssets(){'
          if marker not in catalog: raise RuntimeError('imperial catalog insertion marker missing')
          lines=[]
          for r in records:
            col='null' if r['collision'] is None else "{x:%d,y:%d,w:%d,h:%d}"%(r['collision']['x'],r['collision']['y'],r['collision']['w'],r['collision']['h'])
            lines.append("    {key:'%s',id:'%s',label:'%s',src:'assets/world/imperial-plaza/%s?art=%d',imageW:%d,imageH:%d,width:%d,height:%d,category:'%s',collision:%s}"%(r['key'],r['tid'],r['label'].replace("'","\\'"),r['file'],r['cache'],r['imageW'],r['imageH'],r['worldW'],r['worldH'],r['category'],col))
          # Array already has 12 records; append comma + these 29 exactly once.
          if records[0]['key'] not in catalog:
            catalog=catalog.replace(marker, ',\n'.join(['  ]']) if False else marker)  # keep static analyzers simple
            insert=',\n'+',\n'.join(lines)+'\n'
            catalog=catalog.replace(marker,insert+marker,1)
          if catalog.count(records[0]['key'])!=1 or catalog.count(records[-1]['key'])!=1:
            raise RuntimeError('catalog registration count invalid')
          catalog=catalog.replace('property-asset-catalog-v1.2.2','property-asset-catalog-v1.3.0')
          catalog_path.write_text(catalog)

          manifest_path=root/'src/environment/art-asset-manifest.json'
          manifest=json.loads(manifest_path.read_text())
          existing={a.get('path') for a in manifest.get('assets',[])}
          for r in records:
            p=f"assets/world/imperial-plaza/{r['file']}"
            if p in existing: continue
            kind='standalone-decal' if r['category']=='tileset' else 'standalone-prop'
            layer='decals_details' if r['category']=='tileset' else 'props_back'
            manifest['assets'].append({
              'id':r['tid'].replace(':','-')+'-v1','family':'imperial-plaza','version':'1.0.0','path':p,'kind':kind,
              'width':r['imageW'],'height':r['imageH'],'requireAlpha':True,'sampling':'nearest',
              'frames':{'mode':'single','count':1},'ownership':'property-catalog','layers':[layer],
              'districtCompatibility':['*'],'cache':{'strategy':'query','key':'art','value':str(r['cache'])},'fallback':{'mode':'none'}
            })
            existing.add(p)
          manifest_path.write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n')

          # Hard validation: no root UUID uploads remain and all 41 semantic kit images exist.
          uuid_re=re.compile(r'^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}\.png$',re.I)
          leftovers=[p.name for p in (root/'assets').iterdir() if p.is_file() and uuid_re.match(p.name)]
          if leftovers: raise RuntimeError(f'UUID leftovers: {leftovers}')
          count=len(list(target.glob('*.png')))
          if count!=41: raise RuntimeError(f'expected 41 imperial semantic PNGs, got {count}')
          print('IMPERIAL_INTEGRATION_OK total=41 added=29')
          PY

      - name: Syntax and PNG contract
        shell: bash
        run: |
          node --check src/property/property-asset-catalog.js
          node scripts/validate-asset-integrity.mjs
          node scripts/validate-png-pipeline.mjs

      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets src/property/property-asset-catalog.js src/environment/art-asset-manifest.json
          git commit -m 'assets: integrate complete imperial plaza kit'
          git pull --rebase origin main
          git push origin HEAD:main
