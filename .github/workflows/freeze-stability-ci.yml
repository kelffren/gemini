name: Freeze stability - move wait resume
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/module-loader-failure.mjs
      - run: node tests/chat-lock-regression.mjs
      - run: npx playwright test --config=playwright.freeze.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freeze-stability-evidence
          retention-days: 7
          path: |
            freeze-report/
            test-results/
