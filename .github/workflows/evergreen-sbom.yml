name: Evergreen SBOM

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'server/package.json'
      - 'server/package-lock.json'
      - '.github/workflows/evergreen-sbom.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'server/package.json'
      - 'server/package-lock.json'
      - '.github/workflows/evergreen-sbom.yml'

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix server
      - name: Generate CycloneDX SBOMs
        run: |
          mkdir -p artifacts/sbom
          ./node_modules/.bin/cyclonedx-npm --package-lock-only --output-format JSON --output-file artifacts/sbom/root.cdx.json package.json
          ./node_modules/.bin/cyclonedx-npm --package-lock-only --output-format JSON --output-file artifacts/sbom/server.cdx.json server/package.json
      - uses: actions/upload-artifact@v4
        with:
          name: kelo-world-sbom
          path: artifacts/sbom/*.json
          if-no-files-found: error
          retention-days: 30
