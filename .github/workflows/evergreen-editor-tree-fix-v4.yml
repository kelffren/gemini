name: Evergreen editor tree fix v4

on:
  push:
    branches:
      - test/evergreen-editor-tree-fix-2026-09-16
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-apply:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'isolated evergreen editor tree verification v4')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser runtime
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Download uploaded Evergreen fix
        run: |
          cat > .tmp-download-fix.mjs <<'EOF'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ acceptDownloads: true });
          await page.goto('https://firestorage.ai/ja/f/W8QhEfaMX0NE', { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(6000);
          const candidates = [
            page.getByRole('button', { name: /ダウンロード|download/i }),
            page.getByRole('link', { name: /ダウンロード|download/i }),
            page.locator('a[href*="download"]'),
            page.locator('button').filter({ hasText: /\.tar\.gz|kelo-debt/i }),
            page.locator('a').filter({ hasText: /\.tar\.gz|kelo-debt/i })
          ];
          let target = null;
          for (const locator of candidates) if (await locator.count()) { target = locator.first(); break; }
          if (!target) throw new Error('No download control found');
          const downloadPromise = page.waitForEvent('download', { timeout: 60000 });
          await target.click();
          const download = await downloadPromise;
          await download.saveAs('/tmp/kelo-fix.tar.gz');
          await browser.close();
          EOF
          node .tmp-download-fix.mjs
          tar -tzf /tmp/kelo-fix.tar.gz >/tmp/archive-list.txt
          test -s /tmp/archive-list.txt

      - name: Apply all 87 uploaded patches locally
        run: |
          set -euo pipefail
          rm -rf /tmp/kelo-debt
          mkdir -p /tmp/kelo-debt
          tar -xzf /tmp/kelo-fix.tar.gz -C /tmp/kelo-debt
          patch_dir=/tmp/kelo-debt/kelo-debt/patches
          count=$(find "$patch_dir" -maxdepth 1 -type f -name '*.patch' | wc -l)
          echo "patch_count=$count"
          test "$count" -eq 87
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for patch in $(find "$patch_dir" -maxdepth 1 -type f -name '*.patch' | sort); do
            git am --3way "$patch"
          done
          rm -f .tmp-download-fix.mjs
          echo "applied_head=$(git rev-parse HEAD)"

      - name: Create exact real-editor regression
        run: |
          mkdir -p test-results
          cat > tests/editor-tree-move-reopen.e2e.spec.js <<'EOF'
          import { test, expect } from '@playwright/test';

          async function bootRealPropertyEditor(page) {
            await page.waitForFunction(() =>
              window.KELO_ENVIRONMENT_LAYERS &&
              window.KELO_ATLAS_CONTRACT &&
              window.KeloPlayerPosition,
              null,
              { timeout: 30000 }
            );
            // These are the actual production editor modules. Load them in their real dependency order.
            // The current first-use package omits the catalog/editor, so the test must activate the dormant
            // real editor surface explicitly rather than waiting for globals that normal boot never creates.
            if (!await page.evaluate(() => !!window.KELO_PROPERTY_CATALOG))
              await page.addScriptTag({ url: '/src/property/property-asset-catalog.js' });
            if (!await page.evaluate(() => !!window.KELO_PROPERTY_SYSTEM))
              await page.addScriptTag({ url: '/src/property/property-system.js' });
            if (!await page.evaluate(() => !!window.KELO_PROPERTY_EDITOR))
              await page.addScriptTag({ url: '/src/ui/property-editor.js' });
            await page.waitForFunction(() =>
              window.KELO_PROPERTY_EDITOR && window.KELO_PROPERTY_SYSTEM && window.KELO_PROPERTY_CATALOG,
              null,
              { timeout: 15000 }
            );
          }

          test('tree place -> move -> close -> walk -> reopen persists', async ({ page }) => {
            const relevantErrors = [];
            page.on('pageerror', e => {
              const s = String(e);
              if (/property|position|editor/i.test(s)) relevantErrors.push(s);
            });

            await page.goto('http://127.0.0.1:4173/?mapEditor=1', { waitUntil: 'domcontentloaded' });
            await page.evaluate(() => localStorage.removeItem('kelo_property_state_v1'));
            await page.reload({ waitUntil: 'domcontentloaded' });
            await bootRealPropertyEditor(page);

            await page.evaluate(() => window.KELO_PROPERTY_EDITOR.open('parcel'));
            await expect(page.locator('#kelo-property-editor')).toBeVisible();
            const firstOpenAudit = await page.evaluate(() => window.KeloPlayerPosition.snapshot());
            expect(firstOpenAudit.events.some(e => e.source === 'property-editor:open')).toBeTruthy();

            const tree = page.locator('#pe-list .pe-card').filter({ hasText: /árbol|arbol|tree/i }).first();
            await expect(tree).toBeVisible({ timeout: 15000 });
            const grant = tree.locator('.pe-test');
            if (await grant.count()) await grant.click();
            await tree.click();
            await expect(page.locator('#pe-selected')).toContainText(/Para colocar:/);

            const beforeCount = await page.evaluate(() => window.KELO_PROPERTY_SYSTEM.getPlacements(window.KELO_PROPERTY_EDITOR.parcelId).length);
            const placePoint = await page.evaluate(() => {
              const p = window.KELO_PROPERTY_SYSTEM.parcel(window.KELO_PROPERTY_EDITOR.parcelId);
              const wx = p.bounds.x + p.bounds.w * 0.42;
              const wy = p.bounds.y + p.bounds.h * 0.42;
              const z = (typeof CONFIG !== 'undefined' && CONFIG.zoom) || 1;
              const sw = (typeof screenW !== 'undefined' && screenW) || innerWidth;
              const sh = (typeof screenH !== 'undefined' && screenH) || innerHeight;
              return { x: sw / 2 + (wx - camera.x) * z, y: sh / 2 + (wy - camera.y) * z };
            });
            await page.mouse.click(placePoint.x, placePoint.y);
            await page.waitForFunction(n => window.KELO_PROPERTY_SYSTEM.getPlacements(window.KELO_PROPERTY_EDITOR.parcelId).length > n, beforeCount, { timeout: 10000 });
            const placed = await page.evaluate(() => {
              const rows = window.KELO_PROPERTY_SYSTEM.getPlacements(window.KELO_PROPERTY_EDITOR.parcelId);
              return rows[rows.length - 1];
            });
            expect(placed).toBeTruthy();
            await page.screenshot({ path: 'test-results/01-tree-placed.png', fullPage: true });

            const placedRow = page.locator('#pe-placed button').first();
            await expect(placedRow).toBeVisible();
            await placedRow.click();
            await expect(page.locator('#pe-move')).toBeEnabled();
            await page.locator('#pe-move').click();
            await expect(page.locator('#pe-move')).toContainText('TOCA DESTINO');

            const movePoint = await page.evaluate(() => {
              const p = window.KELO_PROPERTY_SYSTEM.parcel(window.KELO_PROPERTY_EDITOR.parcelId);
              const wx = p.bounds.x + p.bounds.w * 0.62;
              const wy = p.bounds.y + p.bounds.h * 0.46;
              const z = (typeof CONFIG !== 'undefined' && CONFIG.zoom) || 1;
              const sw = (typeof screenW !== 'undefined' && screenW) || innerWidth;
              const sh = (typeof screenH !== 'undefined' && screenH) || innerHeight;
              return { x: sw / 2 + (wx - camera.x) * z, y: sh / 2 + (wy - camera.y) * z };
            });
            await page.mouse.click(movePoint.x, movePoint.y);
            await page.waitForFunction(p => {
              const row = window.KELO_PROPERTY_SYSTEM.getPlacements(window.KELO_PROPERTY_EDITOR.parcelId).find(x => x.placementId === p.id);
              return !!row && (row.x !== p.x || row.y !== p.y);
            }, { id: placed.placementId, x: placed.x, y: placed.y }, { timeout: 10000 });
            const moved = await page.evaluate(id => window.KELO_PROPERTY_SYSTEM.getPlacements(window.KELO_PROPERTY_EDITOR.parcelId).find(x => x.placementId === id), placed.placementId);
            await page.screenshot({ path: 'test-results/02-tree-moved.png', fullPage: true });

            await page.locator('#pe-close').click();
            await expect(page.locator('#kelo-property-editor')).toBeHidden();
            const playerBefore = await page.evaluate(() => window.KeloPlayerPosition.capture());
            await page.keyboard.down('d');
            await page.waitForTimeout(1000);
            await page.keyboard.up('d');
            const playerAfter = await page.evaluate(() => window.KeloPlayerPosition.capture());
            expect(playerBefore).toBeTruthy();
            expect(playerAfter).toBeTruthy();
            expect(Math.hypot(playerAfter.x-playerBefore.x, playerAfter.y-playerBefore.y)).toBeGreaterThan(0.1);

            await page.evaluate(() => window.KELO_PROPERTY_EDITOR.open('parcel'));
            await expect(page.locator('#kelo-property-editor')).toBeVisible();
            const reopened = await page.evaluate(id => window.KELO_PROPERTY_SYSTEM.getPlacements(window.KELO_PROPERTY_EDITOR.parcelId).find(x => x.placementId === id), placed.placementId);
            expect(reopened).toBeTruthy();
            expect(reopened.x).toBe(moved.x);
            expect(reopened.y).toBe(moved.y);
            const reopenAudit = await page.evaluate(() => window.KeloPlayerPosition.snapshot());
            expect(reopenAudit.events.filter(e => e.source === 'property-editor:open').length).toBeGreaterThanOrEqual(2);
            expect(relevantErrors).toEqual([]);
            await page.screenshot({ path: 'test-results/03-tree-reopened.png', fullPage: true });
            console.log(JSON.stringify({ PASS: true, placed, moved, reopened, playerBefore, playerAfter, openAuditEvents: reopenAudit.events.filter(e => e.source === 'property-editor:open').length }));
          });
          EOF

      - name: Run exact requested browser flow
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/kelo-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          npx playwright test tests/editor-tree-move-reopen.e2e.spec.js --project=chromium --reporter=line

      - name: Upload visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evergreen-editor-tree-proof
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Run migration dependency guard
        run: |
          set -euo pipefail
          if [ -f scripts/check-dependencies.mjs ]; then node scripts/check-dependencies.mjs; fi

      - name: Publish only verified uploaded fix to isolated branch
        run: |
          set -euo pipefail
          rm -f tests/editor-tree-move-reopen.e2e.spec.js
          git rm -f .github/workflows/evergreen-editor-tree-fix.yml .github/workflows/evergreen-editor-tree-fix-v2.yml .github/workflows/evergreen-editor-tree-fix-v3.yml .github/workflows/evergreen-editor-tree-fix-v4.yml
          git commit -m 'chore: remove temporary evergreen verification harness'
          git push origin HEAD:test/evergreen-editor-tree-fix-2026-09-16
