name: Katana Frame Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/katana-frame-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix packed irregular katana frames
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/visuals/visual-manifests.js')
          s=p.read_text()
          old="""    sword_swap_katana_throw_visual: Object.freeze({
              id: 'sword_swap_katana_throw_visual', type: 'sprite_animation',
              assetId: 'sword_swap_katana_throw_asset', layer: 'worldFX',
              frameWidth: 362, frameHeight: 724, columns: 6, rows: 1, frames: 6, fps: 12, loop: true,
              width: 126, height: 252, alpha: 1, alignToVelocity: true, rotationOffset: 0,
              defaultSpeed: 720, defaultMaxDistance: 420
            })
          """
          new="""    sword_swap_katana_throw_visual: Object.freeze({
              id: 'sword_swap_katana_throw_visual', type: 'sprite_animation',
              assetId: 'sword_swap_katana_throw_asset', layer: 'worldFX',
              frames: 6, fps: 12, loop: true,
              frameRects: Object.freeze([
                Object.freeze({ x: 16, y: 299, width: 290, height: 119 }),
                Object.freeze({ x: 333, y: 299, width: 302, height: 123 }),
                Object.freeze({ x: 661, y: 277, width: 321, height: 159 }),
                Object.freeze({ x: 997, y: 273, width: 365, height: 190 }),
                Object.freeze({ x: 1373, y: 271, width: 385, height: 188 }),
                Object.freeze({ x: 1768, y: 248, width: 394, height: 260 })
              ]),
              sourcePixelScale: 0.348, width: 140, height: 94,
              alpha: 1, alignToVelocity: true, rotationOffset: 0,
              defaultSpeed: 720, defaultMaxDistance: 420
            })
          """
          assert old in s, 'katana visual manifest anchor missing'
          s=s.replace(old,new).replace("version: 'visual-manifests-v1.3.0'", "version: 'visual-manifests-v1.3.1'")
          p.write_text(s)

          p=Path('src/visuals/fx-system.js')
          s=p.read_text()
          old="""    if (def.type === 'sprite_animation') {
                const frameWidth = Math.max(1, Number(def.frameWidth) || sw);
                const frameHeight = Math.max(1, Number(def.frameHeight) || sh);
                const columns = Math.max(1, Number(def.columns) || Math.floor(sw / frameWidth) || 1);
                const rows = Math.max(1, Number(def.rows) || Math.floor(sh / frameHeight) || 1);
                const available = Math.max(1, columns * rows);
                const frameCount = Math.max(1, Math.min(Number(def.frames) || available, available));
                const fps = Math.max(0.001, Number(def.fps) || 12);
                const rawFrame = Math.floor(item.elapsed * fps);
                const frame = item.loop ? rawFrame % frameCount : Math.min(frameCount - 1, rawFrame);
                sx = (frame % columns) * frameWidth;
                sy = Math.floor(frame / columns) * frameHeight;
                sw = frameWidth;
                sh = frameHeight;
              }

              const width = (Number(def.width) || sw || 32) * item.scale;
              const height = (Number(def.height) || sh || 32) * item.scale;
          """
          new="""    if (def.type === 'sprite_animation') {
                const rects = Array.isArray(def.frameRects) ? def.frameRects : null;
                const fps = Math.max(0.001, Number(def.fps) || 12);
                if (rects && rects.length) {
                  const frameCount = Math.max(1, Math.min(Number(def.frames) || rects.length, rects.length));
                  const rawFrame = Math.floor(item.elapsed * fps);
                  const frame = item.loop ? rawFrame % frameCount : Math.min(frameCount - 1, rawFrame);
                  const rect = rects[frame] || rects[0];
                  sx = Math.max(0, Number(rect.x) || 0);
                  sy = Math.max(0, Number(rect.y) || 0);
                  sw = Math.max(1, Number(rect.width) || sw);
                  sh = Math.max(1, Number(rect.height) || sh);
                } else {
                  const frameWidth = Math.max(1, Number(def.frameWidth) || sw);
                  const frameHeight = Math.max(1, Number(def.frameHeight) || sh);
                  const columns = Math.max(1, Number(def.columns) || Math.floor(sw / frameWidth) || 1);
                  const rows = Math.max(1, Number(def.rows) || Math.floor(sh / frameHeight) || 1);
                  const available = Math.max(1, columns * rows);
                  const frameCount = Math.max(1, Math.min(Number(def.frames) || available, available));
                  const rawFrame = Math.floor(item.elapsed * fps);
                  const frame = item.loop ? rawFrame % frameCount : Math.min(frameCount - 1, rawFrame);
                  sx = (frame % columns) * frameWidth;
                  sy = Math.floor(frame / columns) * frameHeight;
                  sw = frameWidth;
                  sh = frameHeight;
                }
              }

              const sourcePixelScale = Math.max(0, Number(def.sourcePixelScale) || 0);
              const width = (sourcePixelScale ? sw * sourcePixelScale : (Number(def.width) || sw || 32)) * item.scale;
              const height = (sourcePixelScale ? sh * sourcePixelScale : (Number(def.height) || sh || 32)) * item.scale;
          """
          assert old in s, 'asset projectile crop anchor missing'
          s=s.replace(old,new)
          s=s.replace('projectile-visual-registry-v1.1.0','projectile-visual-registry-v1.1.1').replace('projectile-visual-runtime-v1.1.0','projectile-visual-runtime-v1.1.1')
          p.write_text(s)
          PY
      - name: Validate
        run: |
          node --check src/visuals/visual-manifests.js
          node --check src/visuals/fx-system.js
          grep -q 'frameRects' src/visuals/visual-manifests.js
          grep -q 'sourcePixelScale' src/visuals/fx-system.js
          git diff --check
      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name 'kelo-visual-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/visuals/visual-manifests.js src/visuals/fx-system.js
          git rm .github/workflows/katana-frame-fix.yml
          git commit -m 'visual: isolate packed katana throw frames'
          git push origin HEAD:main
