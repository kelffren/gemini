name: Backpack CI
on:
  push:
    branches: [main]
    paths:
      - 'src/systems/backpack-system.js'
      - 'src/systems/equipment-system.js'
      - 'src/systems/container-system.js'
      - 'src/systems/market-escrow-system.js'
      - 'src/ui/backpack-ui.js'
      - 'src/ui/warehouse-ui.js'
      - 'src/ui/market-ui.js'
      - 'scripts/backpack-system-audit.js'
      - 'scripts/container-system-audit.js'
      - 'scripts/market-escrow-audit.js'
      - '.github/workflows/backpack-ci.yml'
      - 'index.html'
  pull_request:
    paths:
      - 'src/systems/backpack-system.js'
      - 'src/systems/equipment-system.js'
      - 'src/systems/container-system.js'
      - 'src/systems/market-escrow-system.js'
      - 'src/ui/backpack-ui.js'
      - 'src/ui/warehouse-ui.js'
      - 'src/ui/market-ui.js'
      - 'scripts/backpack-system-audit.js'
      - 'scripts/container-system-audit.js'
      - 'scripts/market-escrow-audit.js'
      - '.github/workflows/backpack-ci.yml'
      - 'index.html'
  workflow_dispatch:
jobs:
  backpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: |
          node --check src/systems/equipment-system.js
          node --check src/systems/backpack-system.js
          node --check src/systems/container-system.js
          node --check src/systems/market-escrow-system.js
          node --check src/ui/backpack-ui.js
          node --check src/ui/warehouse-ui.js
          node --check src/ui/market-ui.js
          node --check scripts/backpack-system-audit.js
          node --check scripts/container-system-audit.js
          node --check scripts/market-escrow-audit.js
      - name: Backpack mechanics
        run: node scripts/backpack-system-audit.js
      - name: Container mechanics
        run: node scripts/container-system-audit.js
      - name: Market Escrow mechanics
        run: node scripts/market-escrow-audit.js
      - name: Integration contract
        run: |
          grep -q "equipment-v1.1.2" src/systems/equipment-system.js
          grep -q "marketEscrowAwareStarterIdentity:true" src/systems/equipment-system.js
          grep -q "backpack-v1.1.0" src/systems/backpack-system.js
          grep -q "stacksImplemented:true" src/systems/backpack-system.js
          grep -q "splitImplemented:true" src/systems/backpack-system.js
          grep -q "container-v1.1.0" src/systems/container-system.js
          grep -q "strictDestinationCapacity:true" src/systems/container-system.js
          grep -q "warehouseImplemented:true" src/systems/container-system.js
          grep -q "marketEscrowImplemented:true" src/systems/container-system.js
          grep -q "marketEscrowMerge:false" src/systems/container-system.js
          grep -q "market-escrow-v1.0.0" src/systems/market-escrow-system.js
          grep -q "listingContract:'validate-transfer-create-persist-rollback-v1'" src/systems/market-escrow-system.js
          grep -q "cancelContract:'validate-transfer-close-persist-rollback-v1'" src/systems/market-escrow-system.js
          grep -q "warehouse-ui-v1.0.1" src/ui/warehouse-ui.js
          grep -q "market-ui-v1.0.0" src/ui/market-ui.js
          grep -q "backpackPublishAction:true" src/ui/market-ui.js
