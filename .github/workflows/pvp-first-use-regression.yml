name: PvP First-Use Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/core/feature-registry.js'
      - 'src/core/module-loader.js'
      - 'src/systems/pvp-world.js'
      - 'src/systems/pvp-combat-runtime-loader.js'
      - 'src/abilities/**'
      - 'engine-net.js'
      - 'src/ui/luxe-shell.js'
      - 'tests/pvp-dodge-live.spec.js'
      - '.github/workflows/pvp-first-use-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pvp-first-use:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start local game
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/kelo-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/kelo-http.log
          exit 1
      - name: Visible PvP button + first-use runtime + dodge
        run: npx playwright test tests/pvp-dodge-live.spec.js --project=chromium
      - name: Foundation audit
        run: npm run audit:foundation
      - name: Docs audit
        run: npm run audit:docs
