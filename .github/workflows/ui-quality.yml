name: Kelo UI Quality

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/ui/**'
      - 'src/studio/ui/**'
      - 'src/creators/ui/**'
      - 'scripts/ui-quality-audit.mjs'
      - 'docs/KELO_INTERFACE_STANDARD.md'
      - '.github/workflows/ui-quality.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'src/ui/**'
      - 'src/studio/ui/**'
      - 'src/creators/ui/**'
      - 'scripts/ui-quality-audit.mjs'
      - 'docs/KELO_INTERFACE_STANDARD.md'
      - '.github/workflows/ui-quality.yml'

permissions:
  contents: read

jobs:
  interface-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Shared interface contract
        run: |
          test -f src/ui/kelo-interface-system.css
          test -f src/ui/kelo-interface-runtime.js
          test -f docs/KELO_INTERFACE_STANDARD.md
          grep -q 'kelo-interface-system.css' index.html
          grep -q 'kelo-interface-runtime.js' index.html
          grep -q ':focus-visible' src/ui/kelo-interface-system.css
          grep -q 'prefers-reduced-motion' src/ui/kelo-interface-system.css
          grep -q 'More Tools' src/ui/kelo-interface-runtime.js
      - name: Interface syntax
        run: |
          node --check src/ui/kelo-interface-runtime.js
          node --check scripts/ui-quality-audit.mjs
          node --check src/ui/luxe-shell.js
          node --check src/ui/account-auth-ui.js
          node --check src/creators/ui/creator-hub.mjs
          node --check src/studio/ui/studio-live-shell.mjs
          node --check src/studio/ui/studio-asset-repairer-v2.mjs
      - name: Project-wide UI audit
        run: node scripts/ui-quality-audit.mjs
