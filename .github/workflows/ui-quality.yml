name: Kelo UI Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interface-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect interface changes
        id: ui_changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            before="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          if [ -z "$before" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "$before" HEAD || true)"
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -Eq '^(index\.html|src/ui/|src/studio/ui/|src/creators/ui/|tests/ui-interface-runtime\.spec\.js$|playwright\.config\.js$|package\.json$|scripts/ui-quality-audit\.mjs$|docs/KELO_INTERFACE_STANDARD\.md$|\.github/workflows/ui-quality\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Shared interface contract
        if: steps.ui_changes.outputs.changed == 'true'
        run: |
          test -f src/ui/kelo-interface-system.css
          test -f src/ui/kelo-interface-compat.css
          test -f src/ui/kelo-interface-runtime.js
          test -f docs/KELO_INTERFACE_STANDARD.md
          test -f tests/ui-interface-runtime.spec.js
          grep -q 'kelo-interface-system.css' index.html
          grep -q 'kelo-interface-compat.css' index.html
          grep -q 'kelo-interface-runtime.js' index.html
          grep -q ':focus-visible' src/ui/kelo-interface-system.css
          grep -q ':focus-visible' src/ui/kelo-interface-compat.css
          grep -q 'prefers-reduced-motion' src/ui/kelo-interface-system.css
          grep -q 'More Tools' src/ui/kelo-interface-runtime.js

      - name: Interface syntax
        if: steps.ui_changes.outputs.changed == 'true'
        run: |
          node --check src/ui/kelo-interface-runtime.js
          node --check scripts/ui-quality-audit.mjs
          node --check tests/ui-interface-runtime.spec.js
          node --check src/ui/luxe-shell.js
          node --check src/ui/account-auth-ui.js
          node --check src/creators/ui/creator-hub.mjs
          node --check src/studio/ui/studio-live-shell.mjs
          node --check src/studio/ui/studio-asset-repairer-v2.mjs

      - name: Project-wide UI audit
        if: steps.ui_changes.outputs.changed == 'true'
        run: node scripts/ui-quality-audit.mjs | tee ui-quality-report.txt

      - name: Install browser contract dependencies
        if: steps.ui_changes.outputs.changed == 'true'
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Computed browser hierarchy contract
        if: steps.ui_changes.outputs.changed == 'true'
        run: npx playwright test tests/ui-interface-runtime.spec.js --project=chromium --reporter=list

      - name: Publish UI quality report
        if: always() && steps.ui_changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kelo-ui-quality-report
          path: ui-quality-report.txt
          retention-days: 14
