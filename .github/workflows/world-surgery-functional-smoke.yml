name: World Surgery Functional Smoke

on:
  push:
    branches: [world-surgery]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply mobile asset preview recovery candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/studio/integration/live-studio-controller.mjs')
          s=p.read_text()

          reps=[
          (
          "overlayMod={createStudioOverlayCanvas:()=>({canvas:null,ctx:null,resize:()=>({}),clear(){},destroy(){},dpr:1})};\n    gridMod={createCreatorGridOverlay:()=>({draw(){},configure(){}})};",
          "overlayMod=await import('../render/studio-overlay-canvas.mjs');await wait();abortIfNeeded();\n    gridMod={createCreatorGridOverlay:()=>({draw(){},configure(){}})};"
          ),
          (
          "const baseAssets=studio.adapter.assetCatalog.list()||[],allAssets=()=>[...baseAssets,...prefabLibrary.assets()];",
          "const allAssets=()=>[...(studio.adapter.assetCatalog.list()||[]),...prefabLibrary.assets()];"
          ),
          (
          "components:{visual:{source:'phone-seed',parts:[]}},\n        dependencies:[]",
          "components:{visual:{source:'phone-seed',parts:Array.isArray(asset.parts)?asset.parts:[]}},\n        dependencies:[...new Set((asset.parts||[]).map(part=>part.assetKey).filter(Boolean))]"
          ),
          (
          "function beginPlacement(assetId){if(playing)return;try{cameraController?.setPanMode(false);studio.tools.terrain.cancel();studio.tools.collision.setVisible(false);studio.tools.placement.cancel();studio.tools.prefabStamp.cancel();if(prefabLibrary.get(assetId)){studio.tools.prefabStamp.start(assetId);mode='prefab';}else{studio.tools.placement.start(assetId);studio.assetPreview.warmAsset(assetId).catch(()=>{});mode='placement';}updateShell();}catch(e){toast(root,e.message);}}",
          "function beginPlacement(assetId){if(playing)return;try{cameraController?.setPanMode(false);studio.tools.terrain.cancel();studio.tools.collision.setVisible(false);studio.tools.placement.cancel();studio.tools.prefabStamp.cancel();const liveAsset=studio.adapter.assetCatalog.get(assetId);if(liveAsset)ensurePhonePlacementPrefabs(studio,[liveAsset]);if(prefabLibrary.get(assetId)){studio.tools.prefabStamp.start(assetId);mode='prefab';}else{studio.tools.placement.start(assetId);studio.assetPreview.warmAsset(assetId).catch(()=>{});mode='placement';}updateShell();}catch(e){toast(root,e.message);}}"
          ),
          (
          "if(!running||shell.root.dataset.keloAssetsReady==='1')return;\n        shell.root.dataset.keloAssetsReady='1';\n        try{\n          phonePreview?.reset?.();\n          const list=allAssets();\n          ensurePhonePlacementPrefabs(studio,list.slice(0,80));\n          shell.setAssets(list);",
          "if(!running||shell.root.dataset.keloAssetsReady==='1')return;\n        try{\n          const list=allAssets();\n          if(!list.length)return;\n          shell.root.dataset.keloAssetsReady='1';\n          phonePreview?.reset?.();\n          shell.setAssets(list);"
          ),
          (
          "const n=(allAssets()||[]).length;\n        if(n>4)paintSeed('refresh',{openSheet:true});",
          "const n=(allAssets()||[]).length;\n        if(n>0)loadFullAssets();"
          ),
          (
          "if(phoneOverlay||surgery?.enabled?.('overlay')===false||typeof createStudioOverlayCanvas!=='function'){surgery?.markStatus?.('overlay','DISABLED',{phase:'live-overlay'});return;}",
          "if(surgery?.enabled?.('overlay')===false||typeof createStudioOverlayCanvas!=='function'){surgery?.markStatus?.('overlay','DISABLED',{phase:'live-overlay'});return;}"
          ),
          (
          "studio.overlayRenderer.draw(ctx);\n        ctx.restore();",
          "studio.overlayRenderer.draw(ctx);\n        if(phoneOverlay){const preview=studio.tools.placement.getPreview?.();if(preview)studio.assetPreview.drawAsset(ctx,preview.prefabId,Number(preview.transform?.x)||0,Number(preview.transform?.y)||0,{rotation:Number(preview.transform?.rotation)||0,alpha:.82,placeholder:true});}\n        ctx.restore();"
          ),
          (
          "if(phoneOverlay){\n        try{shell?.setStatus?.(`${mode.toUpperCase()} · listo · coloca assets`);}catch{}\n        updateShell();\n        return;\n      }",
          "if(phoneOverlay){\n        try{shell?.setStatus?.(`${mode.toUpperCase()} · listo · coloca assets`);}catch{}\n        updateShell();\n        startStudioOverlayDraw();\n        return;\n      }"
          )
          ]
          for old,new in reps:
              if old not in s:
                  raise SystemExit('PATCH_TARGET_MISSING:'+old[:90])
              s=s.replace(old,new,1)
          p.write_text(s)
          PY

      - name: Patch visual harness for real mobile proof
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/world-surgery-functional-smoke.mjs')
          s=p.read_text()
          old='await page.locator(`#kelo-studio-live [data-asset="${tree.id.replaceAll(\'"\',\'\\\\"\')}"]`).first().tap();'
          new='await page.locator(`#kelo-studio-live [data-asset="${tree.id.replaceAll(\'"\',\'\\\\"\')}"]:visible`).first().tap();'
          if old not in s: raise SystemExit('VISIBLE_ASSET_PATCH_TARGET_MISSING')
          s=s.replace(old,new,1)

          old2='await canvas.tap({position:point});'
          new2="await page.getByRole('button',{name:/COLOCAR AQUÍ/i}).tap();"
          if old2 not in s: raise SystemExit('PLACE_HERE_PATCH_TARGET_MISSING')
          s=s.replace(old2,new2,1)

          marker="const live=()=>page.locator('#kelo-studio-live');"
          helper="""const live=()=>page.locator('#kelo-studio-live');
const studioEntityCount=()=>page.evaluate(async()=>{const m=await import('./src/studio/studio-entry.mjs?v=world-bridge-20260915-22');return Number(m.getKeloStudioSession?.()?.kernel?.document?.entities?.length||0);});"""
          if marker not in s: raise SystemExit('SESSION_HELPER_TARGET_MISSING')
          s=s.replace(marker,helper,1)

          old3="""  await page.waitForSelector('#kelo-studio-live [data-pane=\"assets\"] [data-asset]',{state:'visible',timeout:15000});
  await page.waitForTimeout(700);"""
          new3="""  await page.waitForSelector('#kelo-studio-live [data-pane=\"assets\"] [data-asset]',{state:'visible',timeout:15000});
  await page.waitForFunction(()=>document.getElementById('kelo-studio-live')?.dataset?.keloAssetsReady==='1',{timeout:12000}).catch(()=>{});
  await page.waitForTimeout(1200);"""
          if old3 not in s: raise SystemExit('ASSET_READY_TARGET_MISSING')
          s=s.replace(old3,new3,1)

          old4="""  report.steps.assetPreviews.compactPreview=compactPreview;
  if(!compactPreview.present||!compactPreview.ink)fail(`ACTIVE_TREE_PREVIEW_EMPTY:${JSON.stringify(compactPreview)}`);
  return tree;"""
          new4="""  report.steps.assetPreviews.compactPreview=compactPreview;
  if(!compactPreview.present||!compactPreview.ink)fail(`ACTIVE_TREE_PREVIEW_EMPTY:${JSON.stringify(compactPreview)}`);
  await page.waitForTimeout(700);
  const ghost=await page.evaluate(()=>{const c=document.querySelector('canvas.kelo-studio-overlay');if(!c)return {present:false,alphaPixels:0};let alphaPixels=0;try{const d=c.getContext('2d')?.getImageData(0,0,c.width,c.height)?.data||[];for(let i=3;i<d.length;i+=4)if(d[i]>12)alphaPixels++;}catch{}return {present:true,width:c.width,height:c.height,alphaPixels};});
  report.steps.assetPreviews.ghost=ghost;
  await shot('02-tree-ghost');
  if(!ghost.present||ghost.alphaPixels<20)fail(`TREE_WORLD_GHOST_EMPTY:${JSON.stringify(ghost)}`);
  return tree;"""
          if old4 not in s: raise SystemExit('GHOST_PROOF_TARGET_MISSING')
          s=s.replace(old4,new4,1)

          old5="""  await page.waitForFunction(previous=>{
    const status=document.querySelector('#kelo-studio-live .ks-status')?.textContent||'';
    return Number(status.match(/(\\d+)\\s+objects?/i)?.[1]||0)>previous;
  },beforeObjects,{timeout:15000});
  const status=await live().locator('.ks-status').textContent();
  const afterObjects=objectCountFromStatus(status);"""
          new5="""  await page.waitForFunction(async previous=>{const m=await import('./src/studio/studio-entry.mjs?v=world-bridge-20260915-22');return Number(m.getKeloStudioSession?.()?.kernel?.document?.entities?.length||0)>previous;},beforeObjects,{timeout:15000});
  const status=await live().locator('.ks-status').textContent();
  const afterObjects=await studioEntityCount();"""
          if old5 not in s: raise SystemExit('ENTITY_COUNT_TARGET_MISSING')
          s=s.replace(old5,new5,1)

          old6='const placed=await placeTree(tree,mounted.objects);'
          new6='const placed=await placeTree(tree,await studioEntityCount());'
          if old6 not in s: raise SystemExit('PLACED_CALL_TARGET_MISSING')
          s=s.replace(old6,new6,1)
          p.write_text(s)
          PY

      - name: Syntax check
        run: |
          node --check scripts/world-surgery-functional-smoke.mjs
          node --check src/studio/diagnostics/world-surgery-control.mjs
          node --check src/studio/studio-entry.mjs
          node --check src/studio/integration/live-studio-controller.mjs

      - name: Install Playwright package
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.55.0

      - name: Serve branch candidate
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/world-surgery-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8000/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/world-surgery-http.log
          exit 1

      - name: Run iPhone-sized surgery smoke
        env:
          AUDIT_URL: http://127.0.0.1:8000/
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/world-surgery-functional-smoke.mjs

      - name: Upload World Surgery visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-surgery-visual-proof-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            test-results/world-surgery-proof/**
            /tmp/world-surgery-http.log
