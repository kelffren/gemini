name: Gardens mobile LIVE audit
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/plaza-transitions-v3.png'
      - 'src/environment/tile-registry.js'
      - 'src/environment/gardens-atlas.js'
      - 'src/environment/gardens-landmark.js'
      - 'src/environment/world-map.js'
      - 'scripts/live-gardens-audit.mjs'
      - '.github/workflows/live-gardens-audit.yml'
  workflow_dispatch:
jobs:
  audit-gardens:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax and contract
        run: |
          node --check src/environment/gardens-landmark.js
          node --check src/environment/tile-registry.js
          node --check scripts/live-gardens-audit.mjs
          grep -q "src/environment/gardens-landmark.js?v=2" index.html
          grep -q "src/environment/tile-registry.js?v=234" index.html
          grep -q "plaza-transitions-v3.png?art=142" src/environment/tile-registry.js
          grep -q "authored-organic-fringe-overlay-v3" src/environment/tile-registry.js
          grep -q "gardens-landmark-v1.1" src/environment/gardens-landmark.js
          grep -q "final-composite-back-actor-front-v1" src/environment/gardens-landmark.js
          grep -q "layered-prefab-atlas-v1" src/environment/gardens-landmark.js
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Audit deployed Gardens on mobile
        env:
          AUDIT_URL: https://kelffren.github.io/gemini/
          CHROME_BIN: /usr/bin/google-chrome
          EXPECTED_TITLE: Kelo World — V6.12
        run: node scripts/live-gardens-audit.mjs
      - name: Upload Gardens evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-gardens-audit
          path: artifacts/
          if-no-files-found: error
