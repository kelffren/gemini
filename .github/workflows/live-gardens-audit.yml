name: Gardens mobile LIVE audit
on:
  push:
    branches: [main]
    paths:
      - 'src/environment/gardens-joins.js'
      - 'src/environment/gardens-compositions.js'
      - 'src/environment/gardens-landmark.js'
      - 'src/environment/world-map.js'
      - 'scripts/live-gardens-variants-audit.mjs'
      - '.github/workflows/live-gardens-audit.yml'
  workflow_dispatch:
jobs:
  audit-gardens:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax and contract
        run: |
          node --check src/environment/gardens-atlas.js
          node --check src/environment/gardens-joins.js
          node --check src/environment/gardens-compositions.js
          node --check src/environment/gardens-landmark.js
          node --check src/environment/world-map.js
          node --check scripts/live-gardens-variants-audit.mjs
          grep -q "gardens-joins-v3" src/environment/gardens-joins.js
          grep -q "authored-garden-endcaps-mid-variants-v3" src/environment/gardens-joins.js
          grep -q "HEDGE_MID_ALT:6" src/environment/gardens-joins.js
          grep -q "FLOWER_MID_ALT:7" src/environment/gardens-joins.js
          grep -q "HEDGE_V_ALT:8" src/environment/gardens-joins.js
          grep -q "registry-authored-garden-compositions-v4" src/environment/gardens-compositions.js
          grep -q "mirrored-authored-vertical-mid-v1" src/environment/gardens-compositions.js
          grep -q "verticalAltUsageCount:2" src/environment/gardens-compositions.js
          grep -q "world-v1.14" src/environment/world-map.js
          grep -q "gardens-landmark-v1.1" src/environment/gardens-landmark.js
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Audit deployed Gardens on mobile
        env:
          AUDIT_URL: https://kelffren.github.io/gemini/
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/live-gardens-variants-audit.mjs
      - name: Upload Gardens evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-gardens-audit
          path: artifacts/
          if-no-files-found: error
