name: LIVE Pages Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/pvp-pages-live-smoke.spec.js'
      - 'tests/environment-pages-live-smoke.spec.js'
      - '.github/workflows/pvp-live-pages-smoke.yml'
      - 'src/core/feature-registry.js'
      - 'src/core/module-loader.js'
      - 'src/ui/luxe-shell.js'
      - 'src/ui/luxe-player-hud.js'
      - 'src/systems/pvp-world.js'
      - 'src/systems/pvp-combat-runtime-loader.js'
      - 'src/abilities/**'
      - 'src/environment/environment-layer-stack.js'
      - 'src/environment/environment-runtime.mjs'
      - 'src/environment/environment-world-sync.mjs'
      - 'src/online/kelo-supabase-public-config.mjs'
      - 'engine-net.js'
  # GitHub Pages is configured as "Deploy from a branch", so its publisher is
  # an internal dynamic workflow. page_build is the documented repository event
  # for pushes to that Pages publishing source and is more reliable here than
  # trying to chain workflow_run from GitHub's generated workflow.
  page_build:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  # All production page_build events share one group, so a newer Pages build
  # cancels an older smoke that is still waiting for publication. PRs remain
  # isolated by github.ref and therefore cannot cancel each other's validation.
  group: live-pages-smoke-${{ github.event_name }}-${{ github.event_name == 'page_build' && 'main' || github.ref }}
  cancel-in-progress: true

jobs:
  live-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait until Pages actually serves this build or a descendant
        if: github.event_name == 'page_build'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.build.commit || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Pages target: $TARGET_SHA"
          for attempt in $(seq 1 90); do
            latest="$(curl -fsSL \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds/latest" || true)"

            status="$(jq -r '.status // empty' <<<"$latest" 2>/dev/null || true)"
            deployed="$(jq -r '.commit // empty' <<<"$latest" 2>/dev/null || true)"
            echo "attempt=$attempt status=${status:-unknown} deployed=${deployed:-unknown}"

            if [[ "$status" == "built" && -n "$deployed" ]]; then
              if [[ "$deployed" == "$TARGET_SHA" ]]; then
                echo "Pages is serving the exact target build."
                exit 0
              fi

              compare="$(curl -fsSL \
                -H 'Accept: application/vnd.github+json' \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'X-GitHub-Api-Version: 2026-03-10' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/compare/${TARGET_SHA}...${deployed}" || true)"
              relation="$(jq -r '.status // empty' <<<"$compare" 2>/dev/null || true)"
              echo "target_to_deployed=${relation:-unknown}"
              if [[ "$relation" == "ahead" || "$relation" == "identical" ]]; then
                echo "Pages is serving a descendant that contains the target build."
                exit 0
              fi
            fi
            sleep 5
          done

          echo "Pages never confirmed the target SHA or a descendant within the deployment barrier."
          exit 1

      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke deployed PvP through real iPhone UI
        env:
          KELO_PAGES_URL: https://kelffren.github.io/gemini/
        run: npx playwright test tests/pvp-pages-live-smoke.spec.js --project=chromium --retries=1
      - name: Smoke two-iPhone canonical environment convergence
        env:
          KELO_PAGES_URL: https://kelffren.github.io/gemini/
        run: npx playwright test tests/environment-pages-live-smoke.spec.js --project=chromium --retries=1
