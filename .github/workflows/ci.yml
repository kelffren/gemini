name: Kelo CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archivos clave
        run: |
          test -f index.html
          test -f engine-net.js
          test -f server/index.js
          test -f server/package.json
          grep -q "engine-net.js" index.html
      - name: Server syntax
        run: node --check server/index.js
