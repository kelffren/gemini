name: Kelo CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archivos clave
        run: |
          test -f index.html
          test -f engine-net.js
          test -f server/index.js
          test -f server/package.json
          grep -q "engine-net.js" index.html
      - name: Server syntax
        run: node --check server/index.js
      - name: Environment and visual contracts
        run: |
          node --check src/environment/rural-nature-atlas.js
          node --check src/environment/tile-registry.js
          node --check src/environment/world-map.js
          node --check src/environment/rural-ground.js
          node --check src/environment/rural-landmarks.js
          node --check src/environment/luxe-compose.js
          node --check src/ui/luxe-shell.js
          node --check src/ui/luxe-boutique.js
          node --check engine-a.js
          node --check engine-h.js
          grep -q 'id="toast-container"' index.html
          grep -q 'src/environment/rural-nature-atlas.js' index.html
          grep -q 'src/environment/rural-landmarks.js' index.html
          grep -q 'src/ui/luxe-shell.js' index.html
          grep -q 'src/ui/luxe-boutique.js' index.html
          grep -q "luxe-shell-v2.0" src/ui/luxe-shell.js
          grep -q "forest-ivory-gold" src/ui/luxe-shell.js
          if ! grep -q 'DISABLED_PROCEDURAL_ART' src/environment/luxe-compose.js; then
            echo 'rejected procedural plaza overlay was reactivated'
            exit 1
          fi
          if grep -Eq "assets/plaza\.jpg|assets/plaza-sm\.jpg|'plaza\.jpg'" engine-h.js; then
            echo 'legacy missing plaza JPG request detected'
            exit 1
          fi
          if grep -q "assets/hero\.png" engine-ab.js; then
            echo 'missing lowercase hero fallback detected'
            exit 1
          fi
          python3 - <<'PY'
          import ast, base64, re, struct
          ast.parse(open('scripts/generate_rural_landmarks.py',encoding='utf-8').read())
          for path in ('assets/rural-soil-v1.png','assets/rural-props-v1.png'):
              header=open(path,'rb').read(24)
              assert header[:8] == b'\x89PNG\r\n\x1a\n'
              width,height=struct.unpack('>II',header[16:24])
              assert (width,height)==(128,128),(path,width,height)
              assert width%32==0 and height%32==0
              print('PASS rural atlas',path,width,height,'tile=32 grid=4x4')
          path='assets/rural-landmarks-v1.png'
          header=open(path,'rb').read(24)
          assert header[:8] == b'\x89PNG\r\n\x1a\n'
          width,height=struct.unpack('>II',header[16:24])
          assert (width,height)==(256,128),(path,width,height)
          assert width%32==0 and height%32==0
          print('PASS rural landmarks atlas',path,width,height,'tile=32 grid=8x4')
          source=open('src/environment/rural-nature-atlas.js',encoding='utf-8').read()
          match=re.search(r"data:image/png;base64,([^']+)",source)
          assert match, 'embedded rural nature PNG missing'
          raw=base64.b64decode(match.group(1))
          assert raw[:8] == b'\x89PNG\r\n\x1a\n'
          width,height=struct.unpack('>II',raw[16:24])
          assert (width,height)==(256,128),(width,height)
          assert width%32==0 and height%32==0
          print('PASS embedded rural nature atlas',width,height,'tile=32 grid=8x4')
          PY
