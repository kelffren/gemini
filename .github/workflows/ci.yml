name: Kelo CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archivos clave
        run: |
          test -f index.html
          test -f engine-net.js
          test -f server/index.js
          test -f server/package.json
          test -f server/nobility-store.js
          test -f supabase/migrations/20260903_nobility.sql
          test -f src/systems/nobility.js
          test -f src/systems/nobility-authority.js
          test -f src/systems/nobility-combat.js
          test -f scripts/server-nobility-audit.js
          test -f scripts/live-rural-audit.mjs
          test -f scripts/live-district-decals-audit.mjs
          test -f src/environment/district-decals-registry.js
          test -f src/environment/district-decals.js
          test -f assets/district-decals-v1.svg
          test -f assets/plaza-fountain-back.PNG
          test -f assets/plaza-fountain-front.PNG
          test -f assets/plaza-npcs-v1.svg
          grep -q "engine-net.js?v=95" index.html
          grep -q "src/systems/nobility.js?v=2" index.html
          grep -q "src/systems/nobility-authority.js?v=1" index.html
          grep -q "src/systems/nobility-combat.js?v=1" index.html
          grep -q "src/environment/rural-landmarks.js?v=209" index.html
          grep -q "src/environment/district-decals-registry.js?v=2" index.html
          grep -q "src/environment/district-decals.js?v=2" index.html
      - name: Server and nobility syntax
        run: |
          node --check server/index.js
          node --check server/nobility-store.js
          node --check engine-net.js
          node --check src/systems/nobility.js
          node --check src/systems/nobility-authority.js
          node --check src/systems/nobility-combat.js
          node --check scripts/server-nobility-audit.js
      - name: Authoritative nobility mechanics
        run: node scripts/server-nobility-audit.js
      - name: Environment and visual contracts
        run: |
          node --check src/environment/rural-nature-atlas.js
          node --check src/environment/tile-registry.js
          node --check src/environment/district-decals-registry.js
          node --check src/environment/world-map.js
          node --check src/environment/district-decals.js
          node --check src/environment/rural-ground.js
          node --check src/environment/rural-landmarks.js
          node --check src/environment/plaza-nature.js
          node --check src/environment/plaza-depth.js
          node --check src/environment/luxe-compose.js
          node --check src/environment/luxe-kiosk-atlas.js
          node --check scripts/live-world-audit.mjs
          node --check scripts/live-rural-audit.mjs
          node --check scripts/live-district-decals-audit.mjs
          node --check scripts/live-pavilion-audit.mjs
          node --check scripts/live-fountain-audit.mjs
          node --check scripts/live-npc-audit.mjs
          node --check src/ui/luxe-shell.js
          node --check src/ui/luxe-boutique.js
          node --check engine-a.js
          node --check engine-h.js
          node --check engine-p.js
          grep -q 'id="toast-container"' index.html
          grep -q "nobility-v1.1" src/systems/nobility.js
          grep -q "KC_TO_DONATION = 50000" src/systems/nobility.js
          grep -q "minDonation: 30000000" src/systems/nobility.js
          grep -q "minDonation: 100000000" src/systems/nobility.js
          grep -q "minDonation: 200000000" src/systems/nobility.js
          grep -q "top: 50" src/systems/nobility.js
          grep -q "top: 15" src/systems/nobility.js
          grep -q "top: 3" src/systems/nobility.js
          grep -q "server-nobility-v1" server/nobility-store.js
          grep -q "supabase-authoritative" server/nobility-store.js
          grep -q "nobility_donate" supabase/migrations/20260903_nobility.sql
          grep -q "combat:resolve" server/index.js
          grep -q "nobility:donate" server/index.js
          grep -q "nobility-authority-v1" src/systems/nobility-authority.js
          grep -q "nobility-combat-v1" src/systems/nobility-combat.js
          grep -q "rural-edge-v1" src/environment/rural-landmarks.js
          grep -q "authored-low-profile-edge-clusters-v1" src/environment/rural-landmarks.js
          grep -q "centerClear:true" src/environment/rural-landmarks.js
          grep -q "northRoadClear:true" src/environment/rural-landmarks.js
          grep -q "registryVersion:'1.11.1'" src/environment/district-decals-registry.js
          grep -q "cameraBridge:window.camera===camera" src/environment/district-decals-registry.js
          grep -q "authored-placement-layer-v1" src/environment/district-decals-registry.js
          grep -q "placementCount:placements.length" src/environment/district-decals.js
          grep -q "kelo-luxe-v3-style" src/ui/luxe-shell.js
          grep -q -- "--lx-forest:#173f36" src/ui/luxe-shell.js
          grep -q "mode:'luxe-only-v1'" src/environment/luxe-kiosk-atlas.js
          grep -q "grassVariation:grassVariationAtlas" src/environment/tile-registry.js
          grep -q "plazaGround:plazaGroundAtlas" src/environment/tile-registry.js
          grep -q "plazaNature:plazaNatureAtlas" src/environment/tile-registry.js
          grep -q "plazaNpcs:plazaNpcsAtlas" src/environment/tile-registry.js
          grep -q "registry-authored-npc-visual-v1" src/environment/tile-registry.js
          grep -q "proximity-name-v1" src/environment/tile-registry.js
          grep -q "grassMode:'authored-eight-variant-atlas-v1'" src/environment/tile-registry.js
          grep -q "grassVariationMode:'authored-eight-variant-atlas-v1'" src/environment/world-map.js
          grep -q "plaza-fountain-v1.6" src/environment/plaza-depth.js
          grep -q "authored-png-layer-pair-v1" src/environment/plaza-depth.js
          grep -q "scaled-centered-lower-rim-v1" src/environment/plaza-depth.js
          grep -q "frontScale:0.74" src/environment/plaza-depth.js
          grep -q "final-composite-back-actor-front-v2" src/environment/plaza-depth.js
          grep -q "plaza-fountain-back.PNG" src/environment/plaza-depth.js
          grep -q "plaza-fountain-front.PNG" src/environment/plaza-depth.js
          if ! grep -q 'DISABLED_PROCEDURAL_ART' src/environment/luxe-compose.js; then
            echo 'rejected procedural plaza overlay was reactivated'
            exit 1
          fi
          if grep -Eq "assets/plaza\.jpg|assets/plaza-sm\.jpg|'plaza\.jpg'" engine-h.js; then
            echo 'legacy missing plaza JPG request detected'
            exit 1
          fi
          if grep -q "assets/hero\.png" engine-ab.js; then
            echo 'missing lowercase hero fallback detected'
            exit 1
          fi
          python3 - <<'PY'
          import base64, re, struct, xml.etree.ElementTree as ET
          for path,expected in [('assets/rural-soil-v1.png',(128,128)),('assets/rural-props-v1.png',(128,128)),('assets/rural-landmarks-v1.png',(256,128)),('assets/grass-variation-v1.png',(128,64)),('assets/plaza-fountain-back.PNG',(1254,1254)),('assets/plaza-fountain-front.PNG',(1254,1254))]:
              header=open(path,'rb').read(26)
              assert header[:8] == b'\x89PNG\r\n\x1a\n'
              size=struct.unpack('>II',header[16:24])
              assert size==expected,(path,size,expected)
              if 'plaza-fountain-' in path:
                  assert header[25] in (4,6),(path,'fountain PNG must contain alpha',header[25])
              print('PASS PNG',path,*size)
          path='assets/plaza-npcs-v1.svg'; root=ET.parse(path).getroot()
          assert root.attrib.get('width')=='288' and root.attrib.get('height')=='96',(path,root.attrib)
          assert root.attrib.get('viewBox')=='0 0 288 96',(path,root.attrib)
          path='assets/district-decals-v1.svg'; root=ET.parse(path).getroot()
          assert root.attrib.get('width')=='256' and root.attrib.get('height')=='32',(path,root.attrib)
          assert root.attrib.get('viewBox')=='0 0 256 32',(path,root.attrib)
          source=open('src/environment/rural-nature-atlas.js',encoding='utf-8').read()
          match=re.search(r"data:image/png;base64,([^']+)",source)
          assert match
          raw=base64.b64decode(match.group(1)); assert raw[:8]==b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II',raw[16:24])==(256,128)
          header=open('assets/plaza-ground-v1.png','rb').read(26)
          assert header[:8] == b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II',header[16:24])==(800,560)
          assert header[25] in (4,6),('plaza ground must contain an alpha channel',header[25])
          print('PASS authored plaza ground assets/plaza-ground-v1.png 800 560 alpha')
          PY
      - name: Append validated visual memory once
        if: github.event_name == 'push'
        run: |
          if grep -q "## Validated Gardens Connected Junction — 2026-09-03 / Compositions v14" docs/VISUAL_DIRECTION_MEMORY.md; then
            echo "Memory already present; no append needed."
            exit 0
          fi
          cat >> docs/VISUAL_DIRECTION_MEMORY.md <<'EOF'

## Validated Gardens Connected Junction — 2026-09-03 / Compositions v14
- Research reinforcement: current modular 32px top-down packs such as Wardmarch emphasize complete corner/autotile families plus explicit anchors/metadata, while Emberfen ships reproducible seam/arrangement validation. Combined with Kelo's Pixadom density/readability benchmark, the useful rule is to prefer connected modular boundary grammar plus deterministic visual gates over adding isolated decoration.
- The first candidate junction was rejected before acceptance: moving the northwest/west hedge run upward would have placed cells on the existing road mask. The declared→renderable validator was treated as a design constraint, not merely a post-hoc test.
- `gardens-compositions-v14` introduces `junctionMode='connected-southeast-l-boundary-v1'` by relocating the existing four-cell southeast horizontal hedge run to local cells [18..21,17], where it joins the existing corner [22,17] and east-lower vertical run [22,14..16].
- No decorative density was added: the composition remains 11 modular runs + 10 fixed placements / 41 declared cells. Gardens placement CI run `33832860011` passed with zero road/landmark placement conflicts or duplicates.
- Runtime/test head certified: `661c28f02c4d84c74761a6614232d077e756bb65`. Kelo CI run `33833142006`, Pages run `33833140832`, and Gardens LIVE run `33833141980` all succeeded. Forge CI run `33833092702` also returned green after correcting its stale Equipment v1.0 assertion to the already-validated Equipment v1.1.0; no Forge or Equipment runtime code changed.
- LIVE mobile evidence at 390x844 CSS / 780x1688 backing canvas shows the southeast boundary as a continuous horizontal → corner → vertical L while preserving hero readability, fountain prominence and road clearance. Report: `green=946787`, `ivory=290673`, `cyan=15072`, `consoleErrors=[]`, `failedRequests=[]`, `httpErrors=[]`.
- Two stale gates were corrected during validation: Forge CI expected `equipment-v1.0`; Gardens LIVE workflow still grepped composition v13. Both were updated to current validated contracts before final acceptance.
- Next visual bottleneck: one real L materially improves boundary grammar, but Gardens still lacks T-junctions / branch endings that can articulate small enclosed beds and path-adjacent framing. The next safe pass should add one authored T/branch composition using existing or minimally extended join-atlas tiles, with the same 41-cell pressure or another deliberately held density budget and mandatory placement/LIVE gates.
EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/VISUAL_DIRECTION_MEMORY.md
          git commit -m "docs(visual): record connected gardens junction"
          git push
