name: World Builder Contract Fix Once
on:
  push:
    branches: [ feature/world-builder-admin-v1 ]
    paths:
      - '.github/workflows/world-builder-contract-fix-once.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point tree asset contract at the canonical PNG
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/environment/art-asset-manifest.json')
          data=json.loads(p.read_text())
          matches=[a for a in data['assets'] if a.get('id')=='arboleskelo1-atlas-v1']
          if len(matches)!=1:
              raise SystemExit(f'expected one arboleskelo1 asset, got {len(matches)}')
          asset=matches[0]
          asset['path']='assets/Arboleskelo1.PNG'
          asset['frames']['metadata']='assets/Arboleskelo1.atlas.json'
          p.write_text(json.dumps(data,separators=(',',':'))+'\n')
          PY
      - name: Commit reconciled contract and remove patcher
        run: |
          rm -f .github/workflows/world-builder-contract-fix-once.yml
          git config user.name kelo-world-builder-bot
          git config user.email 68343904+kelffren@users.noreply.github.com
          git add src/environment/art-asset-manifest.json .github/workflows/world-builder-contract-fix-once.yml
          git commit -m 'Align Arboleskelo1 asset manifest with real PNG'
          git push
