name: Implement Studio Pinch Scale

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/implement-studio-pinch-scale.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch intuitive mobile scaling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); text=p.read_text()
              found=text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {found}: {old[:160]!r}')
              p.write_text(text.replace(old,new,count))

          # Camera: preserve normal two-finger camera zoom, but delegate a pinch that begins
          # on a selected Studio entity to the authoring controller.
          replace('src/studio/input/studio-camera-controller.mjs',
            "export function createStudioCameraController({root=globalThis,onNavigateStart=()=>{},isUi=()=>false}={}){",
            "export function createStudioCameraController({root=globalThis,onNavigateStart=()=>{},isUi=()=>false,onPinchStart=()=>false,onPinchMove=()=>{},onPinchEnd=()=>{}}={}){")
          replace('src/studio/input/studio-camera-controller.mjs',
            "      if(pointers.size===2){onNavigateStart();touchPan=null;for(const id of pointers.keys())navTouchIds.add(id);const [a,b]=[...pointers.values()],cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;pinch={cx,cy,d:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)),zoom};consume(e);}return;",
            "      if(pointers.size===2){touchPan=null;for(const id of pointers.keys())navTouchIds.add(id);const [a,b]=[...pointers.values()],cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,d=Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)),world=toWorld(cx,cy),delegated=!!onPinchStart({clientX:cx,clientY:cy,worldX:world.x,worldY:world.y,distance:d});if(delegated){pinch={mode:'delegate',cx,cy,d,zoom};consume(e);return;}onNavigateStart();pinch={mode:'camera',cx,cy,d,zoom};consume(e);}return;")
          replace('src/studio/input/studio-camera-controller.mjs',
            "      if(pointers.size>=2&&pinch){for(const id of pointers.keys())navTouchIds.add(id);const [a,b]=[...pointers.values()].slice(0,2),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,d=Math.max(1,Math.hypot(a.x-b.x,a.y-b.y));panScreen(cx-pinch.cx,cy-pinch.cy);setZoom(pinch.zoom*(d/pinch.d),{anchorX:cx,anchorY:cy});pinch={...pinch,cx,cy};consume(e);}",
            "      if(pointers.size>=2&&pinch){for(const id of pointers.keys())navTouchIds.add(id);const [a,b]=[...pointers.values()].slice(0,2),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,d=Math.max(1,Math.hypot(a.x-b.x,a.y-b.y));if(pinch.mode==='delegate'){const world=toWorld(cx,cy);onPinchMove({clientX:cx,clientY:cy,worldX:world.x,worldY:world.y,distance:d,ratio:d/pinch.d});consume(e);}else{panScreen(cx-pinch.cx,cy-pinch.cy);setZoom(pinch.zoom*(d/pinch.d),{anchorX:cx,anchorY:cy});pinch={...pinch,cx,cy};consume(e);}}")
          replace('src/studio/input/studio-camera-controller.mjs',
            "    if(e.pointerType==='touch'){const wasNav=navTouchIds.has(e.pointerId);pointers.delete(e.pointerId);if(touchPan&&touchPan.id===e.pointerId)touchPan=null;if(pointers.size<2)pinch=null;if(wasNav){navTouchIds.delete(e.pointerId);consume(e);}if(!pointers.size)navTouchIds.clear();return;}",
            "    if(e.pointerType==='touch'){const wasNav=navTouchIds.has(e.pointerId),endingPinch=pinch;pointers.delete(e.pointerId);if(touchPan&&touchPan.id===e.pointerId)touchPan=null;if(pointers.size<2){if(endingPinch?.mode==='delegate')onPinchEnd({cancelled:e.type==='pointercancel'});pinch=null;}if(wasNav){navTouchIds.delete(e.pointerId);consume(e);}if(!pointers.size)navTouchIds.clear();return;}")

          # Authority mirror: transient preview is deliberately outside History. The final
          # gesture commit still goes through the normal Studio command boundary once.
          replace('src/studio/integration/authority-command-mirror.mjs',
            "  return Object.freeze({\n    uninstall,",
            "  return Object.freeze({\n    uninstall,\n    previewScale: (entityId,value) => scalePlacement({id:String(entityId)},value),")

          # Live controller: local + authority preview while fingers move; one History command
          # when fingers lift. Pinch only steals camera zoom when its centroid is on the selected object.
          replace('src/studio/integration/live-studio-controller.mjs',
            "  let inputLockToken=null,overlay=null,shell=null,productivity=null,cameraController=null,unregisterInput=null,detachPointer=null,selectionUnsub=null,frame=0,running=true,playing=false,mode='select',dragEntity=null,onKey=null;",
            "  let inputLockToken=null,overlay=null,shell=null,productivity=null,cameraController=null,unregisterInput=null,detachPointer=null,selectionUnsub=null,frame=0,running=true,playing=false,mode='select',dragEntity=null,onKey=null,pinchScale=null,pinchPreviewFrame=0,pinchPreviewPending=null,pinchPreviewChain=Promise.resolve();")
          replace('src/studio/integration/live-studio-controller.mjs',
            "    function selectionRect(){const rows=studio.kernel.selection.get().map(id=>studio.kernel.spatial.get(id)?.rect).filter(Boolean);if(!rows.length)return null;const x=Math.min(...rows.map(r=>r.x)),y=Math.min(...rows.map(r=>r.y)),x2=Math.max(...rows.map(r=>r.x+r.w)),y2=Math.max(...rows.map(r=>r.y+r.h));return{x,y,w:x2-x,h:y2-y};}\n    function focusSelection()",
            "    function selectionRect(){const rows=studio.kernel.selection.get().map(id=>studio.kernel.spatial.get(id)?.rect).filter(Boolean);if(!rows.length)return null;const x=Math.min(...rows.map(r=>r.x)),y=Math.min(...rows.map(r=>r.y)),x2=Math.max(...rows.map(r=>r.x+r.w)),y2=Math.max(...rows.map(r=>r.y+r.h));return{x,y,w:x2-x,h:y2-y};}\n    const clampScale=v=>{const n=Number(v);return Math.max(.1,Math.min(8,Number.isFinite(n)?Math.round(n*100)/100:1));};\n    function pinchEntityAt(worldX,worldY){if(playing||studio.kernel.selection.get().length!==1)return null;const id=studio.kernel.selection.get()[0],row=studio.kernel.spatial.get(id);if(!row?.rect)return null;const pad=22/Math.max(.25,cameraController?.effectiveZoom||1),r=row.rect;if(worldX<r.x-pad||worldX>r.x+r.w+pad||worldY<r.y-pad||worldY>r.y+r.h+pad)return null;return studio.kernel.document.entities.find(e=>String(e.id)===String(id))||null;}\n    function previewLocalScale(entity,value){const scale=clampScale(value);entity.transform={...(entity.transform||{}),scale};const x=Number(entity.transform?.x)||0,y=Number(entity.transform?.y)||0,w=Math.max(1,(Number(entity.bounds?.w)||1)*scale),h=Math.max(1,(Number(entity.bounds?.h)||1)*scale);studio.kernel.spatial.upsert({id:entity.id,category:'entity',rect:{x,y,w,h},data:entity});shell?.setScaleGesture?.(scale,{active:!!pinchScale});return scale;}\n    function queuePinchPreview(id,scale){pinchPreviewPending={id,scale};if(pinchPreviewFrame)return;const run=()=>{pinchPreviewFrame=0;const next=pinchPreviewPending;pinchPreviewPending=null;if(!next)return;pinchPreviewChain=pinchPreviewChain.catch(()=>{}).then(()=>mirror.previewScale(next.id,next.scale)).catch(e=>console.warn('[Kelo Studio] pinch preview',e));};pinchPreviewFrame=root.requestAnimationFrame?.(run)||setTimeout(run,16);}\n    function cancelPinchPreviewFrame(){if(!pinchPreviewFrame)return;if(typeof root.cancelAnimationFrame==='function')root.cancelAnimationFrame(pinchPreviewFrame);else clearTimeout(pinchPreviewFrame);pinchPreviewFrame=0;}\n    async function flushPinchPreview(){cancelPinchPreviewFrame();const next=pinchPreviewPending;pinchPreviewPending=null;if(next)pinchPreviewChain=pinchPreviewChain.catch(()=>{}).then(()=>mirror.previewScale(next.id,next.scale));try{await pinchPreviewChain;}catch{}}\n    function beginPinchScale({worldX,worldY}={}){const entity=pinchEntityAt(worldX,worldY);if(!entity)return false;dragEntity=null;studio.tools.transform.cancel();studio.tools.marquee.cancel();const baseScale=clampScale(entity.transform?.scale);pinchScale={id:String(entity.id),baseScale,currentScale:baseScale};shell?.setScaleGesture?.(baseScale,{active:true});return true;}\n    function movePinchScale({ratio=1}={}){if(!pinchScale)return;const entity=studio.kernel.document.entities.find(e=>String(e.id)===pinchScale.id);if(!entity)return;const next=clampScale(pinchScale.baseScale*(Number(ratio)||1));if(next===pinchScale.currentScale)return;pinchScale.currentScale=next;previewLocalScale(entity,next);queuePinchPreview(entity.id,next);}\n    async function endPinchScale({cancelled=false}={}){const gesture=pinchScale;if(!gesture)return null;pinchScale=null;await flushPinchPreview();const entity=studio.kernel.document.entities.find(e=>String(e.id)===gesture.id);if(!entity)return null;const finalScale=gesture.currentScale;previewLocalScale(entity,gesture.baseScale);if(cancelled||Math.abs(finalScale-gesture.baseScale)<.005){await mirror.previewScale(gesture.id,gesture.baseScale);shell?.setScaleGesture?.(gesture.baseScale,{active:false});updateShell();return entity;}await creator.scaleSelection({value:finalScale});shell?.setScaleGesture?.(finalScale,{active:false});updateShell();return entity;}\n    function focusSelection()")
          replace('src/studio/integration/live-studio-controller.mjs',
            "    cameraController=createStudioCameraController({root,isUi:isStudioUi,onNavigateStart:cancelForCamera});",
            "    cameraController=createStudioCameraController({root,isUi:isStudioUi,onNavigateStart:cancelForCamera,onPinchStart:beginPinchScale,onPinchMove:movePinchScale,onPinchEnd:payload=>{void guarded(()=>endPinchScale(payload));}});")
          replace('src/studio/integration/live-studio-controller.mjs',
            "onScale:action=>guarded(()=>creator.scaleSelection(action==='reset'?{value:1}:{delta:action==='down'?-.25:.25}))",
            "onScale:action=>guarded(()=>creator.scaleSelection(action==='reset'?{value:1}:{delta:action==='down'?-.1:.1}))")
          replace('src/studio/integration/live-studio-controller.mjs',
            "Object.defineProperty(liveSession,'__cleanup',{value:async()=>{running=false;if(typeof root.cancelAnimationFrame==='function')root.cancelAnimationFrame(frame);else clearTimeout(frame);if(onKey)",
            "Object.defineProperty(liveSession,'__cleanup',{value:async()=>{running=false;if(pinchScale){try{await endPinchScale({cancelled:true});}catch{}}cancelPinchPreviewFrame();if(typeof root.cancelAnimationFrame==='function')root.cancelAnimationFrame(frame);else clearTimeout(frame);if(onKey)")

          # Mobile shell: always-visible floating scale HUD for a single selected object.
          replace('src/studio/ui/studio-live-shell.mjs',
            "const SHELL_VERSION='studio-live-shell-v1.6.0';",
            "const SHELL_VERSION='studio-live-shell-v1.7.0';")
          replace('src/studio/ui/studio-live-shell.mjs',
            "  .ks-compact-copy strong{display:block;color:#fff1b8;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}\n",
            "  .ks-compact-copy strong{display:block;color:#fff1b8;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}\n  .ks-scale-hud{position:absolute;left:50%;bottom:max(76px,calc(env(safe-area-inset-bottom) + 70px));transform:translateX(-50%);display:none;align-items:center;gap:5px;padding:5px 6px;border:1px solid rgba(231,197,106,.58);border-radius:14px;background:rgba(5,14,16,.97);box-shadow:0 12px 34px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05);pointer-events:auto;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:3}\n  .ks-scale-hud.on{display:flex}.ks-scale-hud.gesture{border-color:#f4dd8d;box-shadow:0 0 0 2px rgba(231,197,106,.12),0 12px 34px rgba(0,0,0,.55)}\n  .ks-scale-hud small{font-size:5.5px;line-height:1.15;font-weight:950;letter-spacing:.1em;color:#8fa89f;text-align:center}.ks-scale-hud small span{color:#e7c56a}\n  .ks-scale-hud button{width:42px;height:40px;padding:0;border:1px solid rgba(231,197,106,.3);border-radius:11px;background:#102022;color:#fff0b2;font-size:21px;font-weight:850;line-height:1}\n  .ks-scale-hud .ks-scale-reset{font-size:15px}.ks-scale-value{min-width:58px;text-align:center;color:#fff2bc;font-size:13px;font-weight:950;font-variant-numeric:tabular-nums}\n")
          replace('src/studio/ui/studio-live-shell.mjs',
            "    <div class=\"ks-bottom\">",
            "    <div class=\"ks-scale-hud\" aria-label=\"Escala del objeto seleccionado\">\n      <small>ESCALA<br><span>2 DEDOS</span></small>\n      <button data-act=\"scale-down\" aria-label=\"Reducir objeto\">−</button>\n      <strong class=\"ks-scale-value\">100%</strong>\n      <button data-act=\"scale-up\" aria-label=\"Agrandar objeto\">＋</button>\n      <button class=\"ks-scale-reset\" data-act=\"scale-reset\" aria-label=\"Restablecer escala a 100%\">↺</button>\n    </div>\n\n    <div class=\"ks-bottom\">")
          replace('src/studio/ui/studio-live-shell.mjs',
            "  const selectionBadge=root.querySelector('.ks-selection-badge');",
            "  const selectionBadge=root.querySelector('.ks-selection-badge');\n  const scaleHud=root.querySelector('.ks-scale-hud');\n  const scaleValue=root.querySelector('.ks-scale-value');")
          replace('src/studio/ui/studio-live-shell.mjs',
            "  function syncContextActions(){\n    const hasSelection=selection.length>0;",
            "  function syncScaleHud({forcedScale=null,active=false}={}){const entity=selection.length===1?entities.find(e=>String(e.id)===String(selection[0])):null,scale=forcedScale==null?Math.max(.1,Math.min(8,Number(entity?.transform?.scale)||1)):Math.max(.1,Math.min(8,Number(forcedScale)||1)),show=!!entity&&isMobile()&&root.dataset.sheetOpen!=='1';if(scaleValue)scaleValue.textContent=`${Math.round(scale*100)}%`;scaleHud?.classList.toggle('on',show);scaleHud?.classList.toggle('gesture',show&&!!active);}\n\n  function syncContextActions(){\n    const hasSelection=selection.length>0;")
          replace('src/studio/ui/studio-live-shell.mjs',
            "    root.querySelectorAll('[data-act=\"scale-down\"],[data-act=\"scale-reset\"],[data-act=\"scale-up\"]').forEach(button=>{button.disabled=!hasSelection;});\n  }",
            "    root.querySelectorAll('[data-act=\"scale-down\"],[data-act=\"scale-reset\"],[data-act=\"scale-up\"]').forEach(button=>{button.disabled=!hasSelection;});\n    syncScaleHud();\n  }")
          replace('src/studio/ui/studio-live-shell.mjs',
            "    if(compact){root.dataset.sheetOpen='0';document.activeElement?.blur?.();}\n    return compact;",
            "    if(compact){root.dataset.sheetOpen='0';document.activeElement?.blur?.();}\n    syncScaleHud();\n    return compact;")
          replace('src/studio/ui/studio-live-shell.mjs',
            "    root.dataset.sheetOpen='1';\n    const tab=root.querySelector('[data-tab=\"assets\"]');",
            "    root.dataset.sheetOpen='1';\n    syncScaleHud();\n    const tab=root.querySelector('[data-tab=\"assets\"]');")
          replace('src/studio/ui/studio-live-shell.mjs',
            "      root.dataset.sheetOpen='1';\n      root.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b===tab));",
            "      root.dataset.sheetOpen='1';\n      syncScaleHud();\n      root.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b===tab));")
          replace('src/studio/ui/studio-live-shell.mjs',
            "    setActiveTool:setToolLabel,",
            "    setActiveTool:setToolLabel,\n    setScaleGesture(scale,{active=false}={}){syncScaleHud({forcedScale:scale,active});},")

          # Audit the new UX contract and delegated gesture path.
          replace('scripts/studio-creator-v1-audit.mjs',
            "const shell=await readFile(new URL('../src/studio/ui/studio-live-shell.mjs',import.meta.url),'utf8');assert.match(shell,/ASSETS · VISUAL/);",
            "const shell=await readFile(new URL('../src/studio/ui/studio-live-shell.mjs',import.meta.url),'utf8');assert.match(shell,/ASSETS · VISUAL/);assert.match(shell,/ks-scale-hud/);assert.match(shell,/2 DEDOS/);")
          replace('scripts/studio-creator-v1-audit.mjs',
            "const controller=await readFile(new URL('../src/studio/integration/live-studio-controller.mjs',import.meta.url),'utf8');assert.match(controller,/createStudioCameraController/);",
            "const controller=await readFile(new URL('../src/studio/integration/live-studio-controller.mjs',import.meta.url),'utf8');assert.match(controller,/createStudioCameraController/);assert.match(controller,/onPinchStart:beginPinchScale/);assert.match(controller,/previewScale/);")
          replace('scripts/studio-creator-v1-audit.mjs',
            "mirror.uninstall();await store.close();",
            "const cameraSource=await readFile(new URL('../src/studio/input/studio-camera-controller.mjs',import.meta.url),'utf8');assert.match(cameraSource,/onPinchStart/);assert.match(cameraSource,/mode:'delegate'/);const beforePreviewDocScale=Number(kernel.document.entities.find(e=>e.id===a.id).transform?.scale||1);await mirror.previewScale(a.id,1.2);assert.equal(calls.at(-1).op,'world:placement:scale');assert.equal(Number(kernel.document.entities.find(e=>e.id===a.id).transform?.scale||1),beforePreviewDocScale,'authority preview must not mutate Studio History document');await mirror.previewScale(a.id,beforePreviewDocScale);\nmirror.uninstall();await store.close();")
          replace('scripts/studio-creator-v1-audit.mjs',
            "rotationAuthoritySafe:true,scale:true,copyPaste:true",
            "rotationAuthoritySafe:true,scale:true,pinchScale:true,visibleScaleHud:true,copyPaste:true")
          PY

      - name: Validate Studio scale UX
        shell: bash
        run: |
          node --check src/studio/input/studio-camera-controller.mjs
          node --check src/studio/integration/authority-command-mirror.mjs
          node --check src/studio/integration/live-studio-controller.mjs
          node --check src/studio/ui/studio-live-shell.mjs
          node scripts/studio-creator-v1-audit.mjs
          node scripts/property-editor-audit.js

      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes produced'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/studio/input/studio-camera-controller.mjs src/studio/integration/authority-command-mirror.mjs src/studio/integration/live-studio-controller.mjs src/studio/ui/studio-live-shell.mjs scripts/studio-creator-v1-audit.mjs
          git commit -m 'feat: add intuitive pinch scaling to Kelo Studio'
          git push origin HEAD:main
