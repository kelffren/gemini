name: Sprite Tactile Editor CI
on:
  push:
    branches: [main, feature/sprite-tactile-editor-v1]
    paths:
      - 'src/creators/avatar/avatar-frame-*.mjs'
      - 'src/creators/ui/avatar-frame-*.mjs'
      - 'src/creators/workspaces/avatar-workspace.mjs'
      - 'src/creators/sprite-compiler/**'
      - 'src/creators/avatar/kelo-universal-asset-compiler.mjs'
      - 'scripts/sprite-tactile-editor-audit.mjs'
      - 'package.json'
      - '.github/workflows/sprite-tactile-editor-ci.yml'
  pull_request:
    paths:
      - 'src/creators/avatar/avatar-frame-*.mjs'
      - 'src/creators/ui/avatar-frame-*.mjs'
      - 'src/creators/workspaces/avatar-workspace.mjs'
      - 'src/creators/sprite-compiler/**'
      - 'src/creators/avatar/kelo-universal-asset-compiler.mjs'
      - 'scripts/sprite-tactile-editor-audit.mjs'
      - 'package.json'
  workflow_dispatch:

jobs:
  contract-audits:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax check new modules
        run: |
          node --check src/creators/avatar/avatar-frame-project.mjs
          node --check src/creators/avatar/avatar-frame-project-store.mjs
          node --check src/creators/avatar/avatar-frame-pixels.mjs
          node --check src/creators/avatar/avatar-frame-compositor.mjs
          node --check src/creators/ui/avatar-frame-editor.mjs
          node --check src/creators/ui/avatar-frame-builder.mjs
          node --check src/creators/ui/avatar-frame-builder-hook.mjs
      - name: Tactile editor audit
        run: npm run audit:sprite-tactile
      - name: Existing Avatar Quick audit
        run: npm run audit:avatar-quick
      - name: Existing sprite compiler audit
        run: npm run audit:sprite-compiler
      - name: Existing sprite grid audit
        run: npm run audit:sprite-compiler-grid
      - name: Existing Frame Doctor audit
        run: npm run audit:sprite-frame-doctor
      - name: Existing ingestion audit
        run: npm run audit:sprite-ingestion
