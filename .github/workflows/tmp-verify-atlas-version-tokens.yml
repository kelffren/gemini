name: TEMP Verify Atlas Version Tokens

on:
  push:
    branches:
      - fix/atlas-version-tokens-current-main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium --with-deps
      - name: Serve
        shell: bash
        run: |
          mkdir -p test-results
          python3 -m http.server 4173 --bind 127.0.0.1 >test-results/http.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat test-results/http.log
          exit 1
      - name: Verify atlas cache tokens
        env:
          KELO_PAGES: http://127.0.0.1:4173/
        run: npx playwright test tests/tmp-atlas-version-token.spec.js --project=chromium --workers=1 --retries=0 --reporter=list
