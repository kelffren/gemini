name: Integrate imperial plaza assets

on:
  push:
    paths:
      - '.github/workflows/integrate-imperial-plaza-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Rename assets and repair transparency
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from collections import deque
          import shutil
          from PIL import Image

          root = Path('.')
          target_dir = root / 'assets' / 'world' / 'imperial-plaza'
          target_dir.mkdir(parents=True, exist_ok=True)

          assets = [
              ('assets/461588171420118.png', 'fuente-de-la-justicia.png', False),
              ('assets/6c541509-a9b5-5045-ae88-65f9781ad378.png', 'rosa-de-los-vientos.png', False),
              ('assets/0ec46354-2860-5612-b415-bbebfce85e4f.png', 'plataforma-ceremonial.png', True),
              ('assets/2a3a286d8af2116d865d50a434b4acef.png', 'jardinera-imperial-curva.png', True),
              ('assets/08e43293-3dbb-54cb-9d49-f3cc69270475.png', 'estandarte-imperial.png', False),
              ('assets/0a136956-22c6-5642-8c9b-d07d80bc3aeb.png', 'fuente-de-los-leones.png', False),
              ('assets/045f2266-27fe-5e9f-be84-b52b9351a222.png', 'podio-imperial.png', False),
              ('assets/0545fa69-2887-5936-9cc5-c3801a9357b6.png', 'kiosco-imperial.png', True),
              ('assets/011d93ed-f524-59db-8b77-60c7dd6e5751.png', 'obelisco-imperial.png', False),
              ('assets/03b2d8aa-56ef-5382-b29f-f75a42bdd3d0.png', 'escalinata-imperial.png', False),
              ('assets/02a73d1d-03c4-515b-969d-3b26b03a0894.png', 'farola-imperial.png', False),
              ('assets/010ce07d-8d90-5874-8cd9-1734f7e10d19.png', 'topiario-imperial.png', False),
          ]

          def remove_border_black(src: Path, dst: Path):
              im = Image.open(src).convert('RGBA')
              px = im.load()
              w, h = im.size
              seen = bytearray(w * h)
              q = deque()

              def dark(x, y):
                  r, g, b, _ = px[x, y]
                  return max(r, g, b) <= 52 and (max(r, g, b) - min(r, g, b)) <= 18

              def enqueue(x, y):
                  idx = y * w + x
                  if not seen[idx] and dark(x, y):
                      seen[idx] = 1
                      q.append((x, y))

              for x in range(w):
                  enqueue(x, 0); enqueue(x, h - 1)
              for y in range(h):
                  enqueue(0, y); enqueue(w - 1, y)

              removed = 0
              while q:
                  x, y = q.popleft()
                  r, g, b, _ = px[x, y]
                  px[x, y] = (r, g, b, 0)
                  removed += 1
                  if x: enqueue(x - 1, y)
                  if x + 1 < w: enqueue(x + 1, y)
                  if y: enqueue(x, y - 1)
                  if y + 1 < h: enqueue(x, y + 1)

              if removed == 0:
                  raise RuntimeError(f'No border background removed from {src}')
              dst.parent.mkdir(parents=True, exist_ok=True)
              im.save(dst, optimize=True)
              return removed

          migrated = []
          for src_name, dst_name, repair in assets:
              src = root / src_name
              dst = target_dir / dst_name
              if not src.exists():
                  if dst.exists():
                      migrated.append(dst)
                      continue
                  raise FileNotFoundError(src)
              if repair:
                  removed = remove_border_black(src, dst)
                  print(f'{src} -> {dst}: repaired alpha on {removed} connected background pixels')
              else:
                  shutil.copy2(src, dst)
                  print(f'{src} -> {dst}')
              src.unlink()
              migrated.append(dst)

          repaired_names = {'plataforma-ceremonial.png','jardinera-imperial-curva.png','kiosco-imperial.png'}
          if len(migrated) != 12:
              raise RuntimeError(f'Expected 12 migrated assets, got {len(migrated)}')
          for path in migrated:
              with Image.open(path) as im:
                  rgba = im.convert('RGBA')
                  alpha_range = rgba.getchannel('A').getextrema()
                  if path.name in repaired_names and alpha_range != (0, 255):
                      raise RuntimeError(f'Expected real transparency in {path}, got {alpha_range}')
                  print(f'validated {path}: {rgba.size[0]}x{rgba.size[1]} alpha={alpha_range}')
          PY

      - name: Verify migration
        shell: bash
        run: |
          for old in \
            assets/461588171420118.png \
            assets/6c541509-a9b5-5045-ae88-65f9781ad378.png \
            assets/0ec46354-2860-5612-b415-bbebfce85e4f.png \
            assets/2a3a286d8af2116d865d50a434b4acef.png \
            assets/08e43293-3dbb-54cb-9d49-f3cc69270475.png \
            assets/0a136956-22c6-5642-8c9b-d07d80bc3aeb.png \
            assets/045f2266-27fe-5e9f-be84-b52b9351a222.png \
            assets/0545fa69-2887-5936-9cc5-c3801a9357b6.png \
            assets/011d93ed-f524-59db-8b77-60c7dd6e5751.png \
            assets/03b2d8aa-56ef-5382-b29f-f75a42bdd3d0.png \
            assets/02a73d1d-03c4-515b-969d-3b26b03a0894.png \
            assets/010ce07d-8d90-5874-8cd9-1734f7e10d19.png; do
            test ! -e "$old"
          done
          test "$(find assets/world/imperial-plaza -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 12

      - name: Commit migrated assets
        shell: bash
        run: |
          if git diff --quiet -- assets; then
            echo 'Assets already migrated; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets
          git commit -m 'assets: integrate imperial plaza kit'
          git pull --rebase origin main
          git push origin HEAD:main
