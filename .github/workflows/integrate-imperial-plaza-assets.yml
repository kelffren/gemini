name: Integrate imperial plaza assets

on:
  push:
    paths:
      - '.github/workflows/integrate-imperial-plaza-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Rename assets and repair transparency
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from collections import deque
          import shutil
          from PIL import Image

          root = Path('.')
          target_dir = root / 'assets' / 'world' / 'imperial-plaza'
          target_dir.mkdir(parents=True, exist_ok=True)

          # Order matches the visual inspection contact sheet used to identify them.
          assets = [
              ('assets/0401F8B5-2FCF-4CC5-B19A-CFF0D738E77A.png', 'fuente-de-la-justicia.png', False),
              ('assets/0FED06CB-E23B-433C-A88D-55DDC3EC7BB5.png', 'rosa-de-los-vientos.png', False),
              ('assets/1C16A3B8-CC59-420C-9B5B-0B483375F842.png', 'plataforma-ceremonial.png', True),
              ('assets/3F064BEE-CC8E-4431-BBF8-3722A05A97C1.png', 'jardinera-imperial-curva.png', True),
              ('assets/4635DA44-88C7-4A27-B567-8DA0F178DAA0.png', 'estandarte-imperial.png', False),
              ('assets/608D7806-71E8-4DEB-97E8-33EE449A7D27.png', 'fuente-de-los-leones.png', False),
              ('assets/930630F4-557E-40C7-A928-8DFD72B843B1.png', 'podio-imperial.png', False),
              ('assets/BA1A549D-6FF5-4170-AD93-E81432793911.png', 'kiosco-imperial.png', True),
              ('assets/CCD7666A-7999-46F5-9884-AA5CB10C4937.png', 'obelisco-imperial.png', False),
              ('assets/E765632E-EFE2-401E-AF87-06BA8FF7E1B0.png', 'escalinata-imperial.png', False),
              ('assets/E9CF5E8F-5983-4C9F-BB2D-BA0D61F9389D.png', 'farola-imperial.png', False),
              ('assets/FE7DE07B-52F2-4C1D-AF7A-486DC5556075.png', 'topiario-imperial.png', False),
          ]

          def remove_border_black(src: Path, dst: Path):
              im = Image.open(src).convert('RGBA')
              px = im.load()
              w, h = im.size
              seen = bytearray(w * h)
              q = deque()

              def dark(x, y):
                  r, g, b, _ = px[x, y]
                  return max(r, g, b) <= 52 and (max(r, g, b) - min(r, g, b)) <= 18

              def enqueue(x, y):
                  idx = y * w + x
                  if not seen[idx] and dark(x, y):
                      seen[idx] = 1
                      q.append((x, y))

              for x in range(w):
                  enqueue(x, 0); enqueue(x, h - 1)
              for y in range(h):
                  enqueue(0, y); enqueue(w - 1, y)

              removed = 0
              while q:
                  x, y = q.popleft()
                  r, g, b, _ = px[x, y]
                  px[x, y] = (r, g, b, 0)
                  removed += 1
                  if x: enqueue(x - 1, y)
                  if x + 1 < w: enqueue(x + 1, y)
                  if y: enqueue(x, y - 1)
                  if y + 1 < h: enqueue(x, y + 1)

              if removed == 0:
                  raise RuntimeError(f'No border background removed from {src}')
              dst.parent.mkdir(parents=True, exist_ok=True)
              im.save(dst, optimize=True)
              return removed

          migrated = []
          for src_name, dst_name, repair in assets:
              src = root / src_name
              dst = target_dir / dst_name
              if not src.exists():
                  if dst.exists():
                      migrated.append(dst)
                      continue
                  raise FileNotFoundError(src)
              if repair:
                  removed = remove_border_black(src, dst)
                  print(f'{src} -> {dst}: repaired alpha on {removed} connected background pixels')
              else:
                  shutil.copy2(src, dst)
                  print(f'{src} -> {dst}')
              src.unlink()
              migrated.append(dst)

          repaired_names = {'plataforma-ceremonial.png','jardinera-imperial-curva.png','kiosco-imperial.png'}
          if len(migrated) != 12:
              raise RuntimeError(f'Expected 12 migrated assets, got {len(migrated)}')
          for path in migrated:
              with Image.open(path) as im:
                  rgba = im.convert('RGBA')
                  alpha_range = rgba.getchannel('A').getextrema()
                  if path.name in repaired_names and alpha_range != (0, 255):
                      raise RuntimeError(f'Expected real transparency in {path}, got {alpha_range}')
                  print(f'validated {path}: {rgba.size[0]}x{rgba.size[1]} alpha={alpha_range}')
          PY

      - name: Verify migration
        shell: bash
        run: |
          for old in \
            assets/0401F8B5-2FCF-4CC5-B19A-CFF0D738E77A.png \
            assets/0FED06CB-E23B-433C-A88D-55DDC3EC7BB5.png \
            assets/1C16A3B8-CC59-420C-9B5B-0B483375F842.png \
            assets/3F064BEE-CC8E-4431-BBF8-3722A05A97C1.png \
            assets/4635DA44-88C7-4A27-B567-8DA0F178DAA0.png \
            assets/608D7806-71E8-4DEB-97E8-33EE449A7D27.png \
            assets/930630F4-557E-40C7-A928-8DFD72B843B1.png \
            assets/BA1A549D-6FF5-4170-AD93-E81432793911.png \
            assets/CCD7666A-7999-46F5-9884-AA5CB10C4937.png \
            assets/E765632E-EFE2-401E-AF87-06BA8FF7E1B0.png \
            assets/E9CF5E8F-5983-4C9F-BB2D-BA0D61F9389D.png \
            assets/FE7DE07B-52F2-4C1D-AF7A-486DC5556075.png; do
            test ! -e "$old"
          done
          test "$(find assets/world/imperial-plaza -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 12

      - name: Commit migrated assets
        shell: bash
        run: |
          if git diff --quiet -- assets; then
            echo 'Assets already migrated; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets
          git commit -m 'assets: integrate imperial plaza kit'
          git pull --rebase origin main
          git push origin HEAD:main
