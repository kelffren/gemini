name: Critical World Editor d71 Real iPhone certification

on:
  push:
    branches:
      - experiment/world-editor-pre-dynamic-imports-d71df2c0-live
    paths:
      - '.github/workflows/critical-world-editor-d71-live.yml'
  workflow_dispatch:

jobs:
  real-iphone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BROWSERSTACK_BUILD_NAME: KELO d71 critical real iPhone ${{ github.sha }}
      BUILD_NUMBER: ${{ github.run_number }}
      KELO_PAGES: http://localhost:8000/gemini/
      PW_LIVE: '1'
    steps:
      - name: Checkout critical experiment
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove runtime is exact d71 snapshot
        shell: bash
        run: |
          set -euo pipefail
          BASE=d71df2c0ad5aa627616858d3c65ef4131eb0f19d
          git cat-file -e "$BASE^{commit}"
          mapfile -t changed < <(git diff --name-only "$BASE" HEAD)
          printf 'Changed from d71:\n%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/critical-world-editor-d71-live.yml'

      - name: Verify BrowserStack credentials
        shell: bash
        run: |
          test -n "$BROWSERSTACK_USERNAME" || (echo 'Missing BROWSERSTACK_USERNAME' && exit 1)
          test -n "$BROWSERSTACK_ACCESS_KEY" || (echo 'Missing BROWSERSTACK_ACCESS_KEY' && exit 1)

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install exact snapshot dependencies
        run: npm install

      - name: Enable BrowserStack Local only in runner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('browserstack.yml')
          s=p.read_text()
          old='browserstackLocal: false'
          if old not in s:
              raise SystemExit('browserstackLocal marker not found')
          p.write_text(s.replace(old,'browserstackLocal: true',1))
          PY
          grep -F 'browserstackLocal: true' browserstack.yml
          echo 'Only runner copy changed; repository snapshot remains d71.'

      - name: Serve exact d71 snapshot under /gemini/
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kelo-d71-live
          ln -s "$GITHUB_WORKSPACE" /tmp/kelo-d71-live/gemini
          python3 -m http.server 8000 --bind 0.0.0.0 --directory /tmp/kelo-d71-live >/tmp/kelo-d71-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/gemini/index.html >/dev/null; then
              echo 'd71 local LIVE endpoint ready'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kelo-d71-http.log
          exit 1

      - name: Real iPhone visible World + placement + reopen
        run: npx browserstack-node-sdk playwright test tests/iphone-world-visible-flow.spec.js --workers=1

      - name: Upload real-iPhone evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-d71-real-iphone-evidence
          if-no-files-found: warn
          path: |
            playwright-report.json
            test-results/
            playwright-report/
