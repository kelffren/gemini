name: World Editor boot-mount regression bisect

on:
  push:
    branches:
      - experiment/world-editor-pre-dynamic-imports-d71df2c0-live
    paths:
      - '.github/workflows/critical-world-editor-d71-live.yml'
  workflow_dispatch:

jobs:
  bisect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install isolated Playwright harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kelo-bisect-harness
          cd /tmp/kelo-bisect-harness
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0

      - name: Create boot and World mount probe
        shell: bash
        run: |
          cat > /tmp/kelo-bisect-harness/probe.mjs <<'NODE'
          import { createRequire } from 'node:module';
          import fs from 'node:fs';
          const require=createRequire(import.meta.url);
          const { chromium }=require('/tmp/kelo-bisect-harness/node_modules/playwright');
          const sha=process.argv[2]||'unknown';
          const resultFile='/tmp/kelo-boot-bisect-results.tsv';
          const log=(status,stage,msg='')=>{
            const clean=String(msg).replace(/[\r\n\t]+/g,' ').slice(0,500);
            fs.appendFileSync(resultFile,`${sha}\t${status}\t${stage}\t${clean}\n`);
            console.log(`[BOOT-BISECT ${sha.slice(0,8)}] ${status} ${stage} ${clean}`);
          };
          let browser;
          let stage='BOOT';
          try{
            browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
            const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true,serviceWorkers:'block'});
            const page=await context.newPage();
            const response=await page.goto(`http://127.0.0.1:8000/gemini/?guest=1&mapEditor=1&bootbisect=${sha}`,{waitUntil:'domcontentloaded',timeout:30000});
            if(!response||response.status()>=400)throw new Error(`HTTP_${response?.status()}`);

            stage='ADMIN_READY';
            await page.waitForFunction(()=>!!(window.KELO_ADMIN_KEYS?.can?.('world.edit')&&window.KeloInputLocks?.acquire),null,{timeout:20000});

            stage='CREATORS';
            await page.evaluate(async()=>{
              if(typeof window.KELO_CREATORS_LAUNCHER?.open==='function'){
                await window.KELO_CREATORS_LAUNCHER.open();
                return;
              }
              const m=await import('./src/creators/ui/creator-hub.mjs');
              await m.openCreatorHub({root:window});
            });
            await page.waitForSelector('#kelo-creators-hub',{state:'visible',timeout:12000});

            stage='WORLD_OPEN';
            const worldByData=page.locator('#kelo-creators-hub [data-workspace="world"]').first();
            if(await worldByData.count())await worldByData.click({timeout:12000});
            else await page.getByRole('button',{name:'Abrir World'}).click({timeout:12000});

            stage='WORLD_MOUNT';
            await page.waitForSelector('#kelo-studio-live',{state:'visible',timeout:15000});
            await page.waitForFunction(()=>{
              const el=document.getElementById('kelo-studio-live');
              return !!(el&&el.dataset.keloWorldLoading!=='1'&&el.querySelector('.ks-status'));
            },null,{timeout:30000});
            const status=await page.locator('#kelo-studio-live .ks-status').textContent().catch(()=> '');
            log('GOOD','WORLD_MOUNT',status||'mounted');
            await browser.close();
            process.exit(0);
          }catch(error){
            log('BAD',stage,String(error?.stack||error));
            try{await browser?.close();}catch{}
            process.exit(1);
          }
          NODE

          cat > /tmp/kelo-bisect-harness/probe.sh <<'SH'
          #!/usr/bin/env bash
          set +e
          sha="$(git rev-parse HEAD)"
          cd /tmp/kelo-bisect-harness
          node probe.mjs "$sha"
          rc=$?
          cd "$GITHUB_WORKSPACE"
          exit $rc
          SH
          chmod +x /tmp/kelo-bisect-harness/probe.sh

      - name: Serve whichever commit is checked out
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kelo-bisect-root
          ln -s "$GITHUB_WORKSPACE" /tmp/kelo-bisect-root/gemini
          python3 -m http.server 8000 --bind 127.0.0.1 --directory /tmp/kelo-bisect-root >/tmp/kelo-bisect-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/gemini/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kelo-bisect-http.log
          exit 1

      - name: Validate good and bad anchors
        shell: bash
        run: |
          set -euo pipefail
          GOOD=72604f28d4023c0543bfd2c36b1bf6823704a3db
          BAD=d71df2c0ad5aa627616858d3c65ef4131eb0f19d
          ORIGINAL=$(git rev-parse HEAD)
          git checkout -q -f "$GOOD"
          /tmp/kelo-bisect-harness/probe.sh
          git checkout -q -f "$BAD"
          if /tmp/kelo-bisect-harness/probe.sh; then
            echo 'ERROR: d71 passed boot/mount; refusing invalid bisect.'
            exit 1
          fi
          git checkout -q -f "$ORIGINAL"

      - name: Bisect to first boot or mount regression
        shell: bash
        run: |
          set -euo pipefail
          GOOD=72604f28d4023c0543bfd2c36b1bf6823704a3db
          BAD=d71df2c0ad5aa627616858d3c65ef4131eb0f19d
          ORIGINAL=$(git rev-parse HEAD)
          : > /tmp/kelo-boot-bisect-results.tsv
          git bisect start "$BAD" "$GOOD"
          set +e
          git bisect run /tmp/kelo-bisect-harness/probe.sh | tee /tmp/kelo-bisect-run-output.txt
          BISECT_RC=${PIPESTATUS[0]}
          set -e
          CULPRIT=$(git rev-parse refs/bisect/bad)
          echo "$CULPRIT" > /tmp/kelo-first-boot-bad-sha.txt
          git show --no-ext-diff --stat --oneline "$CULPRIT" > /tmp/kelo-first-boot-bad-show.txt
          git bisect log > /tmp/kelo-boot-bisect-log.txt
          echo "BISECT_RC=$BISECT_RC"
          echo "FIRST_BOOT_BAD=$CULPRIT"
          cat /tmp/kelo-first-boot-bad-show.txt

          PARENT=$(git rev-parse "$CULPRIT^1")
          echo "PARENT=$PARENT" | tee /tmp/kelo-boot-boundary.txt
          git checkout -q -f "$PARENT"
          if /tmp/kelo-bisect-harness/probe.sh; then
            echo 'PARENT_RESULT=GOOD' | tee -a /tmp/kelo-boot-boundary.txt
          else
            echo 'PARENT_RESULT=BAD' | tee -a /tmp/kelo-boot-boundary.txt
          fi
          git checkout -q -f "$CULPRIT"
          if /tmp/kelo-bisect-harness/probe.sh; then
            echo 'CULPRIT_RESULT=GOOD' | tee -a /tmp/kelo-boot-boundary.txt
          else
            echo 'CULPRIT_RESULT=BAD' | tee -a /tmp/kelo-boot-boundary.txt
          fi
          git bisect reset "$ORIGINAL" || true
          grep -q '^PARENT_RESULT=GOOD$' /tmp/kelo-boot-boundary.txt
          grep -q '^CULPRIT_RESULT=BAD$' /tmp/kelo-boot-boundary.txt

      - name: Publish evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/world-boot-bisect
          cp /tmp/kelo-boot-bisect-results.tsv artifacts/world-boot-bisect/results.tsv 2>/dev/null || true
          cp /tmp/kelo-first-boot-bad-sha.txt artifacts/world-boot-bisect/first-bad-sha.txt 2>/dev/null || true
          cp /tmp/kelo-first-boot-bad-show.txt artifacts/world-boot-bisect/first-bad-show.txt 2>/dev/null || true
          cp /tmp/kelo-boot-bisect-log.txt artifacts/world-boot-bisect/bisect-log.txt 2>/dev/null || true
          cp /tmp/kelo-boot-boundary.txt artifacts/world-boot-bisect/boundary.txt 2>/dev/null || true
          cp /tmp/kelo-bisect-run-output.txt artifacts/world-boot-bisect/run-output.txt 2>/dev/null || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-editor-first-boot-regression-bisect
          path: artifacts/world-boot-bisect/
          if-no-files-found: warn
