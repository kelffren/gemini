name: Critical World Editor d71 LIVE certification

on:
  push:
    branches:
      - experiment/world-editor-pre-dynamic-imports-d71df2c0-live
    paths:
      - '.github/workflows/critical-world-editor-d71-live.yml'
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout critical experiment
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove code snapshot is d71 plus this workflow only
        shell: bash
        run: |
          set -euo pipefail
          BASE=d71df2c0ad5aa627616858d3c65ef4131eb0f19d
          git cat-file -e "$BASE^{commit}"
          mapfile -t changed < <(git diff --name-only "$BASE" HEAD)
          printf 'Changed from d71:\n%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/critical-world-editor-d71-live.yml'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Adapt historical harness in runner only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/studio-live-audit.mjs')
          s=p.read_text()
          replacements=[
            ("'KELO_CREATORS_LAUNCHER','NO polling'", "'KELO_CREATORS_LAUNCHER'"),
            ("?mapEditor=1&studio-live-audit=${Date.now()}", "?guest=1&mapEditor=1&studio-live-audit=${Date.now()}"),
            ("let deployReady=false;", "let deployReady=true;"),
            ("for(let attempt=0;attempt<60;attempt++){", "for(let attempt=0;attempt<0;attempt++){")
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit(f'historical harness pattern not found: {old}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check scripts/studio-live-audit.mjs
          echo 'Historical harness adapted only inside runner; editor/runtime files untouched.'

      - name: Install Playwright client
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.55.0

      - name: Serve exact critical snapshot
        shell: bash
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/critical-world-editor-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/critical-world-editor-http.log
          exit 1

      - name: Bounded World open probe
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
          const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true});
          const page=await context.newPage();
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          const stage=s=>console.log(`[D71-PROBE] ${s}`);
          try{
            stage('BOOT');
            const response=await page.goto('http://127.0.0.1:8000/?guest=1&mapEditor=1&critical-d71=1',{waitUntil:'domcontentloaded',timeout:20000});
            if(!response||response.status()>=400)throw new Error(`BOOT_HTTP_${response?.status()}`);
            stage('ADMIN_READY');
            await page.waitForFunction(()=>!!(window.KeloInputLocks?.acquire&&window.KELO_ADMIN_KEYS?.can?.('world.edit')),null,{timeout:15000});
            stage('CREATORS');
            await page.evaluate(async()=>{const m=await import('./src/creators/ui/creator-hub.mjs');await m.openCreatorHub({root:window});});
            await page.waitForSelector('#kelo-creators-hub',{state:'visible',timeout:10000});
            stage('WORLD_CLICK');
            await page.locator('#kelo-creators-hub [data-workspace="world"]').click({timeout:10000});
            stage('WORLD_MOUNT');
            await page.waitForSelector('#kelo-studio-live',{state:'visible',timeout:15000});
            await page.waitForFunction(()=>{const el=document.getElementById('kelo-studio-live');return !!(el&&el.dataset.keloWorldLoading!=='1'&&el.querySelector('.ks-status'));},null,{timeout:30000});
            const result=await page.evaluate(()=>({status:document.querySelector('#kelo-studio-live .ks-status')?.textContent||'',modes:['terrain','path','collision'].map(x=>!!document.querySelector(`#kelo-studio-live [data-mode="${x}"]`)),bodyActive:document.body.classList.contains('kelo-studio-active')}));
            stage(`PASS ${JSON.stringify(result)}`);
            if(errors.length)throw new Error(`PAGE_ERRORS:${errors.join(' | ')}`);
          } finally { await browser.close(); }
          NODE

      - name: Run full Studio LIVE placement audit
        env:
          AUDIT_URL: http://127.0.0.1:8000/
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/studio-live-audit.mjs

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-world-editor-d71-live-evidence
          path: artifacts/
          if-no-files-found: warn
