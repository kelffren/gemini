name: Property Asset Demand Load

on:
  pull_request:
    paths:
      - 'src/property/property-system.js'
      - 'scripts/property-demand-load-audit.mjs'
      - '.github/workflows/property-demand-load.yml'

permissions:
  contents: read

jobs:
  demand-load-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Prove catalog boot is network-silent and render demand is deduped
        run: node scripts/property-demand-load-audit.mjs
