name: Patch PNG LIVE gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-png-live-gate.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make PNG pipeline changes trigger complete mobile LIVE audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/live-audit.yml')
          s = p.read_text()
          anchor = "      - 'assets/hero.PNG'\n"
          additions = "      - 'assets/**/*.png'\n      - 'assets/**/*.PNG'\n"
          assert additions not in s
          assert anchor in s
          s = s.replace(anchor, additions + anchor, 1)
          script_anchor = "      - 'scripts/live-world-audit.mjs'\n"
          script_additions = (
              "      - 'scripts/png-validation-core.mjs'\n"
              "      - 'scripts/validate-png-pipeline.mjs'\n"
              "      - 'scripts/test-png-validation.mjs'\n"
          )
          assert script_additions not in s
          assert script_anchor in s
          s = s.replace(script_anchor, script_additions + script_anchor, 1)
          p.write_text(s)
          PY
      - name: Verify trigger coverage
        run: |
          grep -Fq "assets/**/*.png" .github/workflows/live-audit.yml
          grep -Fq "assets/**/*.PNG" .github/workflows/live-audit.yml
          grep -Fq "scripts/png-validation-core.mjs" .github/workflows/live-audit.yml
          grep -Fq "scripts/validate-png-pipeline.mjs" .github/workflows/live-audit.yml
          grep -Fq "scripts/test-png-validation.mjs" .github/workflows/live-audit.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/live-audit.yml
          git diff --cached --check
          git commit -m 'ci: require LIVE audit for PNG pipeline changes'
          git push origin HEAD:main
