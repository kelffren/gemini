name: Fix Arbol Atlas Once
on:
  push:
    branches: [ feature/world-builder-admin-v1 ]
    paths: [ '.github/workflows/fix-arbol-atlas-once.yml' ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point irregular tree atlas to existing PNG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/environment/tile-registry.js')
          s=p.read_text()
          old="id:'plaza-nature', src:'assets/Arboleskelo1.atlas.png?art=305'"
          new="id:'plaza-nature', src:'assets/Arboleskelo1.PNG?art=306'"
          if old not in s:
              raise SystemExit('plaza nature atlas source target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit and remove patcher
        run: |
          git config user.name kelo-world-builder-bot
          git config user.email 68343904+kelffren@users.noreply.github.com
          git rm .github/workflows/fix-arbol-atlas-once.yml
          git add src/environment/tile-registry.js
          git commit -m 'Use existing Arboleskelo1 PNG for irregular atlas'
          git push
