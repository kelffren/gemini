name: World Builder Available Assets Patch Once
on:
  push:
    branches: [ feature/world-builder-admin-v1 ]
    paths: [ '.github/workflows/world-builder-available-assets-patch-once.yml' ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Filter missing assets and certify selected visible asset
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ui=Path('src/ui/world-builder-ui.js')
          s=ui.read_text()
          old="""let rows=C.list({category:cat||undefined});if(q)rows=rows.filter(t=>`${t.label} ${t.id} ${t.family}`.toLowerCase().includes(q));for(const t of rows){const b=document.createElement('button');b.className='wb-card'+(selectedAsset===t.id?' on':'');b.innerHTML=`<strong>${t.label}</strong><small>${t.category} · ${Math.round(t.width)}×${Math.round(t.height)} · ∞ admin</small>`;b.onclick=()=>{selectedAsset=t.id;selectedPlacement=null;movingPlacement=null;renderList();renderActions();};list.appendChild(b);}"""
          new="""let rows=C.list({category:cat||undefined});if(q)rows=rows.filter(t=>`${t.label} ${t.id} ${t.family}`.toLowerCase().includes(q));const rr=window.KELO_WORLD_BUILDER_PROPERTY_RENDERER;if(rr){const ready=new Set(rr.readyKeys||[]),failed=rr.errors||{};rows=rows.filter(t=>{const keys=[...new Set((t.parts||[]).map(p=>p.assetKey).filter(Boolean))];return keys.length&&keys.every(k=>ready.has(k)&&!failed[k]);});}if(!rows.length){const empty=document.createElement('div');empty.style.cssText='grid-column:1/-1;padding:14px;color:#8fa19a;font-size:9px';empty.textContent='No hay assets visuales cargados en esta categoría.';list.appendChild(empty);return;}for(const t of rows){const b=document.createElement('button');b.className='wb-card'+(selectedAsset===t.id?' on':'');b.dataset.assetId=t.id;b.innerHTML=`<strong>${t.label}</strong><small>${t.category} · ${Math.round(t.width)}×${Math.round(t.height)} · ∞ admin</small>`;b.onclick=()=>{selectedAsset=t.id;selectedPlacement=null;movingPlacement=null;renderList();renderActions();};list.appendChild(b);}"""
          if old not in s:
              raise SystemExit('UI target block not found')
          ui.write_text(s.replace(old,new))

          audit=Path('scripts/world-builder-browser-audit.mjs')
          s=audit.read_text()
          old="""const selectedTemplate=await page.evaluate(()=>{const t=window.KELO_PROPERTY_CATALOG.list()[0];return{id:t.id,label:t.label,assetKeys:[...new Set((t.parts||[]).map(p=>p.assetKey))]};});\nawait page.waitForFunction(keys=>keys.every(k=>window.KELO_WORLD_BUILDER_PROPERTY_RENDERER?.readyKeys?.includes(k)||window.KELO_WORLD_BUILDER_PROPERTY_RENDERER?.errors?.[k]),selectedTemplate.assetKeys,{timeout:6000});\nconst selectedAtlas=await page.evaluate(keys=>({ready:window.KELO_WORLD_BUILDER_PROPERTY_RENDERER.readyKeys,errors:window.KELO_WORLD_BUILDER_PROPERTY_RENDERER.errors,required:keys}),selectedTemplate.assetKeys);\nconst failedSelected=selectedTemplate.assetKeys.filter(k=>!selectedAtlas.ready.includes(k));\nif(failedSelected.length)throw new Error('selected Property atlas failed '+JSON.stringify({selectedTemplate,selectedAtlas}));\nawait page.locator('#wb-list .wb-card').first().click();"""
          new="""await page.waitForFunction(()=>document.querySelector('#wb-list .wb-card[data-asset-id]'),null,{timeout:6000});\nconst selectedTemplate=await page.evaluate(()=>{const id=document.querySelector('#wb-list .wb-card[data-asset-id]')?.dataset.assetId,t=window.KELO_PROPERTY_CATALOG.get(id);return{id:t.id,label:t.label,assetKeys:[...new Set((t.parts||[]).map(p=>p.assetKey))],ready:window.KELO_WORLD_BUILDER_PROPERTY_RENDERER.readyKeys,errors:window.KELO_WORLD_BUILDER_PROPERTY_RENDERER.errors};});\nif(selectedTemplate.assetKeys.some(k=>!selectedTemplate.ready.includes(k)||selectedTemplate.errors[k]))throw new Error('World Builder exposed a broken asset '+JSON.stringify(selectedTemplate));\nawait page.locator('#wb-list .wb-card[data-asset-id]').first().click();"""
          if old not in s:
              raise SystemExit('audit target block not found')
          audit.write_text(s.replace(old,new))
          PY
      - name: Commit patch and remove patcher
        run: |
          git config user.name kelo-world-builder-bot
          git config user.email 68343904+kelffren@users.noreply.github.com
          git rm .github/workflows/world-builder-available-assets-patch-once.yml
          git add src/ui/world-builder-ui.js scripts/world-builder-browser-audit.mjs
          git commit -m 'Hide unavailable assets from World Builder catalog'
          git push
