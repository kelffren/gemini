name: LAB Parallel World Editor Bisect

on:
  push:
    branches:
      - lab/verify-4d60d2e-world-editor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: candidate-${{ matrix.short }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - { short: "9a280573", sha: "9a2805738e53bf5cdf8cda05dfdf3b3bb52c642c" }
          - { short: "be7b1dd9", sha: "be7b1dd96b66cd11fe7db5e9897562d258466c8b" }
          - { short: "9ccb88a6", sha: "9ccb88a6b66f8b4285a02a801cc806fff9f4b6c8" }
          - { short: "1b764193", sha: "1b7641931a34f67ea22abf3c4ca0c60ff4b3c179" }
          - { short: "79e579dc", sha: "79e579dccb6782c79a81663a54b2782a3a864a21" }
          - { short: "6e34c7ee", sha: "6e34c7ee6abde4d00ab63c6658c6760f9f2cfd35" }
          - { short: "7f97a284", sha: "7f97a2846818d35b5bfd98ddd164bc70b360a7c5" }
          - { short: "fc45a448", sha: "fc45a4484d381ee101df89562b323611323b722f" }
          - { short: "6669c0dd", sha: "6669c0dde82c09545b465ce68a7e643d13bf9b17" }
          - { short: "ab6b19c7", sha: "ab6b19c7b93ec81308ea0c4490bcbba1010df606" }
          - { short: "535c5ba1", sha: "535c5ba13002e9188bc762c450e280b8834995c5" }
          - { short: "9f52de80", sha: "9f52de80b572a9a3657b106f61451871d592452e" }
          - { short: "d6ff0927", sha: "d6ff09277a6eecd244d89710f1043278edde1076" }
          - { short: "5a52c6d7", sha: "5a52c6d7404e09019c9ec96cc2ecea43af1bb6a7" }
          - { short: "824a932f", sha: "824a932f5e3e41c888116ab1453d64500e66255d" }
          - { short: "624829b9", sha: "624829b9cfd4598a9fc34ad948030ee7290b524d" }

    env:
      CANDIDATE_SHA: ${{ matrix.sha }}
      CANDIDATE_SHORT: ${{ matrix.short }}

    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve acceptance harness
        run: cp tests/lab-world-editor-full-cycle.spec.js /tmp/lab-world-editor-full-cycle.spec.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test exact candidate
        shell: bash
        run: |
          set +e
          git reset --hard "$CANDIDATE_SHA"
          mkdir -p tests test-results candidate-evidence
          cp /tmp/lab-world-editor-full-cycle.spec.js tests/lab-world-editor-full-cycle.spec.js

          python3 -m http.server 4173 --bind 127.0.0.1 > candidate-evidence/http.log 2>&1 &
          pid=$!
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then ready=1; break; fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "$CANDIDATE_SHA BAD server-not-ready" | tee candidate-evidence/result.txt
            kill "$pid" 2>/dev/null || true
            exit 0
          fi

          env -u CI KELO_PROBE_ONLY=1 KELO_CANDIDATE_SHA="$CANDIDATE_SHA" KELO_PAGES=http://127.0.0.1:4173/             npx playwright test tests/lab-world-editor-full-cycle.spec.js --project=chromium --workers=1 --retries=0 --reporter=list             > candidate-evidence/probe.log 2>&1
          probe=$?

          if [ "$probe" -ne 0 ]; then
            echo "$CANDIDATE_SHA BAD world-open" | tee candidate-evidence/result.txt
            cp -R test-results candidate-evidence/probe-results 2>/dev/null || true
            kill "$pid" 2>/dev/null || true
            exit 0
          fi

          rm -rf test-results/*
          env -u CI KELO_CANDIDATE_SHA="$CANDIDATE_SHA" KELO_PAGES=http://127.0.0.1:4173/             npx playwright test tests/lab-world-editor-full-cycle.spec.js --project=chromium --workers=1 --retries=0 --reporter=list             > candidate-evidence/full.log 2>&1
          full=$?
          cp -R test-results candidate-evidence/full-results 2>/dev/null || true
          kill "$pid" 2>/dev/null || true

          if [ "$full" -eq 0 ]; then
            echo "$CANDIDATE_SHA GOOD full-acceptance" | tee candidate-evidence/result.txt
          else
            echo "$CANDIDATE_SHA BAD full-acceptance" | tee candidate-evidence/result.txt
          fi
          exit 0

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.short }}
          if-no-files-found: ignore
          retention-days: 14
          path: candidate-evidence/**
