name: LAB Historical World Editor Boundary

on:
  push:
    branches:
      - lab/verify-4d60d2e-world-editor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: candidate-${{ matrix.short }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - { short: "6e0c5404", sha: "6e0c540434f3cd70a16ac4342e97b5072f607274" }
          - { short: "ea14e484", sha: "ea14e48426ac20aff44da009f0d615d8562cf7cd" }
          - { short: "c13cceaf", sha: "c13cceafecd4edc9144a99a108eb2851f88a7541" }

    env:
      CANDIDATE_SHA: ${{ matrix.sha }}
      CANDIDATE_SHORT: ${{ matrix.short }}

    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve current full-cycle harness
        run: cp tests/lab-world-editor-full-cycle.spec.js /tmp/lab-world-editor-full-cycle.spec.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install diagnostic dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test literal visible finger flow
        shell: bash
        run: |
          set +e
          git reset --hard "$CANDIDATE_SHA"
          mkdir -p tests test-results candidate-evidence
          cp /tmp/lab-world-editor-full-cycle.spec.js tests/lab-world-editor-full-cycle.spec.js

          python3 -m http.server 4173 --bind 127.0.0.1 > candidate-evidence/http.log 2>&1 &
          pid=$!
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "$CANDIDATE_SHA BAD server-not-ready" | tee candidate-evidence/result.txt
            kill "$pid" 2>/dev/null || true
            exit 0
          fi

          env -u CI KELO_VISIBLE_FLOW=1 KELO_CANDIDATE_SHA="$CANDIDATE_SHA" KELO_PAGES=http://127.0.0.1:4173/ \
            npx playwright test tests/lab-world-editor-full-cycle.spec.js --project=chromium --workers=1 --retries=0 --reporter=list \
            > candidate-evidence/full.log 2>&1
          full=$?
          cp -R test-results candidate-evidence/full-results 2>/dev/null || true
          kill "$pid" 2>/dev/null || true

          if [ "$full" -eq 0 ]; then
            echo "$CANDIDATE_SHA GOOD full-acceptance" | tee candidate-evidence/result.txt
          else
            echo "$CANDIDATE_SHA BAD visible-full-cycle" | tee candidate-evidence/result.txt
          fi
          exit 0

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-${{ matrix.short }}
          if-no-files-found: ignore
          retention-days: 14
          path: candidate-evidence/**
