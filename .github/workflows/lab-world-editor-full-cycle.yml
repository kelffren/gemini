name: LAB Direct World Freeze Anchors

on:
  push:
    branches:
      - lab/verify-4d60d2e-world-editor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anchor:
    name: anchor-${{ matrix.short }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { short: "GOOD-ea14e484", sha: "ea14e48426ac20aff44da009f0d615d8562cf7cd" }
          - { short: "BAD-4d60d2e7", sha: "4d60d2e713b8fe853583309657448a983c688455" }

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve direct probe
        run: cp tests/lab-world-open-bisect.spec.js /tmp/lab-world-open-bisect.spec.js

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright runtime
        run: npm install --no-package-lock --no-audit --no-fund && npx playwright install --with-deps chromium

      - name: Probe candidate
        shell: bash
        run: |
          set +e
          git reset --hard "${{ matrix.sha }}"
          mkdir -p tests evidence
          cp /tmp/lab-world-open-bisect.spec.js tests/lab-world-open-bisect.spec.js
          python3 -m http.server 4173 --bind 127.0.0.1 > evidence/http.log 2>&1 &
          pid=$!
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          env -u CI KELO_PAGES=http://127.0.0.1:4173/ npx playwright test tests/lab-world-open-bisect.spec.js --project=chromium --workers=1 --retries=0 --reporter=list > evidence/probe.log 2>&1
          code=$?
          kill "$pid" 2>/dev/null || true
          if [ "$code" -eq 0 ]; then
            echo "${{ matrix.sha }} GOOD direct-world-open" | tee evidence/result.txt
          else
            echo "${{ matrix.sha }} BAD direct-world-open" | tee evidence/result.txt
          fi
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-world-${{ matrix.short }}
          path: evidence/**
          retention-days: 14
