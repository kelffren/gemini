name: LAB Parallel World Editor Bisect

on:
  push:
    branches:
      - lab/verify-4d60d2e-world-editor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: candidate-${{ matrix.short }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - { short: "267060cc", sha: "267060cc90e96196dc5273f8f431a2dd727e5324" }
          - { short: "689c186d", sha: "689c186d0518f8bd1edc168392e62f5053e79e1c" }
          - { short: "9f70f171", sha: "9f70f171d9283121e9b39361d4ade9d1090120d2" }
          - { short: "db8ad029", sha: "db8ad029936a975c45069af5f4a904ffcafd6b6b" }
          - { short: "1bb81e77", sha: "1bb81e775ad41059061b86877b8ec62b410f261a" }
          - { short: "1275cb34", sha: "1275cb34fb054e9d61b58880ee3765520aea273f" }
          - { short: "ce30a671", sha: "ce30a671d1b8243d53bec6c50f2168c56ca2bc5c" }
          - { short: "8a0eca07", sha: "8a0eca07f4ceaf97528c0b0e3332307f91c97066" }
          - { short: "83f8dc97", sha: "83f8dc9759299526fab36f8129dc954a793e12e3" }
          - { short: "81fde8cb", sha: "81fde8cbfaadb712da0ae495f8e67c03eb9127e8" }
          - { short: "49ed7676", sha: "49ed76767fc6134388313594151425bae21928c1" }
          - { short: "fbbca966", sha: "fbbca966dafffcc1101b395f7d05a26981ed0db9" }
          - { short: "50a1b181", sha: "50a1b181bd003685d441d12f4b8d34afa7ddde9c" }
          - { short: "0c89f789", sha: "0c89f78911f8a277c4ae6d97088e492a37cf1fc9" }
          - { short: "81c8a2aa", sha: "81c8a2aa918e5f4dd3750c44286dd0406407cba4" }
          - { short: "ae3d9e29", sha: "ae3d9e2969cc7022d85730904bafaaa50d35ccb7" }
          - { short: "eb3f9906", sha: "eb3f99065cb101993db3d401a29b6a4b92ff3a46" }
          - { short: "c49ef373", sha: "c49ef3732849e02dc5a599ca70b8660f606c184c" }

    env:
      CANDIDATE_SHA: ${{ matrix.sha }}
      CANDIDATE_SHORT: ${{ matrix.short }}

    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve acceptance harness
        run: cp tests/lab-world-editor-full-cycle.spec.js /tmp/lab-world-editor-full-cycle.spec.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test exact candidate
        shell: bash
        run: |
          set +e
          git reset --hard "$CANDIDATE_SHA"
          mkdir -p tests test-results candidate-evidence
          cp /tmp/lab-world-editor-full-cycle.spec.js tests/lab-world-editor-full-cycle.spec.js

          python3 -m http.server 4173 --bind 127.0.0.1 > candidate-evidence/http.log 2>&1 &
          pid=$!
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then ready=1; break; fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "$CANDIDATE_SHA BAD server-not-ready" | tee candidate-evidence/result.txt
            kill "$pid" 2>/dev/null || true
            exit 0
          fi

          env -u CI KELO_PROBE_ONLY=1 KELO_CANDIDATE_SHA="$CANDIDATE_SHA" KELO_PAGES=http://127.0.0.1:4173/             npx playwright test tests/lab-world-editor-full-cycle.spec.js --project=chromium --workers=1 --retries=0 --reporter=list             > candidate-evidence/probe.log 2>&1
          probe=$?

          if [ "$probe" -ne 0 ]; then
            echo "$CANDIDATE_SHA BAD world-open" | tee candidate-evidence/result.txt
            cp -R test-results candidate-evidence/probe-results 2>/dev/null || true
            kill "$pid" 2>/dev/null || true
            exit 0
          fi

          rm -rf test-results/*
          env -u CI KELO_CANDIDATE_SHA="$CANDIDATE_SHA" KELO_PAGES=http://127.0.0.1:4173/             npx playwright test tests/lab-world-editor-full-cycle.spec.js --project=chromium --workers=1 --retries=0 --reporter=list             > candidate-evidence/full.log 2>&1
          full=$?
          cp -R test-results candidate-evidence/full-results 2>/dev/null || true
          kill "$pid" 2>/dev/null || true

          if [ "$full" -eq 0 ]; then
            echo "$CANDIDATE_SHA GOOD full-acceptance" | tee candidate-evidence/result.txt
          else
            echo "$CANDIDATE_SHA BAD full-acceptance" | tee candidate-evidence/result.txt
          fi
          exit 0

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.short }}
          if-no-files-found: ignore
          retention-days: 14
          path: candidate-evidence/**
