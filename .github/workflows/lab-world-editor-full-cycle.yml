name: LAB Parallel World Editor Bisect

on:
  push:
    branches:
      - lab/verify-4d60d2e-world-editor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: candidate-${{ matrix.short }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - { short: "63508d08", sha: "63508d083a3897c14401099300cb6c9c3c617e83" }
          - { short: "2fcd655c", sha: "2fcd655c634d6021c0cc968f21350f6b1ed126ce" }
          - { short: "f0fb343d", sha: "f0fb343d08fbb470d800fb985971eeeec97f7715" }
          - { short: "98b7795e", sha: "98b7795eff166767e338d00da5c5e5f2acb8ecc4" }
          - { short: "85876781", sha: "858767814e0454a7727e38da392c4bbf0e55c15d" }
          - { short: "fab246af", sha: "fab246afdde0498425f9651b3eee7b202b639fee" }
          - { short: "58433abd", sha: "58433abd908184ede151b3c8d9fe43b96c0969c1" }
          - { short: "4d16afca", sha: "4d16afcab299687d3701a5632b763eaf79a8af0d" }
          - { short: "6de71de7", sha: "6de71de7c19ab6a9ff98c0848b6fcaca5f7c531e" }
          - { short: "4e5c675e", sha: "4e5c675e3dea5e366e7d273f47d3a8fd0ceebcc1" }
          - { short: "9473a4f5", sha: "9473a4f5ecdfac235243afc015ee8f2baeab9d0a" }
          - { short: "6cd37c37", sha: "6cd37c37c70843d08b661bbc6d4b1ab98c6f23de" }
          - { short: "5803b229", sha: "5803b2292ed74cc3367b85f849cfd883e3bc6972" }
          - { short: "745b0688", sha: "745b0688bdb1f57384154667ed0e5ffcfdbf1d5a" }
          - { short: "a5a668ec", sha: "a5a668ec50f070c2874c3f08d9847ad6ccaddb99" }
          - { short: "6b09fe69", sha: "6b09fe699ee46f80d62b0f53be1368e59eb7cb3c" }
          - { short: "f19872cb", sha: "f19872cb89343320e83cedf585db6c02467bae97" }
          - { short: "0c267e39", sha: "0c267e397823c4c7acb02d872a1271d189dcef0d" }
          - { short: "216a25d1", sha: "216a25d1a3f7f44da7140922ec7d7a03bd8874c2" }
          - { short: "5059adf9", sha: "5059adf922a9706826b8ca340e89068ae980e83e" }

    env:
      CANDIDATE_SHA: ${{ matrix.sha }}
      CANDIDATE_SHORT: ${{ matrix.short }}

    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve acceptance harness
        run: cp tests/lab-world-editor-full-cycle.spec.js /tmp/lab-world-editor-full-cycle.spec.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test exact candidate
        shell: bash
        run: |
          set +e
          git reset --hard "$CANDIDATE_SHA"
          mkdir -p tests test-results candidate-evidence
          cp /tmp/lab-world-editor-full-cycle.spec.js tests/lab-world-editor-full-cycle.spec.js

          python3 -m http.server 4173 --bind 127.0.0.1 > candidate-evidence/http.log 2>&1 &
          pid=$!
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then ready=1; break; fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "$CANDIDATE_SHA BAD server-not-ready" | tee candidate-evidence/result.txt
            kill "$pid" 2>/dev/null || true
            exit 0
          fi

          env -u CI KELO_PROBE_ONLY=1 KELO_CANDIDATE_SHA="$CANDIDATE_SHA" KELO_PAGES=http://127.0.0.1:4173/             npx playwright test tests/lab-world-editor-full-cycle.spec.js --project=chromium --workers=1 --retries=0 --reporter=list             > candidate-evidence/probe.log 2>&1
          probe=$?

          if [ "$probe" -ne 0 ]; then
            echo "$CANDIDATE_SHA BAD world-open" | tee candidate-evidence/result.txt
            cp -R test-results candidate-evidence/probe-results 2>/dev/null || true
            kill "$pid" 2>/dev/null || true
            exit 0
          fi

          rm -rf test-results/*
          env -u CI KELO_CANDIDATE_SHA="$CANDIDATE_SHA" KELO_PAGES=http://127.0.0.1:4173/             npx playwright test tests/lab-world-editor-full-cycle.spec.js --project=chromium --workers=1 --retries=0 --reporter=list             > candidate-evidence/full.log 2>&1
          full=$?
          cp -R test-results candidate-evidence/full-results 2>/dev/null || true
          kill "$pid" 2>/dev/null || true

          if [ "$full" -eq 0 ]; then
            echo "$CANDIDATE_SHA GOOD full-acceptance" | tee candidate-evidence/result.txt
          else
            echo "$CANDIDATE_SHA BAD full-acceptance" | tee candidate-evidence/result.txt
          fi
          exit 0

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.short }}
          if-no-files-found: ignore
          retention-days: 14
          path: candidate-evidence/**
