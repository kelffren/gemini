name: LAB Parallel World Editor Bisect

on:
  push:
    branches:
      - lab/verify-4d60d2e-world-editor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: candidate-${{ matrix.short }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - { short: "5e4be82c", sha: "5e4be82c123e2781d95771d67b2e63b67dc92d56" }
          - { short: "c0ecd0d2", sha: "c0ecd0d2bf86b968c59a608c0e205f1c8a0ea362" }
          - { short: "84d0df5a", sha: "84d0df5a0a28db4ed1b01c3d0cd4cf0c09a77e2a" }
          - { short: "b70e77a8", sha: "b70e77a8be30ed1e8fe735fe03cc288ca44eafb6" }
          - { short: "8c4a20dc", sha: "8c4a20dccfafa905b0b0ccbf22ac91eb9dfa46f3" }
          - { short: "3dd585e7", sha: "3dd585e7de0e8f9105c4f7e9e0bfdf4f66891683" }
          - { short: "94637938", sha: "94637938183b2e752f63815ed7ca51084c47f08f" }
          - { short: "be1b3edf", sha: "be1b3edfd5ead2420545050a58e521300ee1e07b" }
          - { short: "e97eca60", sha: "e97eca6088e14fe5f70a01723914ae4e051f1768" }
          - { short: "3319a9d3", sha: "3319a9d3778da8e45b919d2984ac919a2b0d316b" }
          - { short: "b1c05fcd", sha: "b1c05fcd25285aaf2694a0fc68787d2b0cb018e8" }
          - { short: "1ccec95d", sha: "1ccec95db9eb02b037f640270c3fa3a0808b6f52" }
          - { short: "734fba71", sha: "734fba715064b0786b4f368ade92dc11b37f449e" }
          - { short: "16f3e6f5", sha: "16f3e6f5ee812fc9550ae5ef2c8007844b21b810" }
          - { short: "f5737b94", sha: "f5737b948c9a65cd5d49c1e33c912984bfc89621" }
          - { short: "b905310e", sha: "b905310e30e772b2a385a7b8151a532e2207113a" }

    env:
      CANDIDATE_SHA: ${{ matrix.sha }}
      CANDIDATE_SHORT: ${{ matrix.short }}

    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve acceptance harness
        run: cp tests/lab-world-editor-full-cycle.spec.js /tmp/lab-world-editor-full-cycle.spec.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test exact candidate
        shell: bash
        run: |
          set +e
          git reset --hard "$CANDIDATE_SHA"
          mkdir -p tests test-results candidate-evidence
          cp /tmp/lab-world-editor-full-cycle.spec.js tests/lab-world-editor-full-cycle.spec.js

          python3 -m http.server 4173 --bind 127.0.0.1 > candidate-evidence/http.log 2>&1 &
          pid=$!
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then ready=1; break; fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "$CANDIDATE_SHA BAD server-not-ready" | tee candidate-evidence/result.txt
            kill "$pid" 2>/dev/null || true
            exit 0
          fi

          env -u CI KELO_PROBE_ONLY=1 KELO_CANDIDATE_SHA="$CANDIDATE_SHA" KELO_PAGES=http://127.0.0.1:4173/             npx playwright test tests/lab-world-editor-full-cycle.spec.js --project=chromium --workers=1 --retries=0 --reporter=list             > candidate-evidence/probe.log 2>&1
          probe=$?

          if [ "$probe" -ne 0 ]; then
            echo "$CANDIDATE_SHA BAD world-open" | tee candidate-evidence/result.txt
            cp -R test-results candidate-evidence/probe-results 2>/dev/null || true
            kill "$pid" 2>/dev/null || true
            exit 0
          fi

          rm -rf test-results/*
          env -u CI KELO_CANDIDATE_SHA="$CANDIDATE_SHA" KELO_PAGES=http://127.0.0.1:4173/             npx playwright test tests/lab-world-editor-full-cycle.spec.js --project=chromium --workers=1 --retries=0 --reporter=list             > candidate-evidence/full.log 2>&1
          full=$?
          cp -R test-results candidate-evidence/full-results 2>/dev/null || true
          kill "$pid" 2>/dev/null || true

          if [ "$full" -eq 0 ]; then
            echo "$CANDIDATE_SHA GOOD full-acceptance" | tee candidate-evidence/result.txt
          else
            echo "$CANDIDATE_SHA BAD full-acceptance" | tee candidate-evidence/result.txt
          fi
          exit 0

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.short }}
          if-no-files-found: ignore
          retention-days: 14
          path: candidate-evidence/**
