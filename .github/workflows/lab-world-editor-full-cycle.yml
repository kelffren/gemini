name: LAB Parallel World Editor Bisect

on:
  push:
    branches:
      - lab/verify-4d60d2e-world-editor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: candidate-${{ matrix.short }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - { short: "bc11cdb0", sha: "bc11cdb0019455e34b406e5bdf76f71fb253d04c" }
          - { short: "918d2e90", sha: "918d2e90ae1d4ecffde77958e2d8b983d0f5fb74" }
          - { short: "f47c8b50", sha: "f47c8b50b07c75b8f47b606de2b8ecaf8c804452" }
          - { short: "18d14985", sha: "18d14985d0d40bf53dbc8aa3fdf9328d5e7b3874" }
          - { short: "d8bb6f4a", sha: "d8bb6f4a88eef884f3a867463fd6d8075a697a52" }
          - { short: "a80d2637", sha: "a80d26378e75529777d7914fd1652453a7b2c50c" }
          - { short: "a23531d5", sha: "a23531d5703aba6c34138f4430b1a9f652c6b126" }
          - { short: "f3b7afc6", sha: "f3b7afc695f5e0a51486303f4092e5f3dcfd2ab7" }
          - { short: "33ab5789", sha: "33ab57893302db38a1c25c65f7acf6d78282e7f7" }
          - { short: "936d4eab", sha: "936d4eab51b3eeb6d2395bd1198b5bcf8d8e0993" }
          - { short: "fb7a49ee", sha: "fb7a49ee56a9fd9342eadbd1b6d9be361f7fbee7" }
          - { short: "98a8a531", sha: "98a8a531a5b6d9829be359c3e0dde04d7eb7fc43" }
          - { short: "b451b92e", sha: "b451b92e8e4fdf621cbe6bc1b466eb77860d23d4" }
          - { short: "fe6ab054", sha: "fe6ab054b2322dc7a67a5d13903e0ab6b5d87bb2" }
          - { short: "1fcca6a4", sha: "1fcca6a40892a1d0b5e728b6fe02e06e3726cb02" }
          - { short: "d0f861c4", sha: "d0f861c48a9de15cd0c3bf14c568bbb81fbb28bf" }
          - { short: "b6410e27", sha: "b6410e2785270ce995e745e57f92c8fbd9b1a26d" }
          - { short: "9c98e667", sha: "9c98e66717d595de3e572a706ab5061d5ff1994c" }

    env:
      CANDIDATE_SHA: ${{ matrix.sha }}
      CANDIDATE_SHORT: ${{ matrix.short }}

    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve acceptance harness
        run: cp tests/lab-world-editor-full-cycle.spec.js /tmp/lab-world-editor-full-cycle.spec.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test exact candidate
        shell: bash
        run: |
          set +e
          git reset --hard "$CANDIDATE_SHA"
          mkdir -p tests test-results candidate-evidence
          cp /tmp/lab-world-editor-full-cycle.spec.js tests/lab-world-editor-full-cycle.spec.js

          python3 -m http.server 4173 --bind 127.0.0.1 > candidate-evidence/http.log 2>&1 &
          pid=$!
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then ready=1; break; fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "$CANDIDATE_SHA BAD server-not-ready" | tee candidate-evidence/result.txt
            kill "$pid" 2>/dev/null || true
            exit 0
          fi

          env -u CI KELO_PROBE_ONLY=1 KELO_CANDIDATE_SHA="$CANDIDATE_SHA" KELO_PAGES=http://127.0.0.1:4173/             npx playwright test tests/lab-world-editor-full-cycle.spec.js --project=chromium --workers=1 --retries=0 --reporter=list             > candidate-evidence/probe.log 2>&1
          probe=$?

          if [ "$probe" -ne 0 ]; then
            echo "$CANDIDATE_SHA BAD world-open" | tee candidate-evidence/result.txt
            cp -R test-results candidate-evidence/probe-results 2>/dev/null || true
            kill "$pid" 2>/dev/null || true
            exit 0
          fi

          rm -rf test-results/*
          env -u CI KELO_CANDIDATE_SHA="$CANDIDATE_SHA" KELO_PAGES=http://127.0.0.1:4173/             npx playwright test tests/lab-world-editor-full-cycle.spec.js --project=chromium --workers=1 --retries=0 --reporter=list             > candidate-evidence/full.log 2>&1
          full=$?
          cp -R test-results candidate-evidence/full-results 2>/dev/null || true
          kill "$pid" 2>/dev/null || true

          if [ "$full" -eq 0 ]; then
            echo "$CANDIDATE_SHA GOOD full-acceptance" | tee candidate-evidence/result.txt
          else
            echo "$CANDIDATE_SHA BAD full-acceptance" | tee candidate-evidence/result.txt
          fi
          exit 0

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.short }}
          if-no-files-found: ignore
          retention-days: 14
          path: candidate-evidence/**
