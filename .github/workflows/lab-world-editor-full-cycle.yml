name: LAB Parallel World Editor Bisect

on:
  push:
    branches:
      - lab/verify-4d60d2e-world-editor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: candidate-${{ matrix.short }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - { short: "8b714787", sha: "8b7147875ad69dccfa99dea2f588488c05bcff4a" }
          - { short: "819f8681", sha: "819f8681728d74d73f9f3a8a0ee2934aa4e82495" }
          - { short: "2f7671af", sha: "2f7671af2e655f2abcf27c41bf601f86639681f7" }
          - { short: "6304f937", sha: "6304f937308c22ed324b602d3641532fd4f75d3a" }
          - { short: "7c8c58c1", sha: "7c8c58c1f1e1e99addfaa3ba1bf7dfa7b8515fd4" }
          - { short: "32fc7e13", sha: "32fc7e138559d1b7543c9e56ceee1f0f2003164b" }
          - { short: "f06b3384", sha: "f06b3384fb66ee0bf89aa6fc6ac53cdd67f4fc17" }
          - { short: "5b723fd7", sha: "5b723fd79a500b6dd4bb1fe4d0880c4585dc4aa7" }
          - { short: "d01c0276", sha: "d01c0276258e67e1ae3ce72e924ecb907d80a687" }
          - { short: "8bcf451c", sha: "8bcf451cc0dfe895bc6786fd5ab5dba1373325d6" }

    env:
      CANDIDATE_SHA: ${{ matrix.sha }}
      CANDIDATE_SHORT: ${{ matrix.short }}

    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve acceptance harness
        run: cp tests/lab-world-editor-full-cycle.spec.js /tmp/lab-world-editor-full-cycle.spec.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test exact candidate
        shell: bash
        run: |
          set +e
          git reset --hard "$CANDIDATE_SHA"
          mkdir -p tests test-results candidate-evidence
          cp /tmp/lab-world-editor-full-cycle.spec.js tests/lab-world-editor-full-cycle.spec.js

          python3 -m http.server 4173 --bind 127.0.0.1 > candidate-evidence/http.log 2>&1 &
          pid=$!
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then ready=1; break; fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "$CANDIDATE_SHA BAD server-not-ready" | tee candidate-evidence/result.txt
            kill "$pid" 2>/dev/null || true
            exit 0
          fi

          env -u CI KELO_PROBE_ONLY=1 KELO_CANDIDATE_SHA="$CANDIDATE_SHA" KELO_PAGES=http://127.0.0.1:4173/             npx playwright test tests/lab-world-editor-full-cycle.spec.js --project=chromium --workers=1 --retries=0 --reporter=list             > candidate-evidence/probe.log 2>&1
          probe=$?

          if [ "$probe" -ne 0 ]; then
            echo "$CANDIDATE_SHA BAD world-open" | tee candidate-evidence/result.txt
            cp -R test-results candidate-evidence/probe-results 2>/dev/null || true
            kill "$pid" 2>/dev/null || true
            exit 0
          fi

          rm -rf test-results/*
          env -u CI KELO_CANDIDATE_SHA="$CANDIDATE_SHA" KELO_PAGES=http://127.0.0.1:4173/             npx playwright test tests/lab-world-editor-full-cycle.spec.js --project=chromium --workers=1 --retries=0 --reporter=list             > candidate-evidence/full.log 2>&1
          full=$?
          cp -R test-results candidate-evidence/full-results 2>/dev/null || true
          kill "$pid" 2>/dev/null || true

          if [ "$full" -eq 0 ]; then
            echo "$CANDIDATE_SHA GOOD full-acceptance" | tee candidate-evidence/result.txt
          else
            echo "$CANDIDATE_SHA BAD full-acceptance" | tee candidate-evidence/result.txt
          fi
          exit 0

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.short }}
          if-no-files-found: ignore
          retention-days: 14
          path: candidate-evidence/**
