name: Sprite Ability Easy LIVE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/creators/sprite-ability/**'
      - 'src/creators/creator-entry.mjs'
      - 'src/creators/ui/creator-hub.mjs'
      - 'scripts/live-sprite-ability-easy-smoke.mjs'
      - '.github/workflows/sprite-ability-easy-live.yml'

jobs:
  easy-live:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/creators/sprite-ability/sprite-ability-easy-ui.mjs
          node --check scripts/live-sprite-ability-easy-smoke.mjs
      - name: Install Playwright
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.55.0
      - name: Wait for Easy UI on deployed Pages
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            easy="$(curl --max-time 10 -fsSL "https://kelffren.github.io/gemini/src/creators/sprite-ability/sprite-ability-easy-ui.mjs?smoke=${GITHUB_SHA}-${i}" || true)"
            entry="$(curl --max-time 10 -fsSL "https://kelffren.github.io/gemini/src/creators/creator-entry.mjs?smoke=${GITHUB_SHA}-${i}" || true)"
            if grep -q 'kelo-sprite-ability-easy-v1-style' <<<"$easy" \
              && grep -q 'installSpriteAbilityEasyUI' <<<"$entry" \
              && grep -q 'kelo-creators-core-v1.11.0-sprite-ability-easy' <<<"$entry"; then
              echo 'PASS deployed Pages contains Sprite Ability Easy UI'
              exit 0
            fi
            echo "Waiting for Pages to publish Sprite Ability Easy UI ($i/45)..."
            sleep 4
          done
          echo 'FAIL Pages never exposed Sprite Ability Easy UI in time'
          exit 1
      - name: Open Sprite Ability Easy Mode in live Chrome
        env:
          AUDIT_URL: https://kelffren.github.io/gemini/
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/live-sprite-ability-easy-smoke.mjs
