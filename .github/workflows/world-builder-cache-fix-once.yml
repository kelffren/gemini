name: World Builder Tree Cache Fix Once
on:
  push:
    branches: [ feature/world-builder-admin-v1 ]
    paths:
      - '.github/workflows/world-builder-cache-fix-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align tree cache token
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/environment/art-asset-manifest.json')
          data=json.loads(p.read_text())
          rows=[a for a in data['assets'] if a.get('id')=='arboleskelo1-atlas-v1']
          if len(rows)!=1:
              raise SystemExit(f'expected one tree asset, got {len(rows)}')
          row=rows[0]
          row['cache']={'strategy':'query','key':'art','value':'306'}
          p.write_text(json.dumps(data,separators=(',',':'))+'\n')
          PY
      - name: Verify tree contract locally
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('src/environment/art-asset-manifest.json'));const a=m.assets.find(x=>x.id==='arboleskelo1-atlas-v1');if(a.cache?.value!=='306')process.exit(1);"
      - name: Commit and remove one-time fixer
        run: |
          rm -f .github/workflows/world-builder-cache-fix-once.yml
          git config user.name kelo-world-builder-bot
          git config user.email 68343904+kelffren@users.noreply.github.com
          git add src/environment/art-asset-manifest.json .github/workflows/world-builder-cache-fix-once.yml
          git commit -m 'Align Arboleskelo1 cache token with registry'
          git push
