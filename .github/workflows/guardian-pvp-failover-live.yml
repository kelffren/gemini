name: Guardian PvP Failover LIVE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/guardian-pvp-failover-live.spec.js'
      - 'scripts/guardian-pvp-failover-audit.mjs'
      - 'browserstack.guardian-failover.yml'
      - '.github/workflows/guardian-pvp-failover-live.yml'
      - 'src/core/feature-registry.js'
      - 'src/systems/guardian-system.js'
      - 'src/systems/guardian-authority.js'
      - 'src/systems/guardian-pvp-host.js'
      - 'src/systems/guardian-pvp-net-adapter.js'
      - 'src/workers/guardian-pvp-authority-worker.js'
  # Pages is published with "Deploy from a branch" in this repo. The generated
  # publisher is not a stable workflow name, so page_build is the reliable LIVE trigger.
  page_build:

permissions:
  contents: read
  pages: read

concurrency:
  group: guardian-pvp-failover-${{ github.event_name }}-${{ github.event_name == 'page_build' && 'main' || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: failover-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check LIVE failover spec
        run: node --check tests/guardian-pvp-failover-live.spec.js
      - name: Audit failover lab contract
        run: node scripts/guardian-pvp-failover-audit.mjs

  real-ios-failover:
    name: physical-iphone-master-failover
    needs: contract
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BROWSERSTACK_CONFIG_FILE: browserstack.guardian-failover.yml
      BUILD_NUMBER: ${{ github.run_number }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      KELO_GUARDIAN_TEST_ADMIN_EMAIL: ${{ secrets.KELO_GUARDIAN_TEST_ADMIN_EMAIL }}
      KELO_GUARDIAN_TEST_ADMIN_PASSWORD: ${{ secrets.KELO_GUARDIAN_TEST_ADMIN_PASSWORD }}
      KELO_GUARDIAN_TEST_DONOR_EMAIL: ${{ secrets.KELO_GUARDIAN_TEST_DONOR_EMAIL }}
      KELO_GUARDIAN_TEST_DONOR_PASSWORD: ${{ secrets.KELO_GUARDIAN_TEST_DONOR_PASSWORD }}
      KELO_PAGES_URL: https://kelffren.github.io/gemini/
      KELO_FAILOVER_REAL_IOS: '1'
      KELO_GUARDIAN_FAILOVER_MAX_MS: '45000'
      KELO_GUARDIAN_FAILOVER_MAX_DRIFT_PX: '12'
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check LIVE credentials
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          required=(
            BROWSERSTACK_USERNAME
            BROWSERSTACK_ACCESS_KEY
            SUPABASE_URL
            SUPABASE_PUBLISHABLE_KEY
            KELO_GUARDIAN_TEST_ADMIN_EMAIL
            KELO_GUARDIAN_TEST_ADMIN_PASSWORD
            KELO_GUARDIAN_TEST_DONOR_EMAIL
            KELO_GUARDIAN_TEST_DONOR_PASSWORD
          )
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing secret: $key" >> "$GITHUB_STEP_SUMMARY"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '### Guardian PvP real-iOS failover not executed' >> "$GITHUB_STEP_SUMMARY"
            echo 'Static failover contract remains enforced by the contract job.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Wait until Pages serves this build or a descendant
        if: steps.credentials.outputs.available == 'true' && github.event_name == 'page_build'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.build.commit || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Pages target: $TARGET_SHA"
          for attempt in $(seq 1 90); do
            latest="$(curl -fsSL \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds/latest" || true)"
            status="$(jq -r '.status // empty' <<<"$latest" 2>/dev/null || true)"
            deployed="$(jq -r '.commit // empty' <<<"$latest" 2>/dev/null || true)"
            echo "attempt=$attempt status=${status:-unknown} deployed=${deployed:-unknown}"
            if [[ "$status" == "built" && -n "$deployed" ]]; then
              if [[ "$deployed" == "$TARGET_SHA" ]]; then
                echo 'Pages is serving the exact target build.'
                exit 0
              fi
              compare="$(curl -fsSL \
                -H 'Accept: application/vnd.github+json' \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'X-GitHub-Api-Version: 2026-03-10' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/compare/${TARGET_SHA}...${deployed}" || true)"
              relation="$(jq -r '.status // empty' <<<"$compare" 2>/dev/null || true)"
              if [[ "$relation" == "ahead" || "$relation" == "identical" ]]; then
                echo 'Pages is serving a descendant containing the failover build.'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Pages never confirmed the failover target SHA or a descendant.'
          exit 1

      - name: Setup Node
        if: steps.credentials.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        if: steps.credentials.outputs.available == 'true'
        run: npm install --no-audit --no-fund

      - name: Install local candidate-B Chromium
        if: steps.credentials.outputs.available == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run physical iPhone A -> Chromium B failover
        if: steps.credentials.outputs.available == 'true'
        run: npx browserstack-node-sdk playwright test tests/guardian-pvp-failover-live.spec.js --workers=1 --retries=0

      - name: Record gate result
        if: steps.credentials.outputs.available == 'true' && success()
        run: |
          echo '### Guardian PvP failover LIVE PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Master A: physical iPhone 14 Pro / Safari / iOS 26' >> "$GITHUB_STEP_SUMMARY"
          echo '- Candidate B: concurrent Chromium node' >> "$GITHUB_STEP_SUMMARY"
          echo '- Failure: A context disappears without stopMasterHost()' >> "$GITHUB_STEP_SUMMARY"
          echo '- Recovery: backend lease expiry -> newer epoch -> Worker takeover snapshot' >> "$GITHUB_STEP_SUMMARY"
          echo '- Ghost cleanup: restored A actor pruned after bounded reclaim window' >> "$GITHUB_STEP_SUMMARY"
