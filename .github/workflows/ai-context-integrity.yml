name: AI Context Integrity

on:
  pull_request:
    paths:
      - 'src/**'
      - 'server/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'AI_CONTEXT.md'
      - 'AGENTS.md'
      - 'ENGINE_MAP.md'
      - 'docs/CODE_INDEX.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - name: Build AI context
        run: node scripts/ai-context-compiler.mjs
      - name: Audit AI context
        run: node scripts/ai-context-audit.mjs
      - name: Ensure generated maps are committed
        run: |
          git diff --exit-code -- docs/generated/AI_CODE_MAP.json docs/generated/AI_CODE_MAP.md || {
            echo "::error::AI context maps are stale. Run npm run context:refresh and commit generated files."
            exit 1
          }
