name: Adjust Commerce arcade mobile layout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adjust-commerce-arcades-v1.yml'
      - 'scripts/adjust-commerce-arcades-v1.py'
permissions:
  contents: write
jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/adjust-commerce-arcades-v1.py
      - run: node --check src/environment/tile-registry.js
      - run: node scripts/validate-atlas-contract.mjs
      - run: node scripts/validate-png-pipeline.mjs
      - name: Commit layout
        run: |
          git config user.name kelo-art-bot
          git config user.email 68343904+kelffren@users.noreply.github.com
          git add src/environment/tile-registry.js
          git commit -m 'Tune Commerce arcade mobile layout'
          git push
