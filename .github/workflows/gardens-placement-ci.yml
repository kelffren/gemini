name: Gardens placement CI
on:
  push:
    branches: [main]
    paths:
      - 'assets/gardens-t-junctions-v1.svg'
      - 'src/environment/gardens-t-junction-registry.js'
      - 'src/environment/world-map.js'
      - 'src/environment/gardens-compositions.js'
      - 'src/environment/gardens-junction-overlay.js'
      - 'scripts/validate-gardens-placements.mjs'
      - '.github/workflows/gardens-placement-ci.yml'
  pull_request:
    paths:
      - 'assets/gardens-t-junctions-v1.svg'
      - 'src/environment/gardens-t-junction-registry.js'
      - 'src/environment/world-map.js'
      - 'src/environment/gardens-compositions.js'
      - 'src/environment/gardens-junction-overlay.js'
      - 'scripts/validate-gardens-placements.mjs'
      - '.github/workflows/gardens-placement-ci.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check src/environment/gardens-t-junction-registry.js
          node --check src/environment/gardens-compositions.js
          node --check src/environment/gardens-junction-overlay.js
          node --check scripts/validate-gardens-placements.mjs
          grep -q 'width="128" height="32"' assets/gardens-t-junctions-v1.svg
          grep -q "gardens-t-junction-registry-v1" src/environment/gardens-t-junction-registry.js
          grep -q "gardensTJunctions" src/environment/gardens-t-junction-registry.js
          grep -q "firstClassRegistryAtlas:true" src/environment/gardens-t-junction-registry.js
          grep -q "gardens-compositions-v20" src/environment/gardens-compositions.js
          grep -q "tJunctionRegistryOwned:true" src/environment/gardens-compositions.js
          grep -q "tJunctionOrientationCount:4" src/environment/gardens-compositions.js
          grep -q "gardens-junction-overlay-v3" src/environment/gardens-junction-overlay.js
          grep -q "registryOwned:true" src/environment/gardens-junction-overlay.js
      - name: Declared to renderable Gardens placements
        run: node scripts/validate-gardens-placements.mjs