name: Prefab Contract CI
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/environment/tile-registry.js'
      - 'src/environment/prefab-contract.js'
      - 'src/environment/generic-prefabs.js'
      - 'src/environment/luxe-kiosk-atlas.js'
      - 'scripts/validate-prefab-contract.mjs'
      - '.github/workflows/prefab-contract.yml'
  pull_request:
  workflow_dispatch:
jobs:
  prefab-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check src/environment/prefab-contract.js
          node --check src/environment/generic-prefabs.js
          node --check src/environment/luxe-kiosk-atlas.js
          node --check scripts/validate-prefab-contract.mjs
      - name: Contract extension proof
        run: node scripts/validate-prefab-contract.mjs
      - name: No building-specific rendering in compatibility adapter
        run: |
          if grep -Eq 'new Image\(|drawImage|LAYERS?\.register\(' src/environment/luxe-kiosk-atlas.js; then
            echo 'Luxe compatibility adapter owns rendering/layer registration'
            exit 1
          fi
          grep -q "mode:'generic-prefab-contract-v1'" src/environment/luxe-kiosk-atlas.js
          grep -q "rendererMode:'data-driven-prefabs-v1'" src/environment/generic-prefabs.js
          grep -q "version:'1.0.0'" src/environment/prefab-contract.js
          grep -Eq 'src/environment/prefab-contract.js\?v=[0-9]+' index.html
          grep -Eq 'src/environment/generic-prefabs.js\?v=[0-9]+' index.html