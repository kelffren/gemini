name: Apply BUG-0003 A10 patch

on:
  push:
    branches:
      - automation/apply-bug-0003-a10
    paths:
      - .github/workflows/apply-bug-0003-a10.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch payload
        uses: actions/checkout@v4
        with:
          ref: automation/apply-bug-0003-a10
          path: patch-src
          fetch-depth: 1

      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          path: game
          fetch-depth: 0

      - name: Restore exact uploaded patch
        shell: bash
        run: |
          cat patch-src/.patching/bug0003.part00 \
              patch-src/.patching/bug0003.part01 \
              patch-src/.patching/bug0003.part02 \
              patch-src/.patching/bug0003.part03 \
            | base64 -d | gzip -d > /tmp/bug0003.patch
          test "$(sha256sum /tmp/bug0003.patch | awk '{print $1}')" = "558ab93258f2d182df82109aaaecd071cd10dacbb78cdbcfe82b885e43048339"
          echo "Exact uploaded patch restored: $(wc -c < /tmp/bug0003.patch) bytes"

      - name: Verify and apply patch
        shell: bash
        working-directory: game
        run: |
          git apply --check /tmp/bug0003.patch
          git apply /tmp/bug0003.patch
          git diff --check
          echo "Changed files:"
          git diff --name-only

      - name: Run A10 static audits
        shell: bash
        working-directory: game
        run: |
          node scripts/world-editor-lazy-boot-audit.mjs
          node scripts/world-editor-single-prewarm-owner-audit.mjs
          node scripts/world-editor-creator-boot-isolation-audit.mjs
          node scripts/_bug0003-smoke.mjs

      - name: Commit A10 to main
        shell: bash
        working-directory: game
        run: |
          git config user.name "kelo-world-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(world): A10 iPhone post-chrome survival + TREE place (BUG-0003)"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
