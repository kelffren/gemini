name: Sprite AI Smoke

on:
  pull_request:
    paths:
      - 'server/sprite-ai-*.js'
      - 'src/creators/sprite-compiler/pose-templates.mjs'
      - 'src/creators/ui/sprite-skeleton-lab.mjs'
      - 'src/creators/ui/sprite-factory-online.mjs'
      - 'deploy/huggingface-sprite-ai/**'
      - 'deploy/huggingface-sprite-pose/**'
      - 'supabase/functions/kelo-sprite-generate/**'
      - 'supabase/config.toml'
      - '.github/workflows/sprite-ai-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'server/sprite-ai-*.js'
      - 'src/creators/sprite-compiler/pose-templates.mjs'
      - 'src/creators/ui/sprite-skeleton-lab.mjs'
      - 'src/creators/ui/sprite-factory-online.mjs'
      - 'deploy/huggingface-sprite-ai/**'
      - 'deploy/huggingface-sprite-pose/**'
      - 'supabase/functions/kelo-sprite-generate/**'
      - 'supabase/config.toml'
      - '.github/workflows/sprite-ai-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Node syntax
        run: |
          node --check server/sprite-ai-service.js
          node --check server/sprite-ai-provider-huggingface.js
          node --check server/sprite-ai-provider-pose-huggingface.js
          node --check server/sprite-ai-resource-governor.js
          node --check server/sprite-ai-resource-governor-test.js
          node --check server/sprite-ai-http.js
          node --check server/sprite-ai-smoke-test.js
          node --check src/creators/sprite-compiler/pose-templates.mjs
          node --check src/creators/ui/sprite-skeleton-lab.mjs
          node --check src/creators/ui/sprite-factory-online.mjs
      - name: Supabase Edge syntax
        run: deno check supabase/functions/kelo-sprite-generate/index.ts
      - name: Sprite AI deterministic smoke
        run: node server/sprite-ai-smoke-test.js
      - name: Free-tier resource governor
        run: node server/sprite-ai-resource-governor-test.js
      - name: Skeleton template import
        run: node --input-type=module -e "import('./src/creators/sprite-compiler/pose-templates.mjs').then(m=>{const p=m.buildPosePayload('walk');if(p.frames.length!==4||p.schema!=='kelo-biped-v2')process.exit(1);console.log('skeleton template ok')})"
      - name: Hugging Face Space syntax
        run: |
          python -m py_compile deploy/huggingface-sprite-ai/app.py
          python -m py_compile deploy/huggingface-sprite-pose/app.py
