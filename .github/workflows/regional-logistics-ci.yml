name: Regional Logistics CI

on:
  push:
    branches:
      - main
      - fix/regional-logistics-main-integration
    paths:
      - 'src/systems/regional-economy-*.js'
      - 'src/systems/caravan-system.js'
      - 'src/systems/faction-clan-system.js'
      - 'src/systems/logistics-devtools.js'
      - 'src/systems/container-system.js'
      - 'src/systems/combat/combat-engine.js'
      - 'scripts/regional-logistics-audit.js'
      - 'docs/systems/REGIONAL_ECONOMY_LOGISTICS_SYSTEM.md'
      - 'docs/system-catalog.json'
      - 'guide.html'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/regional-logistics-ci.yml'
  pull_request:
    paths:
      - 'src/systems/regional-economy-*.js'
      - 'src/systems/caravan-system.js'
      - 'src/systems/faction-clan-system.js'
      - 'src/systems/logistics-devtools.js'
      - 'src/systems/container-system.js'
      - 'src/systems/combat/combat-engine.js'
      - 'scripts/regional-logistics-audit.js'
      - 'docs/systems/REGIONAL_ECONOMY_LOGISTICS_SYSTEM.md'
      - 'docs/system-catalog.json'
      - 'guide.html'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/regional-logistics-ci.yml'

permissions:
  contents: read

jobs:
  regional-logistics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run audit:logistics
      - run: npm run audit:containers
      - run: npm run audit:commerce
      - run: npm run audit:docs
