name: One-shot UI Bootstrap Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-ui-bootstrap-fix.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore shared interface bootstrap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          css_anchor = '<link rel="stylesheet" href="src/ui/backpack-fantasy-v1.css?v=1">'
          css_lines = (
              '<link rel="stylesheet" href="src/ui/kelo-interface-system.css?v=1">\n'
              '<link rel="stylesheet" href="src/ui/kelo-interface-compat.css?v=1">'
          )
          runtime_anchor = '<script src="src/ui/luxe-shell.js?v=230"></script>'
          runtime_line = '<script src="src/ui/kelo-interface-runtime.js?v=1"></script>'

          if 'kelo-interface-system.css' not in text:
              if css_anchor not in text:
                  raise SystemExit('CSS anchor missing; refusing unsafe rewrite')
              text = text.replace(css_anchor, css_anchor + '\n' + css_lines, 1)

          if 'kelo-interface-compat.css' not in text:
              raise SystemExit('Shared compatibility stylesheet insertion failed')

          if 'kelo-interface-runtime.js' not in text:
              if runtime_anchor not in text:
                  raise SystemExit('Runtime anchor missing; refusing unsafe rewrite')
              text = text.replace(runtime_anchor, runtime_anchor + '\n' + runtime_line, 1)

          for token in ('kelo-interface-system.css', 'kelo-interface-compat.css', 'kelo-interface-runtime.js'):
              count = text.count(token)
              if count != 1:
                  raise SystemExit(f'{token}: expected exactly one bootstrap reference, found {count}')

          path.write_text(text)
          PY

          git diff --check
          grep -q 'kelo-interface-system.css' index.html
          grep -q 'kelo-interface-compat.css' index.html
          grep -q 'kelo-interface-runtime.js' index.html

      - name: Commit minimal fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'index.html already repaired'
            exit 0
          fi
          git config user.name 'kelo-ci'
          git config user.email 'kelo-ci@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(ui): restore shared interface bootstrap'
          git pull --rebase origin main
          git push origin HEAD:main
