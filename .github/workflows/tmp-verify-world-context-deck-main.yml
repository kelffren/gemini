name: TEMP Verify World Context Deck Main Fix

on:
  push:
    branches:
      - fix/world-context-deck-freeze-main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/world-main-fix-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/world-main-fix-http.log
          exit 1
      - name: Run contextual deck regression probe
        env:
          KELO_PAGES: http://127.0.0.1:4173/
        run: npx playwright test tests/tmp-world-context-deck-regression.spec.js --project=chromium --workers=1 --retries=0 --reporter=list
