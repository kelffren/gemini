name: World Surgery Wire V3

on:
  push:
    branches: [world-surgery]

permissions:
  contents: write

jobs:
  wire-v3:
    runs-on: ubuntu-latest
    if: github.actor != 'kelo-world-surgery-v3'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: world-surgery
          fetch-depth: 1

      - name: Wire remaining build-tool and live-runtime switches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, marker):
              p=Path(path)
              text=p.read_text()
              if marker in text:
                  print(f'already wired: {path} :: {marker}')
                  return False
              if old not in text:
                  raise SystemExit(f'expected block missing: {path} :: {marker}')
              p.write_text(text.replace(old,new,1))
              print(f'wired: {path} :: {marker}')
              return True

          changed=False

          control='src/studio/diagnostics/world-surgery-control.mjs'
          changed |= replace_once(
              control,
              """  {id:'paintCopies',label:'Paint Copies',group:'OPTIONAL',risk:'HISTORICAL REGRESSION · c13cceaf'},\n  {id:'assetPalette',label:'Asset Palette',group:'OPTIONAL'},\n""",
              """  {id:'paintCopies',label:'Paint Copies',group:'OPTIONAL',risk:'HISTORICAL REGRESSION · c13cceaf'},\n  {id:'quickBuild',label:'Quick Build',group:'OPTIONAL'},\n  {id:'roomBuild',label:'Room Build',group:'OPTIONAL'},\n  {id:'roomOpening',label:'Room Opening',group:'OPTIONAL'},\n  {id:'roomMaterial',label:'Room Material',group:'OPTIONAL'},\n  {id:'assetPalette',label:'Asset Palette',group:'OPTIONAL'},\n""",
              "{id:'quickBuild',label:'Quick Build',group:'OPTIONAL'}"
          )

          live='src/studio/integration/live-studio-controller.mjs'
          changed |= replace_once(
              live,
              """async function loadLiveStudioRuntime(root){\n  const phone=isPhone(root);\n""",
              """async function loadLiveStudioRuntime(root){\n  const phone=isPhone(root);\n  const surgery=root.KELO_WORLD_SURGERY;\n""",
              'const surgery=root.KELO_WORLD_SURGERY; // WORLD SURGERY LIVE IMPORT GATES'
          )
          # Normalize marker to a descriptive comment without changing semantics.
          p=Path(live); text=p.read_text()
          if 'const surgery=root.KELO_WORLD_SURGERY;\n  const {yieldStudioBoot' in text and 'WORLD SURGERY LIVE IMPORT GATES' not in text:
              text=text.replace('const surgery=root.KELO_WORLD_SURGERY;\n  const {yieldStudioBoot','const surgery=root.KELO_WORLD_SURGERY; // WORLD SURGERY LIVE IMPORT GATES\n  const {yieldStudioBoot',1);p.write_text(text);changed=True

          changed |= replace_once(
              live,
              """    pointerMod=await import('../input/pointer-input-adapter.mjs');await wait();abortIfNeeded();\n    cameraMod=await import('../input/studio-camera-controller.mjs');await wait();abortIfNeeded();\n""",
              """    pointerMod=await import('../input/pointer-input-adapter.mjs');await wait();abortIfNeeded();\n    if(surgery?.enabled?.('cameraController')===false){cameraMod={createStudioCameraController:null};surgery?.markStatus?.('cameraController','DISABLED',{phase:'module-import'});}\n    else{cameraMod=await import('../input/studio-camera-controller.mjs');await wait();abortIfNeeded();}\n""",
              "cameraMod={createStudioCameraController:null}"
          )

          changed |= replace_once(
              live,
              """      import('../render/studio-overlay-canvas.mjs'),\n      import('../render/creator-grid-overlay.mjs'),\n      import('../input/pointer-input-adapter.mjs'),\n      import('../input/studio-camera-controller.mjs')\n""",
              """      surgery?.enabled?.('overlay')===false?Promise.resolve({createStudioOverlayCanvas:null}):import('../render/studio-overlay-canvas.mjs'),\n      surgery?.enabled?.('grid')===false?Promise.resolve({createCreatorGridOverlay:null}):import('../render/creator-grid-overlay.mjs'),\n      import('../input/pointer-input-adapter.mjs'),\n      surgery?.enabled?.('cameraController')===false?Promise.resolve({createStudioCameraController:null}):import('../input/studio-camera-controller.mjs')\n""",
              "Promise.resolve({createStudioCameraController:null})"
          )

          changed |= replace_once(
              live,
              """    mirrorMod=await import('./authority-command-mirror.mjs');await wait();abortIfNeeded();\n    prodMod={createCreatorProductivityPanel:null};\n""",
              """    if(surgery?.enabled?.('authorityMirror')===false){mirrorMod={installStudioAuthorityMirror:null};surgery?.markStatus?.('authorityMirror','DISABLED',{phase:'module-import'});}\n    else{mirrorMod=await import('./authority-command-mirror.mjs');await wait();abortIfNeeded();}\n    prodMod={createCreatorProductivityPanel:null};\n""",
              "mirrorMod={installStudioAuthorityMirror:null}"
          )

          changed |= replace_once(
              live,
              """      import('./authority-command-mirror.mjs'),\n      import('../ui/creator-productivity-panel.mjs'),\n""",
              """      surgery?.enabled?.('authorityMirror')===false?Promise.resolve({installStudioAuthorityMirror:null}):import('./authority-command-mirror.mjs'),\n      import('../ui/creator-productivity-panel.mjs'),\n""",
              "Promise.resolve({installStudioAuthorityMirror:null})"
          )

          changed |= replace_once(
              live,
              """export async function openKeloStudioLive({root=globalThis}={}){\n""",
              """function createNoopAuthorityMirror(){\n  return Object.freeze({uninstall(){},previewScale:async()=>null,authorityIdFor:()=>null,collisionAuthorityIdFor:()=>null,seed(){},seedCollision(){},clear(){}});\n}\nfunction createNoopCameraController(root){\n  let zoom=1,panMode=false;\n  const snapshot=()=>root.KeloCamera?.snapshot?.()||{x:0,y:0,effectiveZoom:1,screenW:root.innerWidth||1,screenH:root.innerHeight||1};\n  return Object.freeze({\n    toWorld:(x,y)=>root.KeloCamera?.screenToWorld?.(Number(x)||0,Number(y)||0)||{x:Number(x)||0,y:Number(y)||0},\n    panScreen(){return null;},setCenter(){return null;},\n    setZoom(next){zoom=Math.max(.2,Math.min(5,Number(next)||1));return zoom;},\n    focusRect(){return null;},setPanMode(value){panMode=!!value;return panMode;},resume(){},suspend(){},destroy(){},snapshot,\n    minZoom:.2,maxZoom:5,get zoom(){return zoom;},get effectiveZoom(){return Number(snapshot().effectiveZoom)||1;},get enabled(){return false;},get panMode(){return panMode;}\n  });\n}\n\nexport async function openKeloStudioLive({root=globalThis}={}){\n""",
              'function createNoopAuthorityMirror()'
          )

          changed |= replace_once(
              live,
              """  let draftId=draft.draftId;const mirror=installStudioAuthorityMirror({adapter:studio.adapter,actorId,getDraftId:()=>draftId});\n""",
              """  let draftId=draft.draftId;\n  const mirror=surgery?.enabled?.('authorityMirror')===false||typeof installStudioAuthorityMirror!=='function'\n    ? createNoopAuthorityMirror()\n    : installStudioAuthorityMirror({adapter:studio.adapter,actorId,getDraftId:()=>draftId});\n  surgery?.markStatus?.('authorityMirror',surgery?.enabled?.('authorityMirror')===false?'DISABLED':'ACTIVE',{phase:'live-mount'});\n""",
              "const mirror=surgery?.enabled?.('authorityMirror')"
          )

          changed |= replace_once(
              live,
              """    let snapSize=Math.max(1,Number(studio.kernel.document.settings?.tileSize)||32);const gridOverlay=surgery?.enabled?.('grid')===false?{draw(){},configure(){}}:createCreatorGridOverlay({size:snapSize,visible:true});\n""",
              """    let snapSize=Math.max(1,Number(studio.kernel.document.settings?.tileSize)||32);const gridOverlay=surgery?.enabled?.('grid')===false||typeof createCreatorGridOverlay!=='function'?{draw(){},configure(){}}:createCreatorGridOverlay({size:snapSize,visible:true});\n""",
              "typeof createCreatorGridOverlay!=='function'"
          )

          changed |= replace_once(
              live,
              """    cameraController=createStudioCameraController({root,isUi:isStudioUi,onNavigateStart:cancelForCamera,onPinchStart:payload=>mode==='select'?false:beginPinchScale(payload),onPinchMove:movePinchScale,onPinchEnd:payload=>{void guarded(()=>endPinchScale(payload));}});\n""",
              """    cameraController=surgery?.enabled?.('cameraController')===false||typeof createStudioCameraController!=='function'\n      ? createNoopCameraController(root)\n      : createStudioCameraController({root,isUi:isStudioUi,onNavigateStart:cancelForCamera,onPinchStart:payload=>mode==='select'?false:beginPinchScale(payload),onPinchMove:movePinchScale,onPinchEnd:payload=>{void guarded(()=>endPinchScale(payload));}});\n    surgery?.markStatus?.('cameraController',surgery?.enabled?.('cameraController')===false?'DISABLED':'ACTIVE',{phase:'live-mount'});\n""",
              "cameraController=surgery?.enabled?.('cameraController')"
          )

          changed |= replace_once(
              live,
              """      if(!running||overlay)return;\n      if(phoneOverlay)return;\n""",
              """      if(!running||overlay)return;\n      if(phoneOverlay||surgery?.enabled?.('overlay')===false||typeof createStudioOverlayCanvas!=='function'){surgery?.markStatus?.('overlay','DISABLED',{phase:'live-overlay'});return;}\n""",
              "typeof createStudioOverlayCanvas!=='function'"
          )

          if changed:
              print('V3 wiring complete')
          else:
              print('V3 already complete')
          PY

      - name: Syntax check
        run: |
          node --check src/studio/diagnostics/world-surgery-control.mjs
          node --check src/studio/integration/live-studio-controller.mjs

      - name: Commit generated wiring
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'kelo-world-surgery-v3'
          git config user.email 'kelo-world-surgery-v3@users.noreply.github.com'
          git add src/studio/diagnostics/world-surgery-control.mjs src/studio/integration/live-studio-controller.mjs
          git commit -m 'feat(world-surgery): isolate build tools camera and mirror [skip ci]'
          git push origin HEAD:world-surgery
