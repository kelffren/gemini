name: TEMP Verify Creator Hub Restore Current Main
on:
  push:
    branches: [fix/creator-hub-full-restore-main-4c9f]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: Critical artifact integrity
        run: node scripts/tmp-critical-artifact-integrity-audit.mjs
      - run: npx playwright install chromium --with-deps
      - name: Serve
        shell: bash
        run: |
          mkdir -p test-results
          python3 -m http.server 4173 --bind 127.0.0.1 >test-results/http.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat test-results/http.log
          exit 1
      - name: Verify Hub to World
        env:
          KELO_PAGES: http://127.0.0.1:4173/
        run: npx playwright test tests/tmp-current-main-hub-restore.spec.js --project=chromium --workers=1 --retries=0 --reporter=list
