name: Kelo Instant Delivery Promotion

on:
  pull_request:
    paths:
      - '.github/workflows/instant-delivery-promote.yml'
      - 'config/instant-delivery-plaza.json'
      - 'src/creators/assets/instant-delivery-compiler.mjs'
      - 'src/creators/assets/png-space-optimizer.mjs'
      - 'assets/Arboleskelo1.PNG'

concurrency:
  group: kelo-instant-delivery-promote-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  promote-plaza-nature-sparse:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET: assets/plaza-nature-runtime-core--233db909c0402294.png
      EXPECTED_SHA256: 233db909c040229470a2aea2bb98d29f9a79c45b89f3996df0799dd92afee8a1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate declared plazaNature coverage
        run: node scripts/instant-delivery-usage-audit.mjs --config=config/instant-delivery-plaza.json
      - name: Rebuild exact sparse PNG from canonical SOURCE
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {buildSparsePngAtlas,sha256Hex} from './src/creators/assets/instant-delivery-compiler.mjs';
          const plan=JSON.parse(fs.readFileSync('config/instant-delivery-plaza.json','utf8'));
          const item=plan.assets.find(asset=>asset.id==='plazaNature'&&asset.mode==='sparse-png');
          if(!item)throw new Error('PLAZA_NATURE_SPARSE_PLAN_MISSING');
          const source=fs.readFileSync(item.source);
          const built=buildSparsePngAtlas(source,item.keepRects);
          const expected=process.env.EXPECTED_SHA256;
          const actual=sha256Hex(built.buffer);
          if(actual!==expected)throw new Error(`PLAZA_NATURE_SPARSE_SHA_MISMATCH:${actual}:${expected}`);
          fs.mkdirSync('/tmp/kelo-instant-delivery',{recursive:true});
          fs.writeFileSync(path.join('/tmp/kelo-instant-delivery',path.basename(process.env.TARGET)),built.buffer);
          console.log(`INSTANT_DELIVERY_PROMOTION_CANDIDATE bytes=${built.buffer.length} sha256=${actual} saved=${built.report.savedBytes}`);
          NODE
      - name: Promote only when branch bytes differ
        run: |
          CANDIDATE="/tmp/kelo-instant-delivery/$(basename "$TARGET")"
          echo "$EXPECTED_SHA256  $CANDIDATE" | sha256sum -c -
          CURRENT_SHA="missing"
          if [ -f "$TARGET" ]; then CURRENT_SHA="$(sha256sum "$TARGET" | awk '{print $1}')"; fi
          if [ "$CURRENT_SHA" = "$EXPECTED_SHA256" ]; then
            echo "INSTANT_DELIVERY_PROMOTION_NOOP sha256=$CURRENT_SHA"
            exit 0
          fi
          cp "$CANDIDATE" "$TARGET"
          echo "$EXPECTED_SHA256  $TARGET" | sha256sum -c -
          test "$(wc -c < "$TARGET")" -eq 1283924
          git config user.name "kelo-weightless-bot"
          git config user.email "68343904+kelffren@users.noreply.github.com"
          git add "$TARGET"
          git commit -m "perf(weightless): promote verified plaza nature sparse blob"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
          echo "INSTANT_DELIVERY_PROMOTION_PUSHED previous=$CURRENT_SHA current=$EXPECTED_SHA256"
