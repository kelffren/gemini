name: World Surgery Asset Recovery Apply

on:
  push:
    branches: [world-surgery]
    paths:
      - scripts/world-surgery-asset-recovery-apply.py
      - .github/workflows/world-surgery-asset-recovery-apply.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: world-surgery-asset-recovery-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: world-surgery
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply surgery
        run: python3 scripts/world-surgery-asset-recovery-apply.py
      - name: Syntax gate
        run: |
          node --check src/studio/adapters/kelo-runtime-adapter.mjs
          node --check src/studio/render/studio-asset-preview-service.mjs
          node --check src/studio/render/studio-mobile-placement-ghost.mjs
          node --check src/studio/diagnostics/world-surgery-control.mjs
          node --check src/studio/integration/live-studio-controller.mjs
          node --check scripts/world-surgery-functional-smoke.mjs
      - name: Commit runtime surgery
        run: |
          git config user.name "kelo-world-surgery-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/world-surgery-asset-recovery-apply.yml
          git rm -f scripts/world-surgery-asset-recovery-apply.py scripts/world-surgery-preview-recovery-ci.py || true
          git add -A
          git diff --cached --check
          git commit -m "fix(world-surgery): restore real mobile asset previews"
          git push origin HEAD:world-surgery
