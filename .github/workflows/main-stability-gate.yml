name: Main Stability Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-stability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stability:
    name: main-stability-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      KELO_PAGES: http://127.0.0.1:4173/
      KELO_LEGACY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      KELO_RECOVERY_ARTIFACTS: test-results/recovery-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Retired branch governance self-test
        run: node scripts/retired-branch-guard.mjs --self-test

      - name: Retired branch merge guard
        run: node scripts/retired-branch-guard.mjs

      - name: Install frozen dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install chromium --with-deps

      # Recovery Mesh stays inside the existing main gate instead of creating
      # another push-triggered workflow. This keeps one CI run per current ref
      # and relies on the gate's cancel-in-progress policy for superseded SHAs.
      - name: Recovery architecture contract
        run: npm run audit:recovery

      - name: Bug intelligence self-test
        run: npm run test:bug-intelligence

      - name: Classify Recovery Mesh impact
        id: recovery_impact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          base='${{ github.event.pull_request.base.sha || github.event.before || '' }}'
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi

          git diff --name-only "$base" HEAD | tee test-results/recovery-changed-files.txt

          if grep -Eq '^(src/(creators|studio)/|src/core/(bug-observability\.mjs|module-loader\.js|creators-lazy-gate\.js)|tests/world-editor-ios-reopen\.spec\.js|scripts/recovery-|index\.html$|service-worker|sw\.js$|playwright\.config\.js$|package\.json$|\.github/workflows/(main-stability-gate|recovery-lab)\.yml$)' test-results/recovery-changed-files.txt; then
            echo 'world=true' >> "$GITHUB_OUTPUT"
            echo 'World Recovery profile: required'
          else
            echo 'world=false' >> "$GITHUB_OUTPUT"
            echo 'World Recovery profile: skipped (unrelated diff)'
          fi

      - name: Build
        run: npm run build

      - name: Architecture contract
        run: npm run audit:foundation

      - name: Legacy can only shrink contract
        run: npm run audit:legacy-containment

      - name: Documentation contract
        run: npm run audit:docs

      - name: X-Foundation dependency and failure graph
        run: node scripts/x-foundation-contract-audit.mjs

      - name: MMORPG community 59-system contract
        run: node scripts/mmorpg-community-platform-audit.mjs

      - name: MMORPG Wave 1 root invariants
        run: node scripts/mmorpg-wave1-root-audit.mjs

      - name: MMORPG Wave 1 owner integration
        run: node scripts/mmorpg-wave1-owner-integration-audit.mjs

      - name: Performance no-regression contract
        run: npm run audit:performance

      - name: Biblioteca 10k catalog budget
        run: node scripts/audit-asset-catalog-10k.mjs

      - name: Kelo content descriptor publication contract
        run: node scripts/publish-kelo-content-descriptors.mjs --check

      - name: Online foundation contract
        run: npm run audit:online-foundation

      - name: Guardian distributed compute contract
        run: npm run audit:guardian

      - name: Guardian community two-device quorum E2E
        run: node scripts/guardian-community-two-device-e2e.mjs

      - name: Guardian community LIVE harness security contract
        run: node scripts/guardian-community-live-harness-audit.mjs

      - name: Community Guardian publication provenance contract
        run: node scripts/community-guardian-publication-audit.mjs

      - name: Updater contract
        run: npm run audit:updater

      - name: Studio foundation contract
        run: npm run audit:studio

      - name: Creator definition and world environment contract
        run: npm run audit:creator-suite

      - name: Creator sprite to original game runtime contract
        run: node scripts/universal-look-runtime-audit.mjs

      - name: External Sprite OS contract
        run: node scripts/sprite-os-audit.mjs

      - name: Paint Copies regression contract
        run: npm run audit:studio:paint-copies

      - name: Universal library fast-build contract
        run: npm run audit:library-build

      - name: Semantic world context contract
        run: npm run audit:semantic-context

      - name: PvP facing contract
        run: npm run audit:pvp-facing

      - name: PvP adaptive quality owner contract
        run: node scripts/pvp-auto-reducer-audit.mjs

      - name: Start exact PR build server
        run: |
          mkdir -p test-results
          python3 -m http.server 4173 --bind 127.0.0.1 > test-results/main-stability-http.log 2>&1 &
          echo $! > /tmp/kelo-main-stability-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat test-results/main-stability-http.log
          exit 1

      - name: Critical mobile, Creator Sprite OS and PvP smoke on PR bytes
        run: >-
          npx playwright test
          tests/main-stability-mobile.spec.js
          tests/universal-sprite-original-game.spec.js
          tests/sprite-os.spec.js
          tests/pvp-dodge-live.spec.js
          --project=chromium

      # Expensive World diagnostics only run when the changed paths can affect
      # Creator/Studio boot. They use the exact checkout on localhost and never
      # publish a GitHub Pages deployment.
      - name: Targeted World Recovery profile
        if: steps.recovery_impact.outputs.world == 'true'
        run: >-
          npm run recovery:profile --
          --profile=world
          --base=http://127.0.0.1:4173/
          --artifacts=test-results/recovery-artifacts

      - name: World Editor stale-session reopen regression
        if: steps.recovery_impact.outputs.world == 'true'
        run: >-
          npx playwright test
          tests/world-editor-ios-reopen.spec.js
          --project=chromium
          --workers=1

      - name: Upload Playwright and Recovery evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: main-stability-playwright-evidence
          path: |
            playwright-report.json
            test-results/
            artifacts/legacy-containment/
            artifacts/x-foundation/
          retention-days: 14
          if-no-files-found: ignore
