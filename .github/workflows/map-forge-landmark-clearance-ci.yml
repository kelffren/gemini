name: Map Forge Landmark Clearance CI
on:
  push:
    branches: [main]
    paths:
      - 'src/world/map-forge/**'
      - 'scripts/map-forge-landmark-clearance-audit.mjs'
      - '.github/workflows/map-forge-landmark-clearance-ci.yml'
  workflow_dispatch:
jobs:
  landmark-clearance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: node --check src/world/map-forge/map-forge-builder.mjs && node --check scripts/map-forge-landmark-clearance-audit.mjs
      - name: Audit 300 deterministic worlds
        run: node scripts/map-forge-landmark-clearance-audit.mjs
