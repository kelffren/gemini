name: UI Auth Gateway Black-box Audit

on:
  push:
    branches:
      - audit/ui-auth-gateway-20260912

jobs:
  auth-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install matching Playwright browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Exercise account gateway through UI
        run: node scripts/blackbox-auth-gateway-audit.mjs
      - name: Upload gateway evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-auth-gateway-report
          path: ui-auth-gateway-artifacts/
          if-no-files-found: error
          retention-days: 14
