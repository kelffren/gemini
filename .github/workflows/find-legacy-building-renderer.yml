name: Locate legacy plaza building renderer
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/find-legacy-building-renderer.yml'
jobs:
  grep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find likely building renderer
        run: |
          echo '=== named labels ==='
          grep -RniE "Mercado|Banco|Cafe|Caf[eé]|Atelier|building|edificio|roof|tejado|ventana" --include='*.js' --include='*.html' . | head -300 || true
          echo '=== plaza-coordinate drawing ==='
          grep -RniE "1150|1530|1300|1400|1250|1870" --include='*.js' . | head -300 || true
