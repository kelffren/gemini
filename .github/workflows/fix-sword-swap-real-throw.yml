name: Fix Sword Swap Real Throw

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sword-swap-real-throw.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply real Sword Swap throw integration
        run: |
          echo '' | base64 -d > /tmp/patch_sword.py
          python3 /tmp/patch_sword.py
      - name: Validate syntax and contracts
        run: |
          node --check src/visuals/ability-visuals.js
          node --check src/systems/pvp-world.js
          grep -q "ability-visual-resolver-v1.2.0" src/visuals/ability-visuals.js
          grep -q "SWAP_SWORD_THROWN" src/systems/pvp-world.js
          grep -q "KeloProjectileVisuals.drawLayer('worldFX',ctx)" src/systems/pvp-world.js
      - name: Commit integration
        run: |
          git config user.name 'kelo-visual-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/visuals/ability-visuals.js src/systems/pvp-world.js
          git commit -m 'visual: connect katana throw to real Sword Swap'
          git push
