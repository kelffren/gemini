name: World Builder Asset Ready Patch Once
on:
  push:
    branches: [ feature/world-builder-admin-v1 ]
    paths: [ '.github/workflows/world-builder-asset-ready-patch-once.yml' ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make object catalog reactive to atlas readiness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ui=Path('src/ui/world-builder-ui.js')
          s=ui.read_text()
          old="""const rr=window.KELO_WORLD_BUILDER_PROPERTY_RENDERER;if(rr){const ready=new Set(rr.readyKeys||[]),failed=rr.errors||{};rows=rows.filter(t=>{const keys=[...new Set((t.parts||[]).map(p=>p.assetKey).filter(Boolean))];return keys.length&&keys.every(k=>ready.has(k)&&!failed[k]);});}if(!rows.length){const empty=document.createElement('div');empty.style.cssText='grid-column:1/-1;padding:14px;color:#8fa19a;font-size:9px';empty.textContent='No hay assets visuales cargados en esta categoría.';list.appendChild(empty);return;}for(const t of rows){const b=document.createElement('button');b.className='wb-card'+(selectedAsset===t.id?' on':'');b.dataset.assetId=t.id;b.innerHTML=`<strong>${t.label}</strong><small>${t.category} · ${Math.round(t.width)}×${Math.round(t.height)} · ∞ admin</small>`;b.onclick=()=>{selectedAsset=t.id;selectedPlacement=null;movingPlacement=null;renderList();renderActions();};list.appendChild(b);}"""
          new="""const rr=window.KELO_WORLD_BUILDER_PROPERTY_RENDERER;let ready=new Set(),failed={},hasPending=false;if(rr){ready=new Set(rr.readyKeys||[]);failed=rr.errors||{};rows=rows.filter(t=>{const keys=[...new Set((t.parts||[]).map(p=>p.assetKey).filter(Boolean))];return keys.length&&keys.every(k=>!failed[k]);});hasPending=rows.some(t=>[...new Set((t.parts||[]).map(p=>p.assetKey).filter(Boolean))].some(k=>!ready.has(k)));}if(!rows.length){const empty=document.createElement('div');empty.style.cssText='grid-column:1/-1;padding:14px;color:#8fa19a;font-size:9px';empty.textContent='No hay assets visuales disponibles en esta categoría.';list.appendChild(empty);return;}for(const t of rows){const keys=[...new Set((t.parts||[]).map(p=>p.assetKey).filter(Boolean))],isReady=!rr||keys.every(k=>ready.has(k));const b=document.createElement('button');b.className='wb-card'+(selectedAsset===t.id?' on':'');b.dataset.assetId=t.id;b.dataset.ready=isReady?'1':'0';b.disabled=!isReady;b.innerHTML=`<strong>${t.label}</strong><small>${t.category} · ${Math.round(t.width)}×${Math.round(t.height)} · ${isReady?'∞ admin':'CARGANDO…'}</small>`;b.onclick=()=>{selectedAsset=t.id;selectedPlacement=null;movingPlacement=null;renderList();renderActions();};list.appendChild(b);}if(hasPending)setTimeout(()=>{if(open&&layer==='objects')renderList();},180);"""
          if old not in s:
              raise SystemExit('UI readiness target not found')
          ui.write_text(s.replace(old,new))

          audit=Path('scripts/world-builder-browser-audit.mjs')
          s=audit.read_text()
          s=s.replace("document.querySelector('#wb-list .wb-card[data-asset-id]')","document.querySelector('#wb-list .wb-card[data-asset-id][data-ready=\"1\"]')")
          s=s.replace("document.querySelector('#wb-list .wb-card[data-asset-id]')?.dataset.assetId","document.querySelector('#wb-list .wb-card[data-asset-id][data-ready=\"1\"]')?.dataset.assetId")
          s=s.replace("page.locator('#wb-list .wb-card[data-asset-id]').first().click()","page.locator('#wb-list .wb-card[data-asset-id][data-ready=\"1\"]').first().click()")
          audit.write_text(s)
          PY
      - name: Commit and remove patcher
        run: |
          git config user.name kelo-world-builder-bot
          git config user.email 68343904+kelffren@users.noreply.github.com
          git rm .github/workflows/world-builder-asset-ready-patch-once.yml
          git add src/ui/world-builder-ui.js scripts/world-builder-browser-audit.mjs
          git commit -m 'Make World Builder object catalog atlas-aware'
          git push
