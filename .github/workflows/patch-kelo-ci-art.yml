name: Patch Kelo CI art gates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-kelo-ci-art.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch stale atlas gate and add PNG pipeline gates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/ci.yml')
          s=p.read_text()
          old='grep -q "src/environment/atlas-contract.js?v=2" index.html'
          new='grep -q "src/environment/atlas-contract.js?v=3" index.html'
          assert old in s and new not in s
          s=s.replace(old,new,1)
          anchor='          node scripts/validate-atlas-contract.mjs\n'
          addition=(
              '          node scripts/validate-atlas-contract.mjs\n'
              '          node scripts/validate-png-pipeline.mjs\n'
              '          node scripts/test-png-validation.mjs\n'
          )
          assert anchor in s
          assert 'node scripts/validate-png-pipeline.mjs' not in s
          s=s.replace(anchor,addition,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml
          git diff --cached --check
          git commit -m 'ci: align Kelo art gates with LIVE contracts'
          git push origin HEAD:main
