name: Unpack base zoo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-base-zoo.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unpack-base-zoo
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and unpack archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import shutil
          import zipfile

          archive = Path('assets/base.zip')
          target = Path('assets/base-zoo')
          if not archive.is_file():
              raise SystemExit('assets/base.zip not found')
          if target.exists():
              raise SystemExit('assets/base-zoo already exists; refusing to overwrite it')

          with zipfile.ZipFile(archive) as zf:
              infos = zf.infolist()
              names = [i.filename for i in infos if not i.is_dir()]
              if not names:
                  raise SystemExit('ZIP contains no files')
              if len(names) != len(set(names)):
                  raise SystemExit('ZIP contains duplicate file paths')
              for info in infos:
                  p = PurePosixPath(info.filename)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'Unsafe ZIP path: {info.filename}')
              target.mkdir(parents=True)
              zf.extractall(target)

          files = sorted(p for p in target.rglob('*') if p.is_file())
          print(f'Extracted {len(files)} files into {target}')
          for p in files:
              print(p)
          PY

      - name: Commit extracted assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kelo-asset-unpacker[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/base-zoo
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git commit -m 'Unpack base zoo assets'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying"
            sleep 2
          done
          exit 1
