name: Kelo Backlog Hardening
on:
  push:
    branches:
      - kelo/backlog-hardening-20260907
permissions:
  contents: write
jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[backlog-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kelo/backlog-hardening-20260907
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply verified minimal backlog fixes
        run: python scripts/apply-backlog-hardening.py
      - name: Static and deterministic validation
        run: |
          node --check engine-a.js
          node --check engine-c.js
          node --check src/physics/collision-utils.js
          node --check src/abilities/abilityData.js
          node --check src/abilities/stone-system.js
          node --check src/abilities/kelo-ability-boot.js
          node --check src/visuals/ability-visuals.js
          node scripts/validate-ability-runtime-contract.mjs
          node scripts/validate-collision-contract.mjs
      - name: Stone regression tests
        run: |
          npm install --no-audit --no-fund
          npx playwright test tests/stone-system.spec.js
      - name: Commit verified runtime patch to feature branch
        run: |
          git config user.name "Kelo Backlog Bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -- .github/workflows/ci.yml
          git add index.html engine-a.js engine-c.js src/physics/collision-utils.js src/abilities/kelo-ability-boot.js tests/stone-system.spec.js scripts/validate-ability-runtime-contract.mjs scripts/validate-collision-contract.mjs
          git commit -m "Harden ability and collision contracts [backlog-applied]"
          git push origin HEAD:kelo/backlog-hardening-20260907
