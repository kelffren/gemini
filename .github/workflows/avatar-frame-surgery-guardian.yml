name: Avatar Frame Surgery Guardian

on:
  pull_request:
    paths:
      - 'src/creators/avatar/**'
      - 'src/creators/sprite-compiler/**'
      - 'src/creators/ui/avatar-frame-surgery-*.mjs'
      - 'src/creators/workspaces/avatar-workspace.mjs'
      - 'scripts/avatar-frame-surgery-supervisor-audit.mjs'
      - 'scripts/avatar-frame-surgery-research-audit.mjs'
      - '.github/workflows/avatar-frame-surgery-guardian.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frame-surgery-guardian:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependency without mutating the repo
        run: npm install --no-package-lock --ignore-scripts
      - name: Syntax gate
        run: |
          node --check src/creators/ui/avatar-frame-surgery-workspace.mjs
          node --check src/creators/ui/avatar-frame-surgery-editor.mjs
          node --check src/creators/ui/avatar-frame-surgery-ui-kit.mjs
          node --check src/creators/sprite-compiler/sprite-frame-surgery-model.mjs
          node --check src/creators/sprite-compiler/sprite-frame-surgery-selection.mjs
          node --check src/creators/sprite-compiler/sprite-frame-normalizer.mjs
          node --check src/creators/avatar/kelo-universal-asset-compiler.mjs
          node --check src/creators/avatar/avatar-quick-import-service.mjs
          node --check scripts/avatar-frame-surgery-research-audit.mjs
      - name: 35-of-35 research-hardened Frame Surgery supervisor
        run: node scripts/avatar-frame-surgery-supervisor-audit.mjs
      - name: Advanced research adversary
        run: node scripts/avatar-frame-surgery-research-audit.mjs
      - name: Existing adversarial ingestion corpus
        run: npm run audit:sprite-ingestion
      - name: Existing Frame Doctor audit
        run: npm run audit:sprite-frame-doctor
      - name: Existing Avatar Quick Import audit
        run: npm run audit:avatar-quick