name: Universal External Asset Normalizer
on: {pull_request: {paths: ['src/creators/assets/**','data/opengameart-cc0-curated.json','scripts/external-asset-normalizer-audit.mjs','.github/workflows/universal-external-asset-normalizer.yml']}}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24.20.0'}
      - run: node scripts/external-asset-normalizer-audit.mjs
