name: Asset Space Hardening

on:
  push:
    branches: [main, feat/adaptive-png-space-compiler]
    paths:
      - 'src/creators/assets/**'
      - 'scripts/asset-*.mjs'
      - 'docs/asset-space-budgets.json'
      - 'assets/world/plaza/**'
      - 'src/environment/generated/forest-plaza-tileset-v2-manifest.js'
      - '.github/workflows/asset-space-hardening.yml'
  pull_request:
    paths:
      - 'src/creators/assets/**'
      - 'scripts/asset-*.mjs'
      - 'docs/asset-space-budgets.json'
      - 'assets/world/plaza/**'
      - 'src/environment/generated/forest-plaza-tileset-v2-manifest.js'
      - '.github/workflows/asset-space-hardening.yml'

concurrency:
  group: asset-space-hardening-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Restore batch DELIVERY optimizer cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/asset-batch-delivery
          key: asset-batch-delivery-v1-${{ runner.os }}-${{ hashFiles('src/creators/assets/png-space-optimizer.mjs', 'src/creators/assets/png-palette-order.mjs', 'src/creators/assets/png-conformance-guard.mjs', 'src/creators/assets/asset-image-profiler.mjs', 'src/creators/assets/png-render-metadata.mjs', 'src/creators/assets/asset-optimization-cache.mjs', 'scripts/asset-batch-delivery-compiler.mjs') }}
          restore-keys: |
            asset-batch-delivery-v1-${{ runner.os }}-
      - name: Bug Intelligence risk preflight
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            BASE="$BEFORE"
          else
            BASE="$(git merge-base HEAD origin/main)"
          fi
          echo "Asset-space risk base: $BASE"
          node scripts/bug-risk.mjs "$BASE" HEAD
      - name: Bug Intelligence dependency impact
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            BASE="$BEFORE"
          else
            BASE="$(git merge-base HEAD origin/main)"
          fi
          if [ "$BASE" = "$(git rev-parse HEAD)" ]; then
            echo 'BUG_IMPACT_NO_DIFF — nothing changed relative to baseline'
          else
            node scripts/bug-impact.mjs --diff "$BASE" HEAD --depth=2
          fi
      - name: Runtime performance no-regression contract
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            BASE="$BEFORE"
          else
            BASE="$(git merge-base HEAD origin/main)"
          fi
          TMP="$(mktemp -d)"
          git worktree add --detach "$TMP/base" "$BASE" >/dev/null
          set +e
          (cd "$TMP/base" && node scripts/performance-foundation-audit.js) >"$TMP/base.log" 2>&1
          BASE_RC=$?
          node scripts/performance-foundation-audit.js >"$TMP/head.log" 2>&1
          HEAD_RC=$?
          set -e
          grep '^✗ ' "$TMP/base.log" | sort >"$TMP/base.fail" || true
          grep '^✗ ' "$TMP/head.log" | sort >"$TMP/head.fail" || true
          echo "Baseline performance audit exit: $BASE_RC"
          cat "$TMP/base.fail" || true
          echo "HEAD performance audit exit: $HEAD_RC"
          cat "$TMP/head.fail" || true
          comm -13 "$TMP/base.fail" "$TMP/head.fail" >"$TMP/new.fail"
          if [ -s "$TMP/new.fail" ]; then
            echo 'NEW PERFORMANCE CONTRACT FAILURES INTRODUCED:'
            cat "$TMP/new.fail"
            exit 1
          fi
          echo 'PERFORMANCE_NO_REGRESSION_OK'
      - name: AUTO effort escalation regression
        run: node scripts/asset-effort-controller-audit.mjs
      - name: Exact palette ordering tournament regression
        run: node scripts/asset-palette-order-audit.mjs
      - name: Real repository palette tournament evidence
        run: node scripts/asset-palette-order-real-audit.mjs --input=assets --max-files=200 --report=test-results/asset-palette-real
      - name: Quality Agent golden corpus
        run: node scripts/asset-quality-golden-corpus-audit.mjs
      - name: Animation temporal consistency gate
        run: node scripts/asset-animation-consistency-audit.mjs
      - name: Declarative asset-group budgets
        run: node scripts/asset-route-budget-audit.mjs --config=docs/asset-space-budgets.json --report=test-results/asset-route-budget
      - name: PNG cache integrity
        run: node scripts/asset-optimization-cache-audit.mjs
      - name: Smart Atlas recomposition proof
        run: node scripts/asset-atlas-recomposition-audit.mjs --manifest=src/environment/generated/forest-plaza-tileset-v2-manifest.js
      - name: Smart Atlas padding / fragmentation diagnostics
        run: node scripts/asset-atlas-packing-diagnostics.mjs --manifest=src/environment/generated/forest-plaza-tileset-v2-manifest.js --paddings=0,1,2 --report=test-results/asset-atlas-packing-diagnostics
      - name: Smart Atlas shared-region overlap diagnostics
        run: node scripts/asset-atlas-overlap-diagnostics.mjs --manifest=src/environment/generated/forest-plaza-tileset-v2-manifest.js --report=test-results/asset-atlas-overlap-diagnostics
      - name: Smart Atlas topology-preserving crop proof
        run: node scripts/asset-atlas-topology-crop-audit.mjs --manifest=src/environment/generated/forest-plaza-tileset-v2-manifest.js --paddings=0,1,2 --report=test-results/asset-atlas-topology-crop
      - name: Smart Atlas final PNG byte evidence
        run: node scripts/asset-atlas-final-bytes-audit.mjs --manifest=src/environment/generated/forest-plaza-tileset-v2-manifest.js --padding=2 --report=test-results/asset-atlas-final-bytes
      - name: Smart Atlas DELIVERY candidate compiler
        run: node scripts/asset-atlas-delivery-candidate.mjs --manifest=src/environment/generated/forest-plaza-tileset-v2-manifest.js --padding=2 --report=test-results/asset-atlas-delivery-candidate
      - name: Batch strict PNG DELIVERY candidates
        run: node scripts/asset-batch-delivery-compiler.mjs --input=assets --max-files=80 --max-source-bytes=8388608 --min-saving-bytes=1024 --min-saving-percent=0.1 --cache=.cache/asset-batch-delivery --report=test-results/asset-batch-delivery
      - name: Batch optimizer cache warm replay
        run: |
          node scripts/asset-batch-delivery-compiler.mjs --input=assets --max-files=80 --max-source-bytes=8388608 --min-saving-bytes=1024 --min-saving-percent=0.1 --cache=.cache/asset-batch-delivery --report="$RUNNER_TEMP/asset-batch-delivery-cache-replay"
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const first=JSON.parse(fs.readFileSync('test-results/asset-batch-delivery/report.json','utf8'));
          const replayPath=path.join(process.env.RUNNER_TEMP,'asset-batch-delivery-cache-replay','report.json');
          const replay=JSON.parse(fs.readFileSync(replayPath,'utf8'));
          const equalKeys=['scannedFiles','decodedFiles','candidateCount','totalSourceBytes','totalProjectedBytes','savedBytes','allPositiveSavingBytes','discardedPositiveSavingsBytes','runtimeActiveCandidates'];
          for(const key of equalKeys){if(first[key]!==replay[key])throw new Error(`BATCH_CACHE_REPLAY_MISMATCH ${key}: ${first[key]} != ${replay[key]}`);}
          if(replay.rejectedSafety!==0)throw new Error(`BATCH_CACHE_REPLAY_SAFETY_REJECTS ${replay.rejectedSafety}`);
          if(replay.cacheHits!==replay.decodedFiles)throw new Error(`BATCH_CACHE_REPLAY_EXPECTED_ALL_HITS ${replay.cacheHits}/${replay.decodedFiles}`);
          if(replay.cacheMisses!==0)throw new Error(`BATCH_CACHE_REPLAY_UNEXPECTED_MISSES ${replay.cacheMisses}`);
          const speedup=replay.elapsedMs>0?first.elapsedMs/replay.elapsedMs:null;
          const evidence={status:'ASSET_BATCH_DELIVERY_CACHE_REPLAY_OK',firstElapsedMs:first.elapsedMs,replayElapsedMs:replay.elapsedMs,speedup,firstCacheHits:first.cacheHits,firstCacheMisses:first.cacheMisses,replayCacheHits:replay.cacheHits,replayCacheMisses:replay.cacheMisses,decodedFiles:replay.decodedFiles,savedBytes:replay.savedBytes,candidateCount:replay.candidateCount};
          fs.writeFileSync('test-results/asset-batch-delivery-cache-replay.json',JSON.stringify(evidence,null,2));
          console.log(JSON.stringify(evidence));
          NODE
      - name: Verified DELIVERY registry
        run: node scripts/asset-delivery-registry.mjs --input=test-results --report=test-results/asset-delivery-registry
      - name: Asset documentation contract
        run: node scripts/system-documentation-audit.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: asset-space-hardening-report
          path: |
            test-results/asset-route-budget
            test-results/asset-palette-real
            test-results/asset-atlas-packing-diagnostics
            test-results/asset-atlas-overlap-diagnostics
            test-results/asset-atlas-topology-crop
            test-results/asset-atlas-final-bytes
            test-results/asset-atlas-delivery-candidate/delivery-manifest.json
            test-results/asset-atlas-delivery-candidate/report.json
            test-results/asset-batch-delivery/report.json
            test-results/asset-batch-delivery/candidates/**/delivery-manifest.json
            test-results/asset-batch-delivery/candidates/**/report.json
            test-results/asset-batch-delivery-cache-replay.json
            test-results/asset-delivery-registry
          if-no-files-found: ignore
