name: TEMP Diagnose World Editor Menu Bounce

on:
  push:
    branches:
      - fix/world-editor-menu-bounce
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve
        shell: bash
        run: |
          mkdir -p test-results
          python3 -m http.server 4173 --bind 127.0.0.1 >test-results/http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat test-results/http.log
          exit 1
      - name: Reproduce menu bounce
        env:
          KELO_PAGES: http://127.0.0.1:4173/
        run: npx playwright test tests/tmp-world-menu-bounce.spec.js --project=chromium --workers=1 --retries=0 --reporter=list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-menu-bounce-evidence
          if-no-files-found: ignore
          retention-days: 14
          path: test-results/**
