name: Studio Quick Build CI

on:
  pull_request:
    paths:
      - 'src/studio/tools/quick-build-tool.mjs'
      - 'src/studio/tools/room-build-tool.mjs'
      - 'src/studio/tools/register-basic-tools.mjs'
      - 'src/studio/tools/placement-tool.mjs'
      - 'src/studio/document/document-commands.mjs'
      - 'src/studio/render/studio-overlay-renderer.mjs'
      - 'scripts/studio-quick-build-audit.mjs'
      - 'scripts/studio-quick-build-drag-audit.mjs'
      - 'scripts/studio-room-build-audit.mjs'
      - '.github/workflows/studio-quick-build-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/studio/tools/quick-build-tool.mjs'
      - 'src/studio/tools/room-build-tool.mjs'
      - 'src/studio/tools/register-basic-tools.mjs'
      - 'src/studio/tools/placement-tool.mjs'
      - 'src/studio/document/document-commands.mjs'
      - 'src/studio/render/studio-overlay-renderer.mjs'
      - 'scripts/studio-quick-build-audit.mjs'
      - 'scripts/studio-quick-build-drag-audit.mjs'
      - 'scripts/studio-room-build-audit.mjs'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check src/studio/tools/quick-build-tool.mjs
          node --check src/studio/tools/room-build-tool.mjs
          node --check src/studio/tools/register-basic-tools.mjs
          node --check src/studio/tools/placement-tool.mjs
          node --check src/studio/document/document-commands.mjs
          node --check src/studio/render/studio-overlay-renderer.mjs
          node --check scripts/studio-quick-build-audit.mjs
          node --check scripts/studio-quick-build-drag-audit.mjs
          node --check scripts/studio-room-build-audit.mjs
      - name: Quick Build phase 1-3 contract
        run: node scripts/studio-quick-build-audit.mjs
      - name: Quick Build phase 4 drag contract
        run: node scripts/studio-quick-build-drag-audit.mjs
      - name: Quick Build phase 5 room contract
        run: node scripts/studio-room-build-audit.mjs
