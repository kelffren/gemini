# Kelo World Supabase local-development configuration.
# Production linking/deploy target is declared below; secrets never live here.
project_id = "kelo-world"

[api]
enabled = true
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.seed]
enabled = false

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000", "http://127.0.0.1:3000"]
enable_signup = true

# The GitHub integration currently has production deployment disabled while
# this foundation PR is validated. This ref is not a secret.
[remotes.production]
project_id = "iapxdbitjdwvtbpjghct"
