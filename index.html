<script>
(function(){
  window.KELO_WORLD_DECORATION_RESET=true;
  window.KELO_HIDE_MINIMAP=true;
  try{
    var q=new URLSearchParams(location.search);
    if(q.get('guest')==='1'||q.get('aiGuest')==='1'){
      document.documentElement.setAttribute('data-kelo-auth-gate','off');
      document.documentElement.setAttribute('data-kelo-guest-play','1');
      sessionStorage.setItem('kelo_local_guest_play_v1','1');
      localStorage.setItem('kelo_local_guest_play_v1','1');
    }
  }catch(e){}
  var native=window.requestAnimationFrame.bind(window);
  var cancel=window.cancelAnimationFrame.bind(window);
  var q=[],held=true,id=0;
  window.requestAnimationFrame=function(cb){
    if(!held)return native(cb);
    var n=++id; q.push({n:n,cb:cb}); return n;
  };
  window.cancelAnimationFrame=function(n){
    if(!held)return cancel(n);
    q=q.filter(function(x){return x.n!==n});
  };
  window.__keloReleaseRAF=function(){
    if(!held)return;
    held=false;
    window.requestAnimationFrame=native;
    window.cancelAnimationFrame=cancel;
    var run=q.slice(); q=[];
    for(var i=0;i<run.length;i++){ try{ native(run[i].cb); }catch(e){} }
  };
})();
</script>

<script>
(function(){
  var packs=[
    {src:'src/ui/player-nameplate.js?v=1', name:'placas'},
    {src:'src/systems/nobility.js?v=4', name:'títulos'},
    {src:'src/ui/kelo-chat-drawer.js?v=5-premium-waze', name:'chat'},
    {src:'src/ui/kelo-chat-integration-bridge.js?v=2', name:'chat'},
    {src:'src/environment/plaza-depth.js?v=219', name:'plaza'},
    {src:'src/ui/profile-panel-close.js?v=2', name:'perfil'},
    {src:'src/ui/self-interaction-ui.js?v=1', name:'perfil'}
  ];
  var i=0, box=document.getElementById('kelo-module-loader');
  var text=document.getElementById('kelo-ml-text');
  var bar=document.getElementById('kelo-ml-bar');
  function busy(){
    try{ if(typeof input!=='undefined'&&input&&(Math.abs(input.normX)>0.02||Math.abs(input.normY)>0.02||input.active)) return true; }catch(e){}
    return false;
  }
  function show(msg, pct){
    if(!box)return;
    box.hidden=false;
    if(text) text.textContent=msg;
    if(bar) bar.style.width=Math.max(0,Math.min(100,pct))+'%';
  }
  function hide(){
    if(!box)return;
    show('Listo',100);
    setTimeout(function(){ box.hidden=true; }, 900);
  }
  function next(){
    if(i>=packs.length){ hide(); return; }
    if(busy()){ show('En pausa · caminando', (i/packs.length)*100); setTimeout(next, 400); return; }
    var item=packs[i];
    show('Descargando '+item.name+'  '+(i+1)+'/'+packs.length, (i/packs.length)*100);
    var s=document.createElement('script');
    s.src=item.src;
    s.onload=s.onerror=function(){ i+=1; setTimeout(next, 320); };
    document.head.appendChild(s);
  }
  setTimeout(next, 1600);
})();
</script>
