<script>
(function(){
  try{
    if(sessionStorage.getItem('kelo.world.updater.pendingBuild.v5')&&!window.__KELO_UPDATE_EARLY_HEALTH__){
      var health={errors:[],startedAt:Date.now(),stop:null};
      var record=function(type,message){
        if(health.errors.length>=10)health.errors.shift();
        health.errors.push({type:type,message:String(message||type),at:Date.now()});
      };
      var onEarlyError=function(event){record('error',event&&event.message||'early_error');};
      var onEarlyReject=function(event){var reason=event&&event.reason;record('unhandledrejection',reason&&reason.message||reason||'early_rejection');};
      health.stop=function(){window.removeEventListener('error',onEarlyError);window.removeEventListener('unhandledrejection',onEarlyReject);};
      window.addEventListener('error',onEarlyError);
      window.addEventListener('unhandledrejection',onEarlyReject);
      window.__KELO_UPDATE_EARLY_HEALTH__=health;
    }
  }catch(e){}
  window.KELO_WORLD_DECORATION_RESET=false;
  try{window.KELO_WORLD_DECORATION_RESET=new URLSearchParams(location.search).get('decorationReset')==='1'}catch(e){}
  window.KELO_HIDE_MINIMAP=true;
  var minimapSelector='#kw-live-minimap,#kelo-minimap,#minimap,.kelo-minimap,.lx-mark,[data-minimap],[id*="minimap" i],[class*="minimap" i],[id*="mini-map" i],[class*="mini-map" i]';
  var removeMinimapHost=function(el){
    if(!(el instanceof HTMLElement)||el.id==='game-canvas'||el===document.body||el===document.documentElement)return false;
    var host=el;
    for(var i=0;i<3&&host.parentElement&&host.parentElement!==document.body;i++){
      var p=host.parentElement,pr=p.getBoundingClientRect(),hr=host.getBoundingClientRect();
      if(pr.width<48||pr.height<48||pr.width>300||pr.height>300)break;
      if(Math.abs(pr.left-hr.left)>40||Math.abs(pr.top-hr.top)>40)break;
      host=p;
    }
    host.remove();
    return true;
  };
  var purgeMinimap=function(){
    try{
      document.querySelectorAll(minimapSelector).forEach(removeMinimapHost);
      document.querySelectorAll('canvas,div,section,aside').forEach(function(el){
        if(!(el instanceof HTMLElement)||el.id==='game-canvas'||!el.isConnected)return;
        var r=el.getBoundingClientRect(),ratio=r.height?r.width/r.height:0;
        if(r.width<48||r.height<48||r.width>280||r.height>280||ratio<.55||ratio>1.9)return;
        if(r.left>Math.max(72,innerWidth*.30)||r.top<innerHeight*.48)return;
        if((innerHeight-r.bottom)>Math.max(190,innerHeight*.24))return;
        if(el.tagName!=='CANVAS'&&!el.querySelector('canvas'))return;
        removeMinimapHost(el);
      });
    }catch(e){}
  };
  var purgeQueued=false;
  var scheduleMinimapPurge=function(){
    if(purgeQueued)return;
    purgeQueued=true;
    requestAnimationFrame(function(){purgeQueued=false;purgeMinimap();});
  };
  window.__KELO_MINIMAP_PURGE__=purgeMinimap;
  purgeMinimap();
  new MutationObserver(scheduleMinimapPurge).observe(document.documentElement,{childList:true,subtree:true});
  window.addEventListener('pageshow',purgeMinimap,{passive:true});
  window.addEventListener('load',purgeMinimap,{passive:true});
  window.addEventListener('resize',scheduleMinimapPurge,{passive:true});
  window.addEventListener('orientationchange',scheduleMinimapPurge,{passive:true});
  window.__keloHoldGameLoop=true;
  try{
    var q=new URLSearchParams(location.search);
    if(q.get('guest')==='1'||q.get('aiGuest')==='1'){
      document.documentElement.setAttribute('data-kelo-auth-gate','off');
      document.documentElement.setAttribute('data-kelo-guest-play','1');
      sessionStorage.setItem('kelo_local_guest_play_v1','1');
      localStorage.setItem('kelo_local_guest_play_v1','1');
    }
    var freeze=q.get('freezeLab')==='1'||q.get('freeze')==='1'||q.get('debugFreeze')==='1';
    var recovery=q.get('recoveryLab')==='1'||q.get('debugRecovery')==='1'||freeze;
    if(recovery){
      window.__keloRecoveryMeshPromise=import('./src/core/bug-observability.mjs?v=recovery-mesh-1').then(function(mod){
        var flow=q.get('recoveryFlow')||(freeze?'world-open':'runtime');
        var bug=q.get('bug')||(freeze?'BUG-0003':null);
        var mesh=mod.installRecoveryMesh({root:window,flow:flow,bugId:bug,force:true,version:'V6.69-recovery-mesh'});
        if(freeze){
          window.__keloFreezeLocatorPromise=Promise.resolve(mod.installFreezeLocator({root:window,flow:'world-open',bugId:bug||'BUG-0003',force:true,version:'V6.69-freeze-locator'}));
        }
        return mesh;
      }).catch(function(error){console.error('[Kelo Recovery Mesh boot]',error);return null;});
    }
  }catch(e){}
})();
