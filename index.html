  <title>Kelo World — V6.22</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
    html,body{width:100%;height:100%;overflow:hidden;background:#05070a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    #game-canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
    #ui-layer{position:absolute;inset:0;pointer-events:none;z-index:10}
    .top-bar{position:absolute;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));display:flex;justify-content:flex-start;gap:8px;pointer-events:none}
    .hud-badge{font-family:ui-monospace,monospace;font-size:11px;color:#e7c56a;background:rgba(10,13,18,.88);padding:7px 12px;border-radius:999px;border:1px solid rgba(231,197,106,.26);white-space:nowrap;backdrop-filter:blur(8px);box-shadow:0 6px 18px rgba(0,0,0,.22)}
    .action-bar{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));right:max(12px,env(safe-area-inset-right));display:grid;grid-template-columns:repeat(2,52px) 62px;grid-template-rows:repeat(2,52px);gap:8px;pointer-events:auto}
    .stone-slot{position:relative;width:52px;height:52px;border-radius:50%;background:rgba(15,20,28,.92);border:2px solid #c9a24a;color:#f3d48b;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:8px;font-weight:700;overflow:hidden}
    .stone-slot.ultimate{grid-column:3;grid-row:1/span 2;width:62px;height:62px;border-color:#e5a93c}
    body.social-mode #action-bar-container{display:none!important}
    body.social-mode #kelo-stones-btn{display:none!important}
    .app-panel,#menu-sheet{position:absolute;top:52px;left:8px;width:min(350px,calc(100vw - 16px));max-height:82vh;background:rgba(13,17,23,.96);border:1px solid #3a465c;border-radius:12px;padding:12px;color:#c9d1d9;font-size:11px;z-index:110;overflow-y:auto;pointer-events:auto;display:none;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
    .app-panel *,#menu-sheet *{touch-action:pan-y}
    #menu-sheet{top:max(132px,calc(env(safe-area-inset-top) + 120px));left:auto;right:max(12px,env(safe-area-inset-right));bottom:auto;width:min(356px,calc(100vw - 24px));max-height:min(68vh,560px);border:1px solid rgba(231,197,106,.42);border-radius:20px;padding:14px;background:linear-gradient(180deg,rgba(18,21,27,.985),rgba(9,12,17,.985));box-shadow:0 24px 70px rgba(0,0,0,.55);backdrop-filter:blur(16px)}
    .panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;color:#e7c56a;font-weight:800;letter-spacing:.04em}
    .panel-subtitle{font-size:9px;color:#7d8590;margin-bottom:12px}
    .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .menu-btn{min-height:58px;background:rgba(255,255,255,.035);border:1px solid #2d333b;color:#e6edf3;padding:10px;border-radius:13px;font-size:11px;font-weight:750;text-align:left;display:flex;align-items:center;gap:9px}
    .menu-btn:active{transform:scale(.98);border-color:rgba(231,197,106,.48)}
    .menu-icon{width:28px;height:28px;border-radius:9px;background:rgba(231,197,106,.08);border:1px solid rgba(231,197,106,.16);display:grid;place-items:center;color:#e7c56a;font-size:15px;flex:0 0 28px}
    .menu-footer{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.06)}
    .menu-mini{background:rgba(231,197,106,.06);border:1px solid rgba(231,197,106,.18);color:#d7bd78;border-radius:11px;padding:9px;font-size:10px;font-weight:700}
    .menu-close{border:0;background:transparent;color:#8b949e;font-size:22px;line-height:1;padding:2px 4px}
    #toast-container{position:absolute;top:max(66px,calc(env(safe-area-inset-top) + 58px));left:50%;transform:translateX(-50%);width:min(320px,calc(100vw - 32px));z-index:200;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
    .toast{max-width:100%;padding:8px 12px;border-radius:10px;border:1px solid rgba(231,197,106,.45);background:rgba(10,13,18,.94);color:#f3d48b;font-size:12px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.35)}
    #kelo-online,.lx-mark,#kelo-minimap,#minimap{display:none!important}
  </style>
</head>
