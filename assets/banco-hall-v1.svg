<svg xmlns="http://www.w3.org/2000/svg" width="160" height="128" viewBox="0 0 160 128" shape-rendering="crispEdges">
  <rect width="160" height="128" fill="none"/>
  <!-- stepped shadow gives the hall a readable footprint without changing gameplay geometry -->
  <rect x="12" y="116" width="136" height="8" fill="#6f6657" opacity=".55"/>
  <rect x="8" y="40" width="144" height="80" fill="#d8d0bd"/>
  <rect x="12" y="44" width="136" height="72" fill="#eee7d5"/>

  <!-- authored stepped hip roof: narrower crown, corner caps and deep eaves -->
  <rect x="28" y="8" width="104" height="4" fill="#253b36"/>
  <rect x="20" y="12" width="120" height="8" fill="#456f62"/>
  <rect x="12" y="20" width="136" height="8" fill="#395d52"/>
  <rect x="8" y="28" width="144" height="12" fill="#2f4a43"/>
  <rect x="4" y="36" width="152" height="8" fill="#243c36"/>
  <rect x="24" y="12" width="8" height="8" fill="#527d6f"/>
  <rect x="128" y="12" width="8" height="8" fill="#29463e"/>
  <rect x="12" y="28" width="12" height="8" fill="#4b7568"/>
  <rect x="136" y="28" width="12" height="8" fill="#223630"/>
  <rect x="36" y="12" width="4" height="16" fill="#5d8879" opacity=".75"/>
  <rect x="116" y="12" width="4" height="16" fill="#203c35" opacity=".65"/>

  <!-- small central pediment breaks the box silhouette on mobile -->
  <rect x="56" y="4" width="48" height="8" fill="#304e45"/>
  <rect x="64" y="0" width="32" height="4" fill="#3f665a"/>
  <rect x="60" y="12" width="40" height="8" fill="#23312d"/>
  <rect x="68" y="8" width="24" height="4" fill="#d4b55e"/>

  <!-- facade band + columns -->
  <rect x="20" y="44" width="120" height="8" fill="#b89a52"/>
  <rect x="24" y="52" width="16" height="52" fill="#c8b47b"/>
  <rect x="120" y="52" width="16" height="52" fill="#c8b47b"/>
  <rect x="28" y="56" width="8" height="44" fill="#f5eedc"/>
  <rect x="124" y="56" width="8" height="44" fill="#f5eedc"/>
  <rect x="20" y="52" width="24" height="4" fill="#a88d4c"/>
  <rect x="116" y="52" width="24" height="4" fill="#a88d4c"/>

  <!-- windows with asymmetrical highlights for less procedural repetition -->
  <rect x="48" y="56" width="24" height="28" fill="#5f8f8b"/>
  <rect x="52" y="60" width="16" height="20" fill="#a9d2c8"/>
  <rect x="52" y="60" width="4" height="8" fill="#d8eee7"/>
  <rect x="88" y="56" width="24" height="28" fill="#5f8f8b"/>
  <rect x="92" y="60" width="16" height="20" fill="#9bc9c0"/>
  <rect x="104" y="64" width="4" height="12" fill="#cfe8e1"/>

  <!-- recessed entrance -->
  <rect x="64" y="68" width="32" height="48" fill="#253934"/>
  <rect x="68" y="72" width="24" height="44" fill="#45645c"/>
  <rect x="72" y="76" width="8" height="36" fill="#a9d2c8"/>
  <rect x="84" y="76" width="4" height="36" fill="#83b6ad"/>
  <rect x="76" y="92" width="4" height="4" fill="#d4b55e"/>
  <rect x="60" y="64" width="40" height="4" fill="#b89a52"/>

  <!-- base and corner stone blocks -->
  <rect x="16" y="104" width="128" height="8" fill="#a69b84"/>
  <rect x="8" y="112" width="144" height="8" fill="#817764"/>
  <rect x="12" y="108" width="16" height="4" fill="#c5bca8"/>
  <rect x="132" y="108" width="16" height="4" fill="#766d5d"/>
</svg>